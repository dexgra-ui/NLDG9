name: Apply Remaining Accessibility Corrections

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-accessibility-followup.yml'

permissions:
  contents: write

jobs:
  fix:
    name: Correct remaining labels and headings
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          dashboard = Path('dashboard.html')
          text = dashboard.read_text(encoding='utf-8')
          old = '<select id="prayer-study">'
          new = '<select id="prayer-study" aria-label="Study connected to this prayer">'
          if old not in text:
              raise SystemExit('Expected prayer-study select was not found.')
          dashboard.write_text(text.replace(old, new, 1), encoding='utf-8')

          games = Path('games.html')
          text = games.read_text(encoding='utf-8')
          text = text.replace('.menu-card h4{', '.menu-card h3{', 1)
          labels = [
              'Preschool','Kids','Teens','Adults','Family Play','Church Tournament',
              'Scripture or Suspicion','Bible Jeopardy','Who Am I?','Finish the Verse',
              'Numbered Memory Match','Lightning Round'
          ]
          for label in labels:
              old = f'<h4>{label}</h4>'
              new = f'<h3>{label}</h3>'
              if old not in text:
                  raise SystemExit(f'Expected menu heading not found: {label}')
              text = text.replace(old, new, 1)
          games.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: git rm .github/workflows/fix-accessibility-followup.yml

      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix remaining accessibility findings"
          git pull --rebase origin main
          git push
