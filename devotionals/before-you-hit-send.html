<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06122d"><meta name="description" content="Following Jesus should shape not only what we say face to face, but also what we type, post, share, and send."><title>Before You Hit Send | No Labels, Designed by God</title><link rel="canonical" href="https://nolabelsdesignedbygod.org/devotionals/before-you-hit-send.html"><link rel="alternate" hreflang="en" href="https://nolabelsdesignedbygod.org/devotionals/before-you-hit-send.html"><link rel="alternate" hreflang="es" href="https://nolabelsdesignedbygod.org/es/antes-de-presionar-enviar.html"><link rel="alternate" hreflang="x-default" href="https://nolabelsdesignedbygod.org/devotionals/before-you-hit-send.html"><meta property="og:type" content="article"><meta property="og:site_name" content="No Labels, Designed by God"><meta property="og:title" content="Before You Hit Send"><meta property="og:description" content="Truth matters, but so does the way we speak it. Before our words leave us, we should ask what they are going to build."><meta property="og:url" content="https://nolabelsdesignedbygod.org/devotionals/before-you-hit-send.html"><meta property="og:image" content="https://nolabelsdesignedbygod.org/no-labels-approved-logo.png"><meta property="og:image:alt" content="No Labels, Designed by God ministry logo"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Before You Hit Send"><meta name="twitter:description" content="A devotional from Ephesians 4:29 about words, wisdom, and everyday discipleship."><meta name="twitter:image" content="https://nolabelsdesignedbygod.org/no-labels-approved-logo.png"><script id="nldg-structured-data" type="application/ld+json">{"@context":"https://schema.org","@type":"BlogPosting","headline":"Before You Hit Send","description":"Following Jesus should shape not only what we say face to face, but also what we type, post, share, and send. Before our words leave us, we should ask what they are going to build.","mainEntityOfPage":"https://nolabelsdesignedbygod.org/devotionals/before-you-hit-send.html","author":{"@type":"Person","name":"Dexter Graham"},"publisher":{"@type":"Organization","name":"No Labels, Designed by God"},"articleSection":"Words, Wisdom, and Everyday Discipleship","about":"Ephesians 4:29"}</script><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../devotionals-v2.css"></head><body><header class="site-header"><a class="brand" href="../index.html"><span class="brand-icon brand-logo"><img src="../no-labels-approved-logo.png" alt=""></span><span><strong>No Labels, Designed by God</strong><small>Devotional Center</small></span></a><button class="menu" aria-expanded="false">Menu</button><nav><a href="../index.html">Home</a><a href="../studies.html">Bible Studies</a><a class="active" href="../devotionals.html">Devotionals</a><a href="../articles.html">Articles</a><a href="../resource-center.html">Resources</a></nav></header><main class="reader-shell"></main><footer class="ministry-footer"><small>© <span data-year>2026</span> No Labels Designed by God, LLC.</small></footer><script src="../devotional-data.js?v=1.2.0"></script><script>if(!window.NLDG_DEVOTIONALS?.some(item=>item.id==='before-you-hit-send'))window.NLDG_DEVOTIONALS.unshift({"id":"before-you-hit-send","theme":"Words, Wisdom, and Everyday Discipleship","title":"Before You Hit Send","reference":"Ephesians 4:29","minutes":"7-minute devotional","summary":"Following Jesus should shape not only what we say face to face, but also what we type, post, share, and send. Before our words leave us, we should ask what they are going to build.","scriptureFocus":"“Do not let any unwholesome talk come out of your mouths, but only what is helpful for building others up according to their needs, that it may benefit those who listen.” Ephesians 4:29 (NIV)","reflection":["There used to be a little more time between having a thought and sharing it with the world. You had to say it to someone. Write a letter. Make a phone call. Maybe wait until you saw the person again.","Now all it takes is a few seconds. Type. Post. Send. And sometimes regret it later.","Technology has made communication easier. It has not necessarily made us better communicators.","Paul obviously did not have social media in mind when he wrote Ephesians 4, but the principle still applies. Our words matter. That includes the words we type. The comments. The posts. The text messages. The emails. The things we share because they made us angry. The things we say because we want to win.","Paul gives us an interesting standard. He does not simply say, “Make sure what you say is true.” Truth matters. But he goes further. He asks whether our words are helpful for building others up.","That makes the standard harder. Because something can be technically true and still be unnecessarily cruel. I can be correct and still be unkind. I can expose somebody else's mistake while ignoring my own attitude. I can win the argument and damage the person. I can defend Jesus in a way that looks nothing like Jesus.","That last one should make us uncomfortable.","Sometimes Christians act as though having the right position gives us permission to say whatever we want, however we want to say it. But Scripture does not separate truth from character. How we speak is part of our discipleship.","That does not mean we avoid disagreement. Jesus disagreed with people. Paul confronted people. There are times when something needs to be said clearly. Love is not pretending everything is fine when it is not.","But there is a difference between speaking truth and using truth as a weapon. There is a difference between correcting someone and humiliating them. There is a difference between challenging an idea and attacking the person holding it.","Social media makes those lines easy to cross. We are often talking to usernames instead of looking into someone's eyes. We forget there is a human being on the other side of the screen. Someone with a story. Someone with wounds. Someone created in the image of God.","And sometimes the audience changes us too. Instead of responding to the person, we start performing for everybody watching. We want the clever response. The devastating comeback. The comment that gets the likes. The one our side will applaud.","But discipleship asks a different question. Not: “Can I say this?” Not even: “Am I right?” But: “What will these words produce?”","Will they build? Will they clarify? Will they help? Will they bring truth into the conversation without stripping another person of dignity? Will someone see something of Jesus in the way I respond? Or am I simply trying to hurt someone who irritated me?","James tells us to be quick to listen, slow to speak, and slow to become angry. Maybe today we could add: Slow to hit send.","There have been times when I typed something and needed to delete it. Not because it was necessarily false. Because I knew why I was writing it. That matters too.","Sometimes the problem is not the sentence. It is the spirit behind the sentence.","Am I trying to help? Or am I trying to embarrass? Am I trying to understand? Or am I waiting for my turn to attack? Am I defending truth? Or am I defending my ego? Those are harder questions. And they require us to slow down.","Imagine what would happen if followers of Jesus became known for thoughtful speech in a culture built around instant reaction. Not silence. Not weakness. Not avoiding difficult conversations. But wisdom. Truth without cruelty. Conviction without contempt. Correction without humiliation. Disagreement without dehumanization.","That would look different. And maybe that difference would say something about Jesus.","The world already has enough people shouting at one another. We do not need to add more noise simply because we can. Our words should carry the character of the One we claim to follow.","So before you post it. Before you share it. Before you answer the text. Before you fire off the email. Before you leave the comment. Take a moment. Read it again. And ask: Does this need to be said? Is it true? Is this the right way to say it? And what will these words build? Then decide whether to hit send."],"questions":["Do your online words reflect the same character you want people to see in you face to face?","Have you ever said something that was technically true but unnecessarily hurtful?","What usually happens to your words when you become angry?","Are there conversations where you are more interested in winning than understanding?","If someone knew nothing about Jesus except what they saw in the way you communicate, what picture of Him would they receive?"],"action":["Before responding to something that frustrates you today, wait a few minutes.","Read your response again before sending it.","Ask yourself: Is it true? Is it necessary? Is it helpful? Can I say it without stripping someone of dignity?","If the answer is no, rewrite it or do not send it.","And sometime today, intentionally use your words to build someone up. Send encouragement. Thank someone. Recognize something good. Speak life where you could easily have remained silent."],"prayer":"Father, thank You for the gift of words and the ability to communicate with others. Forgive me for the times I have used my words carelessly, spoken out of anger, or cared more about winning an argument than representing You well. Give me wisdom before I speak and patience before I respond. Help me tell the truth without cruelty, disagree without contempt, and correct without humiliating. Remind me that the person on the other side of the conversation is someone You created and love. May my words, spoken or typed, reflect the character of Jesus and build rather than destroy. In His name, Amen."});</script><script src="../seo.js?v=1.0.0"></script><script src="../devotional-reader.js?v=1.2.0"></script><script>const menu=document.querySelector('.menu');menu?.addEventListener('click',()=>{const open=document.body.classList.toggle('nav-open');menu.setAttribute('aria-expanded',String(open));menu.textContent=open?'Close':'Menu'});document.querySelectorAll('[data-year]').forEach(el=>el.textContent=new Date().getFullYear());</script></body></html>
