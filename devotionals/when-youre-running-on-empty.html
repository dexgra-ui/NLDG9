<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06122d"><meta name="description" content="Jesus never asked us to pretend we are not tired. He invites weary people to come to Him and discover that rest is part of faithful discipleship too."><title>When You're Running on Empty | No Labels, Designed by God</title><link rel="canonical" href="https://nolabelsdesignedbygod.org/devotionals/when-youre-running-on-empty.html"><link rel="alternate" hreflang="en" href="https://nolabelsdesignedbygod.org/devotionals/when-youre-running-on-empty.html"><link rel="alternate" hreflang="es" href="https://nolabelsdesignedbygod.org/es/cuando-te-estas-quedando-sin-fuerzas.html"><link rel="alternate" hreflang="x-default" href="https://nolabelsdesignedbygod.org/devotionals/when-youre-running-on-empty.html"><meta property="og:type" content="article"><meta property="og:site_name" content="No Labels, Designed by God"><meta property="og:title" content="When You're Running on Empty"><meta property="og:description" content="Your value to God is not measured by how exhausted you can become serving Him. Jesus invites weary people to come to Him."><meta property="og:url" content="https://nolabelsdesignedbygod.org/devotionals/when-youre-running-on-empty.html"><meta property="og:image" content="https://nolabelsdesignedbygod.org/no-labels-approved-logo.png"><meta property="og:image:alt" content="No Labels, Designed by God ministry logo"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="When You're Running on Empty"><meta name="twitter:description" content="A devotional from Matthew 11:28–30 about rest, limits, burdens, and dependence on Jesus."><meta name="twitter:image" content="https://nolabelsdesignedbygod.org/no-labels-approved-logo.png"><script id="nldg-structured-data" type="application/ld+json">{"@context":"https://schema.org","@type":"BlogPosting","headline":"When You're Running on Empty","description":"Jesus never asked us to pretend we are not tired. He invites weary people to come to Him and discover that rest is part of faithful discipleship too.","mainEntityOfPage":"https://nolabelsdesignedbygod.org/devotionals/when-youre-running-on-empty.html","datePublished":"2026-10-05","dateModified":"2026-10-05","author":{"@type":"Person","name":"Dexter Graham"},"publisher":{"@type":"Organization","name":"No Labels, Designed by God"},"articleSection":"Rest and Dependence on God","about":"Matthew 11:28–30"}</script><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../devotionals-v2.css"></head><body><header class="site-header"><a class="brand" href="../index.html"><span class="brand-icon brand-logo"><img src="../no-labels-approved-logo.png" alt=""></span><span><strong>No Labels, Designed by God</strong><small>Devotional Center</small></span></a><button class="menu" aria-expanded="false">Menu</button><nav><a href="../index.html">Home</a><a href="../studies.html">Bible Studies</a><a class="active" href="../devotionals.html">Devotionals</a><a href="../articles.html">Articles</a><a href="../resource-center.html">Resources</a></nav></header><main class="reader-shell"></main><footer class="ministry-footer"><small>© <span data-year>2026</span> No Labels Designed by God, LLC.</small></footer><script src="../devotional-data.js?v=1.2.0"></script><script>if(!window.NLDG_DEVOTIONALS?.some(item=>item.id==='when-youre-running-on-empty'))window.NLDG_DEVOTIONALS.unshift({"id":"when-youre-running-on-empty","theme":"Rest and Dependence on God","title":"When You're Running on Empty","reference":"Matthew 11:28–30","minutes":"6-minute devotional","summary":"Jesus never asked us to pretend we aren't tired. He invites weary people to come to Him and discover that rest is part of faithful discipleship too.","scriptureFocus":"“Come to me, all you who are weary and burdened, and I will give you rest.” Matthew 11:28 (NIV)","reflection":["Sometimes you are just tired. Not necessarily ready to quit. Not necessarily angry with God. Just tired.","I am good at telling myself to keep going. One more task. One more responsibility. One more person who needs something. One more thing that has to be finished before I can finally slow down.","And sometimes I need to remember that Jesus never asked me to prove my faithfulness by running myself empty.","Life has a way of piling responsibilities on top of responsibilities. Work needs something. Family needs something. Church needs something. Somebody calls. Something breaks. Another problem appears before you have finished dealing with the previous one.","Eventually you realize you are running on empty.","The dangerous thing is that we can become so accustomed to being tired that exhaustion starts to feel normal. We tell ourselves this is simply what responsible people do. We keep moving because stopping feels like letting somebody down.","Sometimes Christians can even make exhaustion sound spiritual. We convince ourselves that saying no means we are not committed enough. We feel guilty for resting because there is always another person to help, another need to meet, another ministry task to finish, another problem we could be solving.","But look at Jesus. Jesus served people constantly, yet He also withdrew from crowds. He prayed. He rested. He slept. He understood something we sometimes forget: We have limits.","Having limits is not a spiritual failure. It is part of being human.","Jesus' invitation in Matthew 11 is not directed toward people who have everything together. It is directed toward the weary and burdened. “Come to me.”","Notice what He does not say. He does not begin by giving tired people another assignment. He does not say, “Try harder.” He does not say, “Get more organized.” He does not say, “If your faith were stronger, you would not be tired.” He invites them closer.","Sometimes what we need most is not another strategy for becoming more productive. We need Jesus.","And there is a difference between simply stopping and truly resting. We can spend hours scrolling, watching television, playing games, shopping, or distracting ourselves and still wake up exhausted inside. Our bodies may have stopped moving while our minds and souls never became quiet.","Jesus offers something deeper. His rest reminds us that the world continues turning when we stop working. His rest reminds us that God is God and we are not. His rest gives us permission to admit, “I cannot carry everything.”","Maybe that is part of what some of us need to remember. We were never supposed to carry everything.","Some burdens belong to us. They are part of the responsibilities God has entrusted to us, and faithfulness means carrying them well. Other burdens we picked up because we did not know how to say no. Some belong to other people, but we have been trying to carry them anyway. And some belong to God. Wisdom is learning the difference.","There are also seasons when the burden is real and cannot simply be removed. Rest does not always mean our responsibilities disappear. Sometimes it means learning to receive strength from Jesus while we continue walking through a difficult season.","That is why His invitation matters so much. He does not merely promise an easier schedule. He offers Himself.","Following Jesus is a daily decision, but sometimes the faithful decision is not doing more. Sometimes it is stopping. Sometimes it is saying no. Sometimes it is asking for help. Sometimes it is going to bed. Sometimes it is turning everything off and sitting quietly with God. Sometimes it is simply praying, “Lord, I am tired.”","You do not have to impress Him with strength you do not have.","Your value to God is not measured by how exhausted you can become serving Him.","Before you were His worker, you were His child. That is a reminder I need too.","There will always be another task. There will always be something unfinished. There will always be another need somewhere. But Jesus is not waiting for us at the end of our exhaustion. He is inviting us to come to Him in the middle of it.","Come to Jesus. You do not have to arrive strong. Tired people are welcome too.","Jesus never asked you to run on empty. He invited you to come to Him."],"questions":["Are you physically tired, emotionally tired, mentally tired, spiritually tired, or some combination of them?","Have you confused being constantly busy with being faithful?","What are you carrying right now that is draining you?","Is there a burden you need to release instead of simply trying harder?","When was the last time you came to Jesus without an agenda other than needing Him?"],"action":["Identify one unnecessary burden or commitment you can release.","Before automatically saying yes to the next demand on your time, pause and pray.","Create one intentional period of quiet today. Put the phone down, turn off the noise, and spend a few minutes with God without trying to accomplish anything.","If you have been carrying something alone, ask someone you trust for help.","And if you are tired, tell Jesus the truth. You do not need an impressive prayer. “Lord, I am tired. Help me rest in You” is enough."],"prayer":"Jesus, thank You for welcoming me even when I am tired. Forgive me for the times I have tried to carry everything myself or measured my faithfulness by how much I could accomplish. Teach me when to work and when to rest. Give me wisdom to recognize the burdens You have entrusted to me, the ones I need to release, and the ones that belong to You. Quiet the noise in me and help me receive the rest You offer. Restore my body, mind, and spirit so that I can live and serve from a place of love rather than exhaustion. Remind me that I do not have to prove my worth to You. Before I was Your worker, I was Your child. Teach me to come to You when I am weary. In Jesus' name, Amen."});</script><script src="../seo.js?v=1.0.0"></script><script src="../devotional-reader.js?v=1.2.0"></script><script>const menu=document.querySelector('.menu');menu?.addEventListener('click',()=>{const open=document.body.classList.toggle('nav-open');menu.setAttribute('aria-expanded',String(open));menu.textContent=open?'Close':'Menu'});document.querySelectorAll('[data-year]').forEach(el=>el.textContent=new Date().getFullYear());</script></body></html>
