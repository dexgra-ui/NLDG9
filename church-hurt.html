<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06122d"><title>Church Hurt: Nine-Part Bible Study | NLDG</title><link rel="stylesheet" href="styles.css"><style>main{max-width:900px;margin:auto;padding:2rem 1.2rem 5rem;line-height:1.7}.hero{border-bottom:1px solid #aaa;padding-bottom:1.5rem}.controls{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center;margin:1.5rem 0}select{padding:.65rem;max-width:100%;color:#222;background:#fff;border:1px solid #666;border-radius:.4rem}.study-body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;font:inherit}.button-link{display:inline-block;padding:.6rem .9rem;border:1px solid currentColor;border-radius:.4rem}#part-index{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.6rem;list-style:none;padding:0}#part-index a{display:block;padding:.7rem;border:1px solid #999;border-radius:.4rem}#part-index a[aria-current="page"]{border-width:2px;font-weight:700}@media print{header,.controls,#part-index{display:none!important}}</style></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-icon brand-logo"><img src="no-labels-approved-logo.png" alt=""></span><span><strong>No Labels, Designed by God</strong><small>Church Hurt Bible Study</small></span></a><button class="menu" aria-expanded="false">Menu</button><nav></nav></header><main><section class="hero"><p>Nine-part Scripture-first Bible study</p><h1>Church Hurt: When the Body Wounds Its Own</h1><p id="intro" class="study-body"></p></section><nav class="controls" aria-label="Study navigation"><label for="part-select"><strong>Choose a study part</strong></label><select id="part-select"></select><button id="copy-link" type="button">Copy part link</button><span role="status" aria-live="polite" id="copy-status"></span></nav><article id="study-part"><h2 id="part-title"></h2><div id="part-content" class="study-body"></div></article><nav class="controls" id="prev-next" aria-label="Previous and next parts"></nav><section><h2>All nine parts</h2><ol id="part-index"></ol></section><section><h2>Life application, key truths, challenge and prayer</h2><div id="closing" class="study-body"></div></section><p><a href="studies.html">← Back to Bible Studies</a></p></main><script src="church-hurt-study-data.js?v=2"></script><script>(()=>{const data=window.NLDG_CHURCH_HURT_STUDY;const parts=data.parts;const requested=Number(new URLSearchParams(location.search).get('part')||1);const n=Number.isInteger(requested)&&requested>=1&&requested<=9?requested:1;const current=parts[n-1];const link=x=>'church-hurt.html?part='+x;document.getElementById('intro').textContent=data.intro;document.getElementById('part-title').textContent='Part '+n+': '+current.title;document.getElementById('part-content').textContent=current.text;document.getElementById('closing').textContent=data.closing;document.title=current.title+' | Church Hurt | NLDG';const select=document.getElementById('part-select');parts.forEach(p=>{const o=document.createElement('option');o.value=p.number;o.textContent=p.number+'. '+p.title;select.append(o)});select.value=String(n);select.addEventListener('change',()=>location.assign(link(select.value)));const nav=document.getElementById('prev-next');const addNav=(num,label)=>{const a=document.createElement('a');a.className='button-link';a.href=link(num);a.textContent=label;nav.append(a)};if(n>1)addNav(n-1,'← Previous part');if(n<9)addNav(n+1,'Next part →');const list=document.getElementById('part-index');parts.forEach(p=>{const li=document.createElement('li');const a=document.createElement('a');a.href=link(p.number);a.textContent=p.number+'. '+p.title;if(p.number===n)a.setAttribute('aria-current','page');li.append(a);list.append(li)});document.getElementById('copy-link').addEventListener('click',async()=>{const url=new URL(link(n),location.href).href;try{await navigator.clipboard.writeText(url);document.getElementById('copy-status').textContent='Link copied'}catch{window.prompt('Copy this part link',url)}})})();</script><script src="script.js"></script></body></html>
