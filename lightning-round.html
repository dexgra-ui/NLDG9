<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071735"><title>Lightning Round | No Labels, Designed by God</title><style>:root{--gold:#ffd34e;--text:#f7f9ff;--muted:#cbd5f3;--green:#35c779;--red:#ef5c5c;--line:rgba(255,255,255,.14)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#1d4c9e 0,#081735 42%,#030713 100%);color:var(--text)}button,select{font:inherit}.hidden{display:none!important}.app{max-width:1200px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px;border:1px solid var(--line);border-radius:18px;background:rgba(5,16,44,.94)}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}.brand img{width:52px;height:52px}.brand strong{display:block}.brand small{color:var(--muted)}.controls{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:12px;padding:11px 15px;font-weight:800;background:#243b78;color:#fff;text-decoration:none;cursor:pointer}.btn.primary{background:linear-gradient(#2454da,#15389a)}.btn.gold{background:linear-gradient(#fff0a4,var(--gold));color:#2d2400}.hero{text-align:center;padding:48px 12px 28px}.hero h1{font-size:clamp(42px,8vw,86px);line-height:.95;margin:0}.hero p{color:var(--muted);font-size:1.15rem}.setup{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:20px;border:1px solid var(--line);border-radius:20px;background:rgba(10,25,64,.88)}label{display:grid;gap:7px;font-weight:800;color:var(--muted)}select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#071735;color:#fff}.setup-actions{grid-column:1/-1;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:18px 0 umns:1fr}.question{padding:16px;min-height:220px}}@media(max-width:520px){.setup{grid-template-columns:1fr}}</style></head><body><div class="app"><header class="top"><a class="brand" href="play.html"><img src="no-labels-approved-logo.png" alt=""><span><strong>No Labels Games</strong><small>Lightning Round</small></span></a><div class="controls"><a class="btn" href="play.html">Game Center</a><button id="fullscreen" class="btn">Fullscreen</button></div></header><section id="setupView"><div class="hero"><h1>Lightning Round</h1><p>Answer fast before the timer reaches zero.</p></div><div class="setup"><label>Audience<select id="group"><option value="preschool">Preschool</option><option value="kids">Kids</option><option value="teens">Teens</option><option value="adults">Adults</option><option value="family" selected>Family</option></select></label><label>Questions<select id="length"><option>10</option><option selected>15</option><option>20</option><option>25</option></select></label><label>Seconds<select id="seconds"><option value="10">10</option><option value="15" selected>15</option><option value="20">20</option></select></label><label>Play mode<select id="mode"><option value="teams" selected>Two Teams</option><option value="solo">Solo</option></select></label><div class="setup-actions"><button id="start" class="btn gold">Start Game</button><button id="resetHistory" class="btn">Reset Recent Questions</button></div></div><div class="stats"><span class="stat" id="bankCount"></span><span class="stat">Timed questions</span><span class="stat">Recent questions rotate out</span></div></section><section id="gameView" class="hidden"><div id="scoreboard" class="scoreboard"><div class="team active"><strong>Team Grace</strong><span>0</span></div><div class="team"><strong>Team Truth</strong><span>0</span></div></div><div class="game"><div class="game-head"><button id="quit" class="btn">← Exit</button><strong id="counter"></strong><div id="timer" class="timer">15</div></div><div class="progress"><span id="bar"></span></div><div id="question" class="question"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback"></div><div class="game-actions"><button id="next" class="btn primary hidden">Next Question</button></div></div></section><section id="completeView" class="complete hidden"><h2>Round Complete!</h2><p id="summary"></p><div class="game-actions"><button id="again" class="btn gold">Play Again</button><a class="btn" href="play.html">Return to Game Center</a></div></section></div><script>

["Who confronted David after his sin?","Nathan",["Nathan","Elijah","Amos","Micah"]],["Who wrote Luke and Acts?","Luke",["Luke","Mark","Paul","John"]],["Who was Paul's young companion?","Timothy",["Timothy","Titus","Silas","Barnabas"]],["Who explained Isaiah to an Ethiopian?","Philip",["Philip","Peter","Stephen","Barnabas"]],["Who said, 'Here am I; send me'?","Isaiah",["Isaiah","Jeremiah","Ezekiel","Hosea"]],["Who was called the son of encouragement?","Barnabas",["Barnabas","Silas","Stephen","Timothy"]],["Who was the first Christian martyr in Acts?","Stephen",["Stephen","James","Philip","Paul"]],["Who taught Apollos with Aquila?","Priscilla",["Priscilla","Lydia","Phoebe","Dorcas"]],["Who met Jesus on the Damascus road?","Saul",["Saul","Peter","Philip","Thomas"]],["Who asked Jesus about being born again?","Nicodemus",["Nicodemus","Jairus","Zacchaeus","Joseph"]],["Who doubted until seeing Jesus' wounds?","Thomas",["Thomas","Peter","Andrew","Philip"]],["Who replaced Judas?","Matthias",["Matthias","Barnabas","Silas","Mark"]],["Who sold purple cloth in Philippi?","Lydia",["Lydia","Phoebe","Priscilla","Dorcas"]],["Who was the Roman centurion in Acts 10?","Cornelius",["Cornelius","Jairus","Felix","Festus"]],["Where were believers first called Christians?","Antioch",["Antioch","Rome","Corinth","Ephesus"]],["Where did Paul speak at the Areopagus?","Athens",["Athens","Rome","Corinth","Philippi"]],["Which book contains the armor of God?","Ephesians",["Ephesians","Romans","James","Hebrews"]],["Which book says faith without works is dead?","James",["James","Romans","Galatians","Acts"]],["What happened at Pentecost?","The Holy Spirit came",["The Holy Spirit came","Jesus was born","Paul was converted","Jericho fell"]],["Who wrote Revelation?","John",["John","Peter","Paul","Luke"]]],adults:[

["Who built the ark?","Noah",["Noah","Moses","David","Daniel"]],["Who defeated Goliath?","David",["David","Samson","Joshua","Saul"]],["Who was swallowed by a great fish?","Jonah",["Jonah","Joseph","John","Joel"]],["Who interpreted Pharaoh's dreams?","Joseph",["Joseph","Joshua","Daniel","Samuel"]],["Who became queen and saved her people?","Esther",["Esther","Ruth","Deborah","Miriam"]],["Who led Israel out of Egypt?","Moses",["Moses","Aaron","Joshua","Caleb"]],["Who was in the lions' den?","Daniel",["Daniel","David","Samson","Jeremiah"]],["Who asked God for wisdom?","Solomon",["Solomon","Saul","Samuel","Samson"]],["Who baptized Jesus?","John the Baptist",["John the Baptist","Peter","Andrew","Philip"]],["Who denied Jesus three times?","Peter",["Peter","Thomas","Matthew","James"]],["Who was taken up in a whirlwind?","Elijah",["Elijah","Elisha","Isaiah","Enoch"]],["Who rebuilt Jerusalem's walls?","Nehemiah",["Nehemiah","Ezra","Zerubbabel","Mordecai"]],["Who stayed with Naomi?","Ruth",["Ruth","Esther","Rahab","Hannah"]],["Who fought with 300 men?","Gideon",["Gideon","Samson","Barak","Joshua"]],["Who climbed a tree to see Jesus?","Zacchaeus",["Zacchaeus","Matthew","Nicodemus","Jairus"]],["Who met Jesus on the Damascus road?","Saul",["Saul","Peter","Philip","Thomas"]],["Who was the first martyr in Acts?","Stephen",["Stephen","James","Philip","Barnabas"]],["Who was Paul's young companion?","Timothy",["Timothy","Titus","Silas","Mark"]],["Who sold purple cloth?","Lydia",["Lydia","Phoebe","Priscilla","Dorcas"]],["Who doubted the resurrection?","Thomas",["Thomas","Peter","Andrew","Philip"]],["Who carried Jesus' cross?","Simon of Cyrene",["Simon of Cyrene","Simon Peter","Andrew","Joseph"]],["Who wrote Luke and Acts?","Luke",["Luke","Mark","Paul","John"]],["Who said, 'Here am I; send me'?","Isaiah",["Isaiah","Jeremiah","Ezekiel","Hosea"]],["Where were believers first called Christians?","Antioch",["Antioch","Rome","Corinth","Ephesus"]],["Which book contains the armor of God?","Eph const $=id=>document.getElementById(id);let round=[],index=0,answered=false,activeTeam=0,scores=[0,0],soloCorrect=0,timerHandle=null;
function shuffle(items){const copy=[...items];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
function historyKey(group){return `nldg-lightning-recent-${group}`}
function chooseRound(group,count){const bank=BANK[group];let recent=[];try{recent=JSON.parse(localStorage.getItem(historyKey(group))||'[]')}catch{}const unseen=bank.filter(item=>!recent.includes(item[0]));const source=unseen.length>=count?unseen:bank;const selected=shuffle(source).slice(0,Math.min(count,source.length));localStorage.setItem(historyKey(group),JSON.stringify([...selected.map(item=>item[0]),...recent].slice(0,Math.max(5,bank.length-5))));return selected}
function updateBankCount(){$('bankCount').textContent=`${BANK[$('group').value].length} questions available`}
function start(){round=chooseRound($('group').value,Number($('length').value));index=0;activeTeam=0;scores=[0,0];soloCorrect=0;$('setupView').classList.add('hidden');$('completeView').classList.add('hidden');$('gameView').classList.remove('hidden');$('scoreboard').classList.toggle('hidden',$('mode').value==='solo');renderScore();render()}
function render(){clearInterval(timerHandle);if(index>=round.length){finish();return}answered=false;const [question,,choices]=round[index];$('question').textContent=question;$('counter').textContent=`${index+1} of ${round.length}`;$('bar').style.width=`${index/round.length*100}%`;$('feedback').textContent='';$('next').classList.add('hidden');$('answers').innerHTML='';shuffle(choices).forEach(choice=>{const button=document.createElement('button');button.className='answer';button.textContent=choice;button.onclick=()=>answer(choice,button);$('answers').appendChild(button)});startTimer(Number($('seconds').value))}
function startTimer(seconds){let remaining=seconds;$('timer').textContent=remaining;$('timer').classList.remove('danger');timerHandle=setInterval(()=>{remaining--;$('timer').textContent=remaining;$('timer').classList.toggle('danger',remaining<=5);if(remaining<=0){clearInterval(timerHandle);timeUp()}},1000)}
function timeUp(){if(answered)return;answered=true;const correct=round[index][1];document.querySelectorAll('.answer').forEach(btn=>{btn.disabled=true;if(btn.textContent===correct)btn.classList.add('correct')});$('feedback').textContent=`Time is up! The answer is ${correct}.`;$('next').classList.remove('hidden')}
function answer(choice,button){if(answered)return;answered=true;clearInterval(timerHandle);const correct=round[index][1];document.querySelectorAll('.answer').forEach(btn=>{btn.disabled=true;if(btn.textContent===correct)btn.classList.add('correct')});if(choice===correct){button.classList.add('correct');$('feedback').textContent='Correct!';if($('mode').value==='solo')soloCorrect++;else scores[activeTeam]+=100}else{button.classList.add('wrong');$('feedback').textContent=`The answer is ${correct}.`}renderScore();$('next').classList.remove('hidden')}
function renderScore(){document.querySelectorAll('.team').forEach((card,i)=>{card.classList.toggle('active',i===activeTeam);card.querySelector('span').textContent=scores[i]})}
function next(){index++;if($('mode').value==='teams')activeTeam=(activeTeam+1)%2;renderScore();render()}
function finish(){clearInterval(timerHandle);$('gameView').classList.add('hidden');$('completeView').classList.remove('hidden');$('summary').textContent=$('mode').value==='solo'?`You answered ${soloCorrect} of ${round.length} correctly.`:`Team Grace: ${scores[0]} points • Team Truth: ${scores[1]} points`}
$('start').onclick=start;$('next').onclick=next;$('again').onclick=()=>{$('completeView').classList.add('hidden');$('setupView').classList.remove('hidden')};$('quit').onclick=()=>{if(confirm('Exit this round?')){clearInterval(timerHandle);$('gameView').classList.add('hidden');$('setupView').classList.remove('hidden')}};$('group').onchange=updateBankCount;$('resetHistory').onclick=()=>{Object.keys(BANK).forEach(group=>localStorage.removeItem(historyKey(group)));alert('Recent-question history has been reset.')};$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{alert('Fullscreen is blocked here. On iPad, use Share → Add to Home Screen.')}};updateBankCount();
</script></body></html>
