name: Spanish Ephesians Audit

on:
  push:
    paths:
      - 'ephesians-study.html'
      - 'ephesians-study-data.js'
      - 'ephesians-study-guide.js'
      - 'ephesians-study-data-es.js'
      - 'es/efesios-estudio.html'
      - 'es/estudios-biblicos.html'
      - 'nldg-i18n.js'
      - 'book-study-series.js'
      - 'book-study-series-es.js'
      - 'scripts/spanish-ephesians-audit.mjs'
      - 'scripts/spanish-colossians-audit.mjs'
      - '.github/workflows/spanish-ephesians-audit.yml'
  pull_request:
    paths:
      - 'ephesians-study.html'
      - 'ephesians-study-data.js'
      - 'ephesians-study-guide.js'
      - 'ephesians-study-data-es.js'
      - 'es/efesios-estudio.html'
      - 'es/estudios-biblicos.html'
      - 'nldg-i18n.js'
      - 'book-study-series.js'
      - 'book-study-series-es.js'
      - 'scripts/spanish-ephesians-audit.mjs'
      - 'scripts/spanish-colossians-audit.mjs'
      - '.github/workflows/spanish-ephesians-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spanish-ephesians:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit Spanish Ephesians study
        run: node scripts/spanish-ephesians-audit.mjs
