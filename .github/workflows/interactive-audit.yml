name: Interactive Feature Audit

# QA rerun: presentation team setup and notice overlay corrected.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/interactive-audit.yml'
      - 'scripts/interactive-audit.mjs'
      - 'personalization.js'
      - 'dashboard.js'
      - 'study-experience.js'
      - 'unified-library.js'
      - 'new-believer-step.html'
      - 'new-believer-complete.html'
      - 'new-believer-mentor-session.html'
      - 'games.html'
      - 'search.html'
      - 'topics.html'
      - 'scripture-index.html'
      - 'study-library.html'
      - 'marriage-family-study.html'

permissions:
  contents: read

jobs:
  interactive:
    name: Study, library, dashboard, explorer, path, mentor, and games
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/nldg-http.log 2>&1 &
          echo $! > /tmp/nldg-http.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nldg-http.log
          exit 1

      - name: Run interactive audit
        run: node scripts/interactive-audit.mjs

      - name: Upload interactive report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interactive-audit
          path: interactive-audit-results
          if-no-files-found: error
