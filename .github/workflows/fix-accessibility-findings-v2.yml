name: Apply Accessibility Corrections V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-accessibility-findings-v2.yml'

permissions:
  contents: write

jobs:
  fix:
    name: Correct labels, contrast, and heading structure
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:90]}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once('games.html', '.btn.danger{background:var(--red)}', '.btn.danger{background:#a82b3a}')
          replace_once('games.html', '<h3 class="section-title"><span id="groupLabel">Kids</span> Game Library</h3>', '<h2 class="section-title"><span id="groupLabel">Kids</span> Game Library</h2>')
          replace_once('games.html', '<input class="score-team-name" data-team-name="${index}" value="${escapeHtml(team.name)}">', '<input class="score-team-name" data-team-name="${index}" aria-label="Team ${index+1} name" value="${escapeHtml(team.name)}">')

          replace_once('dashboard.html', '<select name="category">', '<select name="category" aria-label="Goal category">')
          replace_once('dashboard.html', '<select name="studyId" class="journey-study-link">', '<select name="studyId" class="journey-study-link" aria-label="Study connected to this goal">')
          replace_once('dashboard.html', '<select name="studyId" class="journey-study-link">', '<select name="studyId" class="journey-study-link" aria-label="Study connected to this reflection">')
          replace_once('dashboard.html', '<select name="translation">', '<select name="translation" aria-label="Memory verse translation">')
          replace_once('dashboard.html', '<select id="prayer-category">', '<select id="prayer-category" aria-label="Prayer category">')
          PY

      - name: Remove one-time workflows
        run: |
          git rm -f .github/workflows/fix-accessibility-findings.yml
          git rm -f .github/workflows/fix-accessibility-findings-v2.yml

      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix accessibility audit findings"
          git pull --rebase origin main
          git push
