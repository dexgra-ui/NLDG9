<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071735">
<title>Scripture or Suspicion | No Labels, Designed by God</title>
<style>
:root{--bg:#030713;--panel:#0a1940;--panel2:#132e70;--gold:#ffd34e;--text:#f7f9ff;--muted:#cbd5f3;--green:#35c779;--red:#ef5c5c;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:radial-gradient(circle at top,#1d4c9e 0,#081735 42%,#030713 100%);color:var(--text)}button,select,input{font:inherit}.hidden{display:none!important}
.app{max-width:1200px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px;border:1px solid var(--line);border-radius:18px;background:rgba(5,16,44,.94);position:sticky;top:8px;z-index:10}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}.brand img{width:52px;height:52px;object-fit:contain}.brand strong{display:block}.brand small{color:var(--muted)}.controls{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:12px;padding:11px 15px;font-weight:800;background:#243b78;color:white}.btn.primary{background:linear-gradient(#2454da,#15389a)}.btn.gold{background:linear-gradient(#fff0a4,var(--gold));color:#2d2400}.hero{text-align:center;padding:48px 12px 28px}.hero h1{font-size:clamp(42px,8vw,86px);line-height:.95;margin:0}.hero p{color:var(--muted);font-size:1.15rem}.setup{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:20px;border:1px solid var(--line);border-radius:20px;background:rgba(10,25,64,.88)}label{display:grid;gap:7px;font-weight:800;color:var(--muted)}select,input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#071735;color:white}.setup-actions{grid-column:1/-1;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:18px 0}.stat{padding:9px 13px;border-radius:999px;background:#12295e;color:var(--muted);font-weight:800}.game{padding:22px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(180deg,rgba(8,22,58,.98),rgba(3,10,30,.98));min-height:70vh;display:flex;flex-direction:column}.game-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.progress{height:14px;background:#162856;border-radius:999px;overflow:hidden;margin:15px 0}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#ff9f2e)}.question{flex:1;display:grid;place-items:center;text-align:center;font-size:clamp(34px,5vw,64px);line-height:1.08;font-weight:900;padding:24px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:15px}.answer{min-height:100px;border:2px solid var(--line);border-radius:18px;padding:20px;background:linear-gradient(#2855bf,#133584);color:white;font-size:clamp(24px,3vw,38px);font-weight:900}.answer.correct{background:linear-gradient(#43d588,#20965b)}.answer.wrong{background:linear-gradient(#f77272,#ba3030)}.feedback{text-align:center;min-height:48px;margin:14px;color:var(--gold);font-size:clamp(21px,3vw,34px);font-weight:900}.game-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.scoreboard{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}.team{padding:12px;border:1px solid var(--line);border-radius:14px;background:#0b1d4d;text-align:center}.team.active{outline:3px solid var(--gold)}.team strong{display:block}.team span{font-size:2rem;color:var(--gold);font-weight:900}.complete{text-align:center;padding:50px 20px}.complete h2{font-size:clamp(38px,6vw,68px)}
@media(max-width:760px){.setup{grid-template-columns:1fr}.answers{grid-template-columns:1fr}.top{position:static}.question{padding:16px;min-height:250px}.scoreboard{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<header class="top"><a class="brand" href="play.html"><img src="no-labels-approved-logo.png" alt=""><span><strong>No Labels Games</strong><small>Scripture or Suspicion</small></span></a><div class="controls"><a class="btn" href="play.html">Game Center</a><button id="fullscreen" class="btn">Fullscreen</button></div></header>
<section id="setupView">
<div class="hero"><h1>Scripture or Suspicion</h1><p>Decide whether each statement comes from Scripture or only sounds biblical.</p></div>
<div class="setup">
<label>Audience<select id="group"><option value="preschool">Preschool</option><option value="kids">Kids</option><option value="teens">Teens</option><option value="adults">Adults</option><option value="family" selected>Family</option></select></label>
<label>Questions<select id="length"><option>10</option><option selected>15</option><option>20</option><option>25</option></select></label>
<label>Play mode<select id="mode"><option value="teams" selected>Two Teams</option><option value="solo">Solo</option></select></label>
<div class="setup-actions"><button id="start" class="btn gold">Start Game</button><button id="resetHistory" class="btn">Reset Recent Questions</button></div>
</div>
<div class="stats"><span class="stat" id="bankCount"></span><span class="stat">No repeats during a round</span><span class="stat">Recent questions rotate out</span></div>
</section>
<section id="gameView" class="hidden">
<div id="scoreboard" class="scoreboard"><div class="team active" data-team="0"><strong>Team Grace</strong><span>0</span></div><div class="team" data-team="1"><strong>Team Truth</strong><span>0</span></div></div>
<div class="game"><div class="game-head"><button id="quit" class="btn">← Exit</button><strong id="counter"></strong></div><div class="progress"><span id="bar"></span></div><div id="question" class="question"></div><div id="answers" class="answers"><button class="answer" data-answer="Scripture">Scripture</button><button class="answer" data-answer="Suspicion">Suspicion</button></div><div id="feedback" class="feedback"></div><div class="game-actions"><button id="next" class="btn primary hidden">Next Question</button></div></div>
</section>
<section id="completeView" class="complete hidden"><h2>Round Complete!</h2><p id="summary"></p><div class="game-actions"><button id="again" class="btn gold">Play Again</button><a class="btn" href="play.html">Return to Game Center</a></div></section>
</div>
<script>
const BANK={
preschool:[
["Noah built an ark.","Scripture"],["David defeated Goliath.","Scripture"],["Jonah was swallowed by a lion.","Suspicion"],["Jesus was born in Bethlehem.","Scripture"],["Daniel spent the night with lions.","Scripture"],["Moses built the ark.","Suspicion"],["Jesus calmed a storm.","Scripture"],["Zacchaeus climbed a tree to see Jesus.","Scripture"],["Samson was known for great strength.","Scripture"],["Esther was swallowed by a great fish.","Suspicion"],["Mary was the mother of Jesus.","Scripture"],["Joseph had a coat given to him by his father.","Scripture"],["Peter built the tower of Babel.","Suspicion"],["God sent a rainbow after the flood.","Scripture"],["Daniel defeated Goliath.","Suspicion"]],
kids:[
["Jesus fed five thousand with five loaves and two fish.","Scripture"],["Moses led Israel around Jericho.","Suspicion"],["Paul and Silas sang while in prison.","Scripture"],["Jesus walked on water.","Scripture"],["Solomon asked God for wisdom.","Scripture"],["Samson's strength came from a golden sword.","Suspicion"],["Elijah was taken up in a whirlwind.","Scripture"],["Peter denied Jesus three times.","Scripture"],["Ruth became queen of Persia.","Suspicion"],["Joshua led Israel across the Jordan River.","Scripture"],["John the Baptist baptized Jesus.","Scripture"],["Joseph interpreted Pharaoh's dreams.","Scripture"],["David was the first king of Israel.","Suspicion"],["The walls of Jericho fell after Israel marched around the city.","Scripture"],["Miriam was Moses' sister.","Scripture"],["Paul was one of Jesus' original twelve disciples.","Suspicion"],["Jesus turned water into wine.","Scripture"],["Nehemiah rebuilt Jerusalem's wall.","Scripture"],["Abraham had a son named Isaac.","Scripture"],["Gideon fought with an army of three hundred men.","Scripture"]],
teens:[
["The Bereans examined the Scriptures daily.","Scripture"],["Paul taught that grace gives permission to continue in sin.","Suspicion"],["Jesus said peacemakers will be called children of God.","Scripture"],["Timothy was one of the original twelve apostles.","Suspicion"],["Philip explained Scripture to an Ethiopian official.","Scripture"],["Believers were first called Christians at Antioch.","Scripture"],["Ananias prayed for Saul after the Damascus road encounter.","Scripture"],["Stephen was the first king of Israel.","Suspicion"],["James teaches that hearing the Word without doing it is enough.","Suspicion"],["Paul compared the Christian life to running a race.","Scripture"],["Jesus said the greatest commandment is to love God.","Scripture"],["The fruit of the Spirit includes love, joy, and peace.","Scripture"],["The Bible says money itself is the root of all evil.","Suspicion"],["Jesus taught his followers to pray for their enemies.","Scripture"],["Barnabas was known as a son of encouragement.","Scripture"],["Thomas was absent when Jesus first appeared to the disciples after the resurrection.","Scripture"],["Paul wrote that believers should never test what they hear.","Suspicion"],["Micah called God's people to do justice, love mercy, and walk humbly.","Scripture"],["Jesus said truth will set people free.","Scripture"],["Peter wrote the book of Acts.","Suspicion"]],
adults:[
["The phrase 'God helps those who help themselves' is a Bible verse.","Suspicion"],["James teaches that faith without works is dead.","Scripture"],["Jesus said his kingdom is not of this world.","Scripture"],["The Bible teaches every hardship is caused by personal sin.","Suspicion"],["Phoebe is identified as a servant of the church at Cenchreae.","Scripture"],["Priscilla and Aquila helped explain the way of God more accurately to Apollos.","Scripture"],["Paul told Timothy that all Scripture is God-breathed.","Scripture"],["Ecclesiastes teaches that wealth always satisfies the person who loves it.","Suspicion"],["Romans teaches that suffering produces perseverance, character, and hope.","Scripture"],["Jesus promised his followers a life free from trouble.","Suspicion"],["The Jerusalem Council addressed whether Gentile believers had to be circumcised.","Scripture"],["Hosea married a woman named Gomer.","Scripture"],["Lydia was a seller of purple cloth.","Scripture"],["The armor of God is described in Philippians.","Suspicion"],["Paul spoke at the Areopagus in Athens.","Scripture"],["Hebrews describes faith as confidence in what is hoped for.","Scripture"],["The Bible says believers should repay evil for evil.","Suspicion"],["Jesus taught that greatness in his kingdom is shown through service.","Scripture"],["John received the Revelation while on Patmos.","Scripture"],["Galatians teaches that believers are justified by works of the law.","Suspicion"]],
family:[
["Noah built an ark.","Scripture"],["Jesus walked on water.","Scripture"],["Moses built the walls of Jericho.","Suspicion"],["Paul and Silas sang in prison.","Scripture"],["Esther was swallowed by a great fish.","Suspicion"],["David defeated Goliath.","Scripture"],["The phrase 'God helps those who help themselves' is a Bible verse.","Suspicion"],["James teaches that faith without works is dead.","Scripture"],["Jesus said his kingdom is not of this world.","Scripture"],["Daniel spent the night in a lions' den.","Scripture"],["Solomon asked God for wisdom.","Scripture"],["Peter was the first king of Israel.","Suspicion"],["Jesus fed five thousand with five loaves and two fish.","Scripture"],["Ruth became queen of Persia.","Suspicion"],["The Bereans examined the Scriptures daily.","Scripture"],["Jesus taught his followers to love their enemies.","Scripture"],["Paul was one of Jesus' original twelve disciples.","Suspicion"],["Joseph interpreted Pharaoh's dreams.","Scripture"],["The walls of Jericho fell after Israel marched around them.","Scripture"],["Samson's strength came from a golden sword.","Suspicion"],["Mary was the mother of Jesus.","Scripture"],["John the Baptist baptized Jesus.","Scripture"],["Jesus promised that believers would never face trouble.","Suspicion"],["The fruit of the Spirit includes love, joy, and peace.","Scripture"],["The Bible says money itself is the root of all evil.","Suspicion"]]};
const $=id=>document.getElementById(id);let round=[],index=0,answered=false,activeTeam=0,scores=[0,0],soloCorrect=0;
function shuffle(items){return [...items].sort(()=>Math.random()-.5)}
function historyKey(group){return `nldg-suspicion-recent-${group}`}
function chooseRound(group,count){const bank=BANK[group];let recent=[];try{recent=JSON.parse(localStorage.getItem(historyKey(group))||'[]')}catch{}const unseen=bank.filter(item=>!recent.includes(item[0]));const source=unseen.length>=count?unseen:bank;const selected=shuffle(source).slice(0,Math.min(count,source.length));const nextRecent=[...selected.map(item=>item[0]),...recent].slice(0,Math.min(bank.length-5,40));localStorage.setItem(historyKey(group),JSON.stringify(nextRecent));return selected}
function updateBankCount(){$('bankCount').textContent=`${BANK[$('group').value].length} questions available`}
function start(){round=chooseRound($('group').value,Number($('length').value));index=0;answered=false;activeTeam=0;scores=[0,0];soloCorrect=0;$('setupView').classList.add('hidden');$('completeView').classList.add('hidden');$('gameView').classList.remove('hidden');$('scoreboard').classList.toggle('hidden',$('mode').value==='solo');renderScore();render()}
function render(){if(index>=round.length){finish();return}answered=false;$('question').textContent=round[index][0];$('counter').textContent=`${index+1} of ${round.length}`;$('bar').style.width=`${index/round.length*100}%`;$('feedback').textContent='';$('next').classList.add('hidden');document.querySelectorAll('.answer').forEach(btn=>{btn.disabled=false;btn.classList.remove('correct','wrong')})}
function answer(choice,button){if(answered)return;answered=true;const correct=round[index][1];document.querySelectorAll('.answer').forEach(btn=>{btn.disabled=true;if(btn.dataset.answer===correct)btn.classList.add('correct')});if(choice===correct){button.classList.add('correct');$('feedback').textContent='Correct!';if($('mode').value==='solo')soloCorrect++;else scores[activeTeam]+=100}else{button.classList.add('wrong');$('feedback').textContent=`The answer is ${correct}.`}renderScore();$('next').classList.remove('hidden')}
function renderScore(){document.querySelectorAll('.team').forEach((card,i)=>{card.classList.toggle('active',i===activeTeam);card.querySelector('span').textContent=scores[i]})}
function next(){index++;if($('mode').value==='teams')activeTeam=(activeTeam+1)%2;renderScore();render()}
function finish(){$('gameView').classList.add('hidden');$('completeView').classList.remove('hidden');const text=$('mode').value==='solo'?`You answered ${soloCorrect} of ${round.length} correctly.`:`Team Grace: ${scores[0]} points. Team Truth: ${scores[1]} points.`;$('summary').textContent=text;$('bar').style.width='100%'}
function quit(){$('gameView').classList.add('hidden');$('completeView').classList.add('hidden');$('setupView').classList.remove('hidden')}
$('group').addEventListener('change',updateBankCount);$('start').onclick=start;$('quit').onclick=quit;$('again').onclick=quit;$('next').onclick=next;document.querySelectorAll('.answer').forEach(btn=>btn.onclick=()=>answer(btn.dataset.answer,btn));$('resetHistory').onclick=()=>{Object.keys(BANK).forEach(group=>localStorage.removeItem(historyKey(group)));alert('Recent-question history cleared.')};$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{alert('Use your browser fullscreen option or Add to Home Screen on iPad.')}};updateBankCount();
</script>
</body>
</html>
