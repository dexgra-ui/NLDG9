<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071735"><title>Team Game | No Labels, Designed by God</title><style>:root{--gold:#ffd34e;--text:#f7f9ff;--muted:#cbd5f3;--line:rgba(255,255,255,.16)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#1d4c9e 0,#081735 42%,#030713 100%);color:var(--text)}button,input,select{font:inherit;min-height:44px}.hidden{display:none!important}.setup{max-width:1100px;margin:24px auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border:1px solid var(--line);border-radius:18px;background:rgba(5,16,44,.95)}.brand{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none}.brand img{width:52px;height:52px;object-fit:contain}.brand strong{display:block}.brand small{color:var(--muted)}.btn{border:1px solid var(--line);border-radius:12px;padding:10px 13px;font-weight:900;background:#243b78;color:#fff;text-decoration:none;cursor:pointer;touch-action:manipulation}.btn.gold{background:linear-gradient(#fff0a4,var(--gold));color:#2d2400}.btn.green{background:#248d59}.btn.red{background:#9d3434}.btn.review{background:#5d3ca8}.hero{text-align:center;padding:42px 12px 24px}.hero h1{font-size:clamp(38px,7vw,74px);margin:0}.hero p{font-size:1.1rem;color:var(--muted)}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:20px;border:1px solid var(--line);border-radius:20px;background:rgba(10,25,64,.9)}label{display:grid;gap:7px;font-weight:900;color:var(--muted)}select,input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#071735;color:#fff}.names{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.actions{grid-column:1/-1;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.play-shell{height:100dvh;overflow:hidden;padding-top:140px}.scorebar{position:fixed;z-index:9999;top:0;left:0;right:0;display:grid;gap:8px;padding:8px;background:rgba(3,10,30,.98);border-bottom:2px solid rgba(255,211,78,.45);grid-template-columns:repeat(var(--team-count),minmax(125px,1fr));overflow-x:auto}.team{min-width:125px;padding:8px;border:2px solid var(--line);border-radius:13px;background:#0b1d4d;text-align:center;cursor:pointer;touch-action:manipulation}.team.active{outline:3px solid var(--gold)}.team.celebrate{animation:scorePulse .7s ease}.team strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.team span{display:block;color:var(--gold);font-size:1.65rem;font-weight:1000}.hostbar{position:fixed;z-index:10000;top:82px;left:8px;right:8px;display:flex;justify-content:center;gap:6px;flex-wrap:wrap}.hostbar .btn{padding:7px 9px;font-size:.82rem}.gameframe{width:100%;height:calc(100dvh - 140px);border:0;background:#030713}.award-panel{position:fixed;z-index:20000;left:50%;bottom:18px;transform:translateX(-50%);width:min(1100px,94vw);padding:12px;border:2px solid rgba(255,211,78,.5);border-radius:16px;background:rgba(3,10,30,.98);display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.award-panel button{border:0;border-radius:10px;padding:10px 13px;font-weight:900;background:#35c779;color:#fff;min-height:48px}.award-panel .none{background:#243b78}.status{position:fixed;z-index:11000;right:12px;bottom:12px;padding:8px 11px;border-radius:10px;background:rgba(3,10,30,.92);color:var(--muted);font-weight:800;font-size:.82rem}.celebration{position:fixed;z-index:30000;inset:0;pointer-events:none;overflow:hidden}.celebration span{position:absolute;top:-12vh;font-size:clamp(24px,5vw,54px);animation:fall var(--duration,1.5s) ease-in forwards;animation-delay:var(--delay,0s)}@keyframes fall{0%{transform:translateY(-10vh) rotate(0) scale(.8);opacity:0}12%{opacity:1}100%{transform:translateY(115vh) rotate(720deg) scale(1.15);opacity:1}}@keyframes scorePulse{0%,100%{transform:scale(1)}40%{transform:scale(1.08);box-shadow:0 0 30px rgba(255,211,78,.8)}}@media(max-width:900px){.form{grid-template-columns:1fr 1fr}}@media(max-width:760px){button,input,select{min-height:48px}.form{grid-template-columns:1fr}.names{grid-template-columns:1fr}.play-shell{padding-top:158px}.gameframe{height:calc(100dvh - 158px)}.scorebar{grid-template-columns:repeat(var(--team-count),140px)}.hostbar{top:96px;justify-content:flex-start;flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px}.hostbar .btn{flex:0 0 auto}.status{font-size:.75rem;max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}@media(prefers-reduced-motion:reduce){.celebration{display:none}.team.celebrate{animation:none}}</style></head><body><section id="setup" class="setup"><header class="top"><a class="brand" href="play.html"><img src="no-labels-approved-logo.png" alt=""><span><strong>No Labels Games</strong><small id="gameTitle">Team Game</small></span></a><a class="btn" href="play.html">Game Center</a></header><div class="hero"><h1>Game Setup</h1><p>Choose the audience and one to eight teams. Correct answers can include optional sound and celebration effects.</p></div><div class="form"><label>Audience<select id="audience"><option value="preschool">Preschool</option><option value="kids">Kids</option><option value="teens">Teens</option><option value="adults">Adults</option><option value="family" selected>Family</option></select></label><label>Number of Teams<select id="teamCount"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></label><label>Starting Team<select id="starting"></select></label><label>Celebrations & Sound<select id="effects"><option value="on" selected>On</option><option value="off">Off</option></select></label><div id="names" class="names"></div><div class="actions"><button id="begin" class="btn gold">Start Game</button></div></div></section><section id="playShell" class="play-shell hidden"><div id="scorebar" class="scorebar"></div><div class="hostbar"><button id="previous" class="btn">← Team</button><button id="nextTeam" class="btn">Team →</button><button id="minusPoints" class="btn red">−100</button><button id="plusPoints" class="btn green">+100</button><button id="undo" class="btn">Undo</button><button id="skip" class="btn">Skip</button><button id="flagQuestion" class="btn review">Flag Question</button><button id="effectsToggle" class="btn">🔊 Effects On</button><button id="fullscreen" class="btn">Fullscreen</button><button id="resetScores" class="btn">Reset Scores</button><a class="btn" href="play.html">Exit</a></div><iframe id="gameframe" class="gameframe" title="Bible game"></iframe><div id="awardPanel" class="award-panel hidden"></div><div id="status" class="status">Host controls ready</div><div id="celebration" class="celebration"></div></section><script>const params=new URLSearchParams(location.search),requested=params.get('game')||'scripture-or-suspicion.html',allowed=['scripture-or-suspicion.html','who-am-i.html','finish-the-verse.html','lightning-round.html','memory-match.html','bible-jeopardy.html'],groups=['preschool','kids','teens','adults','family'],gameFile=allowed.includes(requested)?requested:allowed[0],requestedGroup=groups.includes(params.get('group'))?params.get('group'):'family',titles={'scripture-or-suspicion.html':'Scripture or Suspicion','who-am-i.html':'Who Am I?','finish-the-verse.html':'Finish the Verse','lightning-round.html':'Lightning Round','memory-match.html':'Memory Match','bible-jeopardy.html':'Bible Jeopardy'},contentCorrections={"I was the governor who heard Paul and replied, 'You almost persuade me.' Who am I?":"I was the king who heard Paul and replied, 'You almost persuade me.' Who am I?","I secretly took Jesus' body and placed it in my tomb. Who am I?":"I asked Pilate for Jesus' body and placed it in my tomb. Who am I?","I was the disciple Jesus loved and wrote Revelation. Who am I?":"I was one of Jesus' closest disciples and am traditionally identified as the writer of Revelation. Who am I?","I carried Paul's letter to the Romans and served the church at Cenchreae. Who am I?":"I served the church at Cenchreae and was commended by Paul in Romans 16. Who am I?"};document.getElementById('gameTitle').textContent=titles[gameFile];const $=id=>document.getElementById(id);let teams=[],active=0,lastFeedback='',history=[],effectsOn=localStorage.getItem('nldg-game-effects')!=='off',audioContext=null,roundCelebrated=false;$('audience').value=requestedGroup;$('effects').value=effectsOn?'on':'off';function defaultName(i){return ['Team Grace','Team Truth','Team Faith','Team Hope','Team Mercy','Team Joy','Team Peace','Team Light'][i]||`Team ${i+1}`}function renderNames(){const count=Number($('teamCount').value);$('names').innerHTML=Array.from({length:count},(_,i)=>`<label>Team ${i+1}<input data-name="${i}" value="${defaultName(i)}"></label>`).join('');updateStartingOptions();$('names').querySelectorAll('[data-name]').forEach(input=>input.addEventListener('input',updateStartingOptions))}function updateStartingOptions(){const old=$('starting').value,inputs=[...document.querySelectorAll('[data-name]')];$('starting').innerHTML=inputs.map((input,i)=>`<option value="${i}">${escapeHtml(input.value.trim()||defaultName(i))}</option>`).join('')+'<option value="random">Choose Randomly</option>';if([...$('starting').options].some(option=>option.value===old))$('starting').value=old}function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function snapshot(label){history.push({teams:teams.map(t=>({...t})),active,label});if(history.length>50)history.shift()}function setStatus(text){$('status').textContent=text}function renderScore(){document.documentElement.style.setProperty('--team-count',String(teams.length));$('scorebar').innerHTML=teams.map((t,i)=>`<div class="team ${i===active?'active':''}" data-team="${i}"><strong>${escapeHtml(t.name)}</strong><span>${t.score}</span></div>`).join('');$('scorebar').querySelectorAll('[data-team]').forEach(card=>card.onclick=()=>{snapshot('team selection');active=Number(card.dataset.team);renderScore();setStatus(`${teams[active].name} selected`)})}function move(step=1,remember=true){if(remember)snapshot('team change');active=(active+step+teams.length)%teams.length;renderScore();setStatus(`${teams[active].name}'s turn`)}function add(points,label='score change'){snapshot(label);teams[active].score+=points;renderScore();setStatus(`${teams[active].name} ${points>=0?'+':''}${points}`)}function undo(){const prior=history.pop();if(!prior){setStatus('Nothing to undo');return}teams=prior.teams;active=prior.active;renderScore();setStatus(`Undid ${prior.label}`)}function prepareAudio(){if(!effectsOn)return;try{const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx)return;if(!audioContext)audioContext=new AudioCtx();if(audioContext.state==='suspended')audioContext.resume()}catch{}}function tone(freq,start,duration,gain=.05){if(!effectsOn||!audioContext)return;const osc=audioContext.createOscillator(),volume=audioContext.createGain();osc.type='sine';osc.frequency.value=freq;volume.gain.setValueAtTime(.0001,audioContext.currentTime+start);volume.gain.exponentialRampToValueAtTime(gain,audioContext.currentTime+start+.02);volume.gain.exponentialRampToValueAtTime(.0001,audioContext.currentTime+start+duration);osc.connect(volume).connect(audioContext.destination);osc.start(audioContext.currentTime+start);osc.stop(audioContext.currentTime+start+duration+.03)}function celebrate(message='Great job!'){if(!effectsOn)return;prepareAudio();tone(523.25,0,.18);tone(659.25,.12,.2);tone(783.99,.25,.3);const layer=$('celebration'),icons=['✨','⭐','🎉','👏','🙌'];layer.innerHTML=Array.from({length:34},(_,i)=>`<span style="left:${Math.random()*96}%;--delay:${Math.random()*.35}s;--duration:${1.15+Math.random()*.75}s">${icons[i%icons.length]}</span>`).join('');const card=$('scorebar').querySelector(`[data-team="${active}"]`);if(card){card.classList.add('celebrate');setTimeout(()=>card.classList.remove('celebrate'),750)}setStatus(message);setTimeout(()=>layer.innerHTML='',2300)}function updateEffectsButton(){$('effectsToggle').textContent=effectsOn?'🔊 Effects On':'🔇 Effects Off'}function toggleEffects(){effectsOn=!effectsOn;localStorage.setItem('nldg-game-effects',effectsOn?'on':'off');updateEffectsButton();if(effectsOn){prepareAudio();tone(659.25,0,.12);setStatus('Celebrations and sound turned on')}else setStatus('Celebrations and sound turned off')}function begin(){effectsOn=$('effects').value==='on';localStorage.setItem('nldg-game-effects',effectsOn?'on':'off');prepareAudio();teams=[...document.querySelectorAll('[data-name]')].map((input,i)=>({name:input.value.trim()||defaultName(i),score:0}));active=$('starting').value==='random'?Math.floor(Math.random()*teams.length):Number($('starting').value);history=[];lastFeedback='';roundCelebrated=false;$('setup').classList.add('hidden');$('playShell').classList.remove('hidden');renderScore();updateEffectsButton();$('gameframe').src=`${gameFile}?group=${encodeURIComponent($('audience').value)}`;setStatus(`${teams[active].name}'s turn`)}function applyContentCorrections(doc){const question=doc.getElementById('question');if(!question)return;const correct=()=>{const original=question.textContent.trim();if(contentCorrections[original]){question.textContent=contentCorrections[original];question.dataset.contentCorrected='true';setStatus('A reviewed wording correction was applied')}};correct();new MutationObserver(correct).observe(question,{childList:true,subtree:true,characterData:true})}function configureChild(){const doc=$('gameframe').contentDocument;if(!doc)return,group=doc.getElementById('group');if(group){group.value=$('audience').value;group.dispatchEvent(new Event('change',{bubbles:true}));const label=group.closest('label');if(label)label.style.display='none'}const mode=doc.getElementById('mode');if(mode){mode.value='solo';const label=mode.closest('label');if(label)label.style.display='none'}const childScores=doc.getElementById('scoreboard');if(childScores)childScores.style.display='none';doc.querySelectorAll('button').forEach(button=>{button.style.minHeight='48px';button.style.touchAction='manipulation'});applyContentCorrections(doc);const next=doc.getElementById('next');if(next&&!next.dataset.multiBound){next.dataset.multiBound='1';next.addEventListener('click',()=>{lastFeedback='';if(gameFile!=='memory-match.html')move(1)},{capture:true})}const feedback=doc.getElementById('feedback');if(feedback)new MutationObserver(()=>handleFeedback(feedback.textContent.trim())).observe(feedback,{childList:true,subtree:true,characterData:true});const complete=doc.getElementById('completeView');if(complete)new MutationObserver(()=>{if(!complete.classList.contains('hidden')&&!roundCelebrated){roundCelebrated=true;celebrate('Round complete!')}}).observe(complete,{attributes:true,attributeFilter:['class']});if(gameFile==='bible-jeopardy.html')setupJeopardy(doc)}function handleFeedback(text){if(!text)return;if(gameFile==='memory-match.html'){if(text.startsWith('Match found')&&text!==lastFeedback){lastFeedback=text;add(100,'correct match');celebrate(`${teams[active].name} found a match!`)}else if(text.startsWith('No match')&&text!==lastFeedback){lastFeedback=text;move(1)}else if(!text.startsWith('Match found')&&!text.startsWith('No match'))lastFeedback='';return}if(text==='Correct!'&&lastFeedback!=='Correct!'){lastFeedback='Correct!';add(100,'correct answer');celebrate(`${teams[active].name} answered correctly!`)}else if(text!=='Correct!')lastFeedback=''}function setupJeopardy(doc){const childScore=doc.getElementById('scoreboard');if(childScore)childScore.style.display='none';const fields=doc.querySelector('.team-fields');if(fields)fields.style.display='none';const starting=doc.getElementById('starting');if(starting&&starting.closest('label'))starting.closest('label').style.display='none';const award1=doc.getElementById('award1'),award2=doc.getElementById('award2'),noAward=doc.getElementById('noAward');[award1,award2].forEach(b=>{if(b)b.style.display='none'});if(noAward)new MutationObserver(()=>{const visible=!noAward.classList.contains('hidden');$('awardPanel').classList.toggle('hidden',!visible);if(visible)renderAwards(doc,noAward)}).observe(noAward,{attributes:true,attributeFilter:['class']})}function renderAwards(doc,noAward){const meta=doc.getElementById('meta')?.textContent||'',match=meta.match(/(100|200|300|400|500)/),value=match?Number(match[1]):100;$('awardPanel').innerHTML=teams.map((t,i)=>`<button data-award="${i}">Award ${escapeHtml(t.name)} +${value}</button>`).join('')+'<button class="none" data-none>No Award</button>';$('awardPanel').querySelectorAll('[data-award]').forEach(btn=>btn.onclick=()=>{snapshot('Jeopardy award');const i=Number(btn.dataset.award);teams[i].score+=value;active=i;renderScore();celebrate(`${teams[i].name} +${value}`);active=(i+1)%teams.length;setTimeout(renderScore,800);$('awardPanel').classList.add('hidden');noAward.click()});$('awardPanel').querySelector('[data-none]').onclick=()=>{$('awardPanel').classList.add('hidden');move(1);noAward.click()}}function skipQuestion(){const doc=$('gameframe').contentDocument;if(!doc)return;lastFeedback='';if(gameFile==='memory-match.html'){move(1);setStatus('Turn skipped');return}if(gameFile==='bible-jeopardy.html'){const reveal=doc.getElementById('reveal'),noAward=doc.getElementById('noAward');if(reveal&&!reveal.classList.contains('hidden'))reveal.click();setTimeout(()=>{if(noAward)noAward.click();$('awardPanel').classList.add('hidden');move(1);setStatus('Clue skipped')},40);return}const next=doc.getElementById('next');if(next){next.click();setStatus('Question skipped')}else{move(1);setStatus('Turn skipped')}}function getCurrentQuestion(){const doc=$('gameframe').contentDocument;if(!doc)return '';const meta=doc.getElementById('meta')?.textContent.trim(),question=doc.getElementById('question')?.textContent.trim()||doc.querySelector('.overlay-question')?.textContent.trim();return[meta,question].filter(Boolean).join(' | ')}function flagQuestion(){const question=getCurrentQuestion();if(!question){setStatus('No active question to flag');return}const note=prompt('What should be reviewed about this question?','Check wording or biblical accuracy');if(note===null)return;let flags=[];try{flags=JSON.parse(localStorage.getItem('nldg-question-flags')||'[]')}catch{}flags.push({game:titles[gameFile],audience:$('audience').value,question,note:note.trim(),saved:new Date().toISOString()});localStorage.setItem('nldg-question-flags',JSON.stringify(flags.slice(-100)));setStatus(`Question flagged for review (${flags.length} saved on this device)`)}async function toggleFullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{setStatus('Fullscreen is unavailable in this browser')}}$('teamCount').onchange=renderNames;$('begin').onclick=begin;$('previous').onclick=()=>move(-1);$('nextTeam').onclick=()=>move(1);$('minusPoints').onclick=()=>add(-100,'manual deduction');$('plusPoints').onclick=()=>add(100,'manual award');$('undo').onclick=undo;$('skip').onclick=skipQuestion;$('flagQuestion').onclick=flagQuestion;$('effectsToggle').onclick=toggleEffects;$('fullscreen').onclick=toggleFullscreen;$('resetScores').onclick=()=>{if(confirm('Reset all team scores?')){snapshot('score reset');teams.forEach(t=>t.score=0);renderScore();setStatus('Scores reset')}};$('gameframe').onload=()=>setTimeout(configureChild,180);document.addEventListener('keydown',event=>{if(event.target.matches('input,select'))return;if(/^[1-8]$/.test(event.key)&&Number(event.key)<=teams.length){snapshot('team selection');active=Number(event.key)-1;renderScore();setStatus(`${teams[active].name} selected`)}else if(event.key==='ArrowLeft')move(-1);else if(event.key==='ArrowRight')move(1);else if(event.key.toLowerCase()==='u')undo();else if(event.key.toLowerCase()==='f')toggleFullscreen()});renderNames();</script></body></html>
