name: Site Quality Audit

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/repair-audit-failures.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Internal links and content state
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run site audit
        run: node scripts/audit-site.mjs

      - name: Run Scripture link audit
        run: node scripts/scripture-link-audit.mjs

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-audit-report
          path: site-audit-report.md
          if-no-files-found: error
