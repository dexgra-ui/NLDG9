name: Content Surface Browser Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'home.js'
      - 'search.html'
      - 'site-map.html'
      - 'site-map.js'
      - 'news.html'
      - 'podcast.html'
      - 'devotionals.html'
      - 'devotionals-page.js'
      - 'content-library.js'
      - 'article-library.js'
      - 'devotional-library.js'
      - 'site-navigation.js'
      - 'sitemap.xml'
      - 'script.js'
      - 'book-study-series.js'
      - 'book-study-series.css'
      - 'book-study-series-es.js'
      - 'scripts/content-surface-browser-audit.mjs'
      - '.github/workflows/content-surface-browser-audit.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'home.js'
      - 'search.html'
      - 'site-map.html'
      - 'site-map.js'
      - 'news.html'
      - 'podcast.html'
      - 'devotionals.html'
      - 'devotionals-page.js'
      - 'content-library.js'
      - 'article-library.js'
      - 'devotional-library.js'
      - 'site-navigation.js'
      - 'sitemap.xml'
      - 'script.js'
      - 'book-study-series.js'
      - 'book-study-series.css'
      - 'book-study-series-es.js'
      - 'scripts/content-surface-browser-audit.mjs'
      - '.github/workflows/content-surface-browser-audit.yml'

permissions:
  contents: read

jobs:
  browser-audit:
    name: Home, Search, Site Map, News, Podcast, and Devotionals
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/nldg-http.log 2>&1 &
          echo $! > /tmp/nldg-http.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nldg-http.log
          exit 1

      - name: Run content surface browser audit
        run: node scripts/content-surface-browser-audit.mjs

      - name: Upload browser screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-surface-browser-audit
          path: content-surface-browser-audit-results
          if-no-files-found: error
