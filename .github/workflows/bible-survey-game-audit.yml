name: Bible Survey Showdown Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'bible-survey-game.html'
      - 'survey-game-integration.js'
      - 'contact-links.js'
      - 'sitemap.xml'
      - 'play.html'
      - 'search.html'
      - 'scripts/bible-survey-game-audit.mjs'
      - '.github/workflows/bible-survey-game-audit.yml'
  push:
    branches: [main]
    paths:
      - 'bible-survey-game.html'
      - 'survey-game-integration.js'
      - 'contact-links.js'
      - 'sitemap.xml'
      - 'play.html'
      - 'search.html'
      - 'scripts/bible-survey-game-audit.mjs'
      - '.github/workflows/bible-survey-game-audit.yml'

jobs:
  audit:
    name: Responsive layout, accessibility, gameplay, search, and Game Center
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser audit tools
        run: |
          npm install --no-save playwright axe-core
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/nldg-http.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/bible-survey-game.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nldg-http.log
          exit 1

      - name: Run Bible Survey Showdown audit
        run: node scripts/bible-survey-game-audit.mjs
