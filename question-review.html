<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071735">
<title>Question Review | No Labels Games</title>
<style>
:root{--gold:#ffd34e;--text:#f7f9ff;--muted:#cbd5f3;--line:rgba(255,255,255,.16)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#1d4c9e 0,#081735 42%,#030713 100%);color:var(--text)}body{padding:18px}.page{max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border:1px solid var(--line);border-radius:18px;background:rgba(5,16,44,.95)}.brand{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none}.brand img{width:52px;height:52px;object-fit:contain}.brand small{display:block;color:var(--muted)}.btn{border:1px solid var(--line);border-radius:12px;padding:11px 15px;font-weight:900;background:#243b78;color:#fff;text-decoration:none;cursor:pointer}.danger{background:#9d3434}.hero{text-align:center;padding:42px 12px 22px}.hero h1{font-size:clamp(38px,7vw,68px);margin:0}.hero p{color:var(--muted);font-size:1.1rem}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:20px 0}.summary{padding:14px 18px;border:1px solid var(--line);border-radius:16px;background:rgba(10,25,64,.92);font-weight:900}.list{display:grid;gap:14px;margin-top:16px}.card{padding:18px;border:1px solid var(--line);border-radius:18px;background:rgba(10,25,64,.92)}.card h2{margin:0 0 8px;color:var(--gold);font-size:1.2rem}.meta{color:var(--muted);font-weight:800}.question{font-size:1.1rem;font-weight:900;margin:12px 0}.note{padding:10px 12px;border-radius:12px;background:#132b61}.empty{text-align:center;padding:40px;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}
</style>
</head>
<body><main class="page">
<header class="top"><a class="brand" href="play.html"><img src="no-labels-approved-logo.png" alt=""><span><strong>No Labels Games</strong><small>Content review</small></span></a><a class="btn" href="play.html">Game Center</a></header>
<section class="hero"><h1>Flagged Questions</h1><p>Questions flagged during play are saved only on this device and browser.</p></section>
<div id="summary" class="summary"></div>
<div class="actions"><button id="copy" class="btn">Copy Review List</button><button id="download" class="btn">Download Review File</button><button id="clear" class="btn danger">Clear Saved Flags</button></div>
<section id="list" class="list"></section>
</main>
<script>
const $=id=>document.getElementById(id);let flags=[];
function load(){try{flags=JSON.parse(localStorage.getItem('nldg-question-flags')||'[]')}catch{flags=[]}render()}
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function render(){$('summary').textContent=`${flags.length} question${flags.length===1?'':'s'} saved for review.`;if(!flags.length){$('list').innerHTML='<div class="empty">No questions have been flagged on this device.</div>';return}$('list').innerHTML=[...flags].reverse().map((flag,index)=>`<article class="card"><h2>${esc(flag.game)} • ${esc(flag.audience)}</h2><div class="meta">${esc(new Date(flag.saved).toLocaleString())}</div><div class="question">${esc(flag.question)}</div><div class="note"><strong>Review note:</strong> ${esc(flag.note||'No note entered')}</div><p><button class="btn danger" data-remove="${flags.length-1-index}">Remove</button></p></article>`).join('');$('list').querySelectorAll('[data-remove]').forEach(button=>button.onclick=()=>{flags.splice(Number(button.dataset.remove),1);save()})}
function save(){localStorage.setItem('nldg-question-flags',JSON.stringify(flags));render()}
function textReport(){return flags.map((flag,index)=>`${index+1}. ${flag.game} | ${flag.audience}\nQuestion: ${flag.question}\nReview note: ${flag.note||'No note entered'}\nSaved: ${flag.saved}`).join('\n\n')||'No flagged questions.'}
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(textReport());$('summary').textContent='Review list copied.'}catch{alert(textReport())}}
$('download').onclick=()=>{const blob=new Blob([textReport()],{type:'text/plain'}),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='nldg-question-review.txt';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)}
$('clear').onclick=()=>{if(confirm('Clear every flagged question saved on this device?')){flags=[];save()}};load();
</script></body></html>
