name: Normalize Public Labels

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-public-labels.yml'

permissions:
  contents: write

jobs:
  normalize:
    name: Remove stale public version labels
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace stale Game Center label
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('games.html')
          text = path.read_text(encoding='utf-8')
          old = '<div class="eyebrow">Version 0.9 • Sprint 2</div>'
          new = '<div class="eyebrow">Church Tournament</div>'
          if old not in text:
              raise SystemExit('Expected Game Center label was not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.html
          git commit -m "Remove stale game version label"
          git push
