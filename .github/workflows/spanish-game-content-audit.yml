name: Spanish Game Content Audit

on:
  pull_request:
    paths:
      - 'who-am-i.html'
      - 'finish-the-verse.html'
      - 'lightning-round.html'
      - 'memory-match.html'
      - 'bible-jeopardy.html'
      - 'game-packs/general-bible.js'
      - 'game-packs/general-bible-expanded.js'
      - 'es/juegos-contenido-escritura-sospecha.js'
      - 'es/juegos-contenido-quien-soy.js'
      - 'es/juegos-contenido-completa-versiculo.js'
      - 'es/juegos-contenido-completa-versiculo-preescolar.js'
      - 'es/juegos-contenido-completa-versiculo-ninos.js'
      - 'es/juegos-contenido-trivia-biblica.js'
      - 'es/juegos-contenido-ronda-relampago.js'
      - 'es/juegos-contenido-memoria.js'
      - 'es/juegos-contenido-aplicador.js'
      - 'es/juegos-host.js'
      - 'es/juego.html'
      - 'scripts/spanish-game-content-audit.mjs'
      - 'scripts/spanish-finish-verse-preschool-audit.mjs'
      - 'scripts/spanish-finish-verse-kids-audit.mjs'
      - '.github/workflows/spanish-game-content-audit.yml'
  push:
    branches: [main]
    paths:
      - 'who-am-i.html'
      - 'finish-the-verse.html'
      - 'lightning-round.html'
      - 'memory-match.html'
      - 'bible-jeopardy.html'
      - 'game-packs/general-bible.js'
      - 'game-packs/general-bible-expanded.js'
      - 'es/juegos-contenido-escritura-sospecha.js'
      - 'es/juegos-contenido-quien-soy.js'
      - 'es/juegos-contenido-completa-versiculo.js'
      - 'es/juegos-contenido-completa-versiculo-preescolar.js'
      - 'es/juegos-contenido-completa-versiculo-ninos.js'
      - 'es/juegos-contenido-trivia-biblica.js'
      - 'es/juegos-contenido-ronda-relampago.js'
      - 'es/juegos-contenido-memoria.js'
      - 'es/juegos-contenido-aplicador.js'
      - 'es/juegos-host.js'
      - 'es/juego.html'
      - 'scripts/spanish-game-content-audit.mjs'
      - 'scripts/spanish-finish-verse-preschool-audit.mjs'
      - 'scripts/spanish-finish-verse-kids-audit.mjs'
      - '.github/workflows/spanish-game-content-audit.yml'

permissions:
  contents: read

jobs:
  spanish-game-content:
    name: Spanish game question coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Spanish game content coverage
        run: node scripts/spanish-game-content-audit.mjs
      - name: Verify Preschool NTV Finish the Verse coverage
        run: node scripts/spanish-finish-verse-preschool-audit.mjs
      - name: Verify Kids NTV Finish the Verse coverage
        run: node scripts/spanish-finish-verse-kids-audit.mjs