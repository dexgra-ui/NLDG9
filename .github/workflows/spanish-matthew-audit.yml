name: Spanish Matthew and New Testament Completion Audit
on:
  push:
    paths: ['matthew-study.html','matthew-study-data.js','matthew-study-guide.js','matthew-study-data-es.js','es/mateo-estudio.html','es/estudios-biblicos.html','es/*-estudio.html','nldg-i18n.js','book-study-series.js','book-study-series-es.js','scripts/spanish-matthew-audit.mjs','scripts/spanish-mark-audit.mjs','.github/workflows/spanish-matthew-audit.yml']
  pull_request:
    paths: ['matthew-study.html','matthew-study-data.js','matthew-study-guide.js','matthew-study-data-es.js','es/mateo-estudio.html','es/estudios-biblicos.html','es/*-estudio.html','nldg-i18n.js','book-study-series.js','book-study-series-es.js','scripts/spanish-matthew-audit.mjs','scripts/spanish-mark-audit.mjs','.github/workflows/spanish-matthew-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spanish-matthew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/spanish-matthew-audit.mjs
