name: Spanish Romans Audit

on:
  push:
    paths:
      - 'romans-study.html'
      - 'romans-study-data.js'
      - 'romans-study-guide.js'
      - 'romans-study-data-es.js'
      - 'es/romanos-estudio.html'
      - 'es/estudios-biblicos.html'
      - 'nldg-i18n.js'
      - 'book-study-series.js'
      - 'book-study-series-es.js'
      - 'scripts/spanish-romans-audit.mjs'
      - 'scripts/spanish-first-corinthians-audit.mjs'
      - '.github/workflows/spanish-romans-audit.yml'
  pull_request:
    paths:
      - 'romans-study.html'
      - 'romans-study-data.js'
      - 'romans-study-guide.js'
      - 'romans-study-data-es.js'
      - 'es/romanos-estudio.html'
      - 'es/estudios-biblicos.html'
      - 'nldg-i18n.js'
      - 'book-study-series.js'
      - 'book-study-series-es.js'
      - 'scripts/spanish-romans-audit.mjs'
      - 'scripts/spanish-first-corinthians-audit.mjs'
      - '.github/workflows/spanish-romans-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spanish-romans:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit Spanish Romans study
        run: node scripts/spanish-romans-audit.mjs
