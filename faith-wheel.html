<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071735">
<meta name="description" content="Faith Wheel is a presentation-ready Bible phrase game for families, churches, and small groups.">
<title>Faith Wheel | No Labels, Designed by God</title>
<style>
:root{--gold:#ffd34e;--text:#f7f9ff;--muted:#cbd5f3;--line:rgba(255,255,255,.14);--green:#35c779;--panel:#071735}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#1d4c9e 0,#081735 42%,#030713 100%);color:var(--text)}button,select,input{font:inherit}.hidden{display:none!important}.app{max-width:1320px;margin:auto;padding:16px}.top,.setup,.panel{border:1px solid var(--line);border-radius:18px;background:rgba(5,16,44,.95)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px}.brand{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none}.brand img{width:52px;height:52px;object-fit:contain}.brand strong{display:block}.brand small,.muted{color:var(--muted)}.btn{border:1px solid var(--line);border-radius:12px;padding:11px 15px;font-weight:800;background:#243b78;color:white;cursor:pointer;text-decoration:none}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.gold{background:linear-gradient(#fff0a4,var(--gold));color:#2d2400}.btn.green{background:var(--green);color:#04190d}.hero{text-align:center;padding:42px 12px 24px}.hero h1{font-size:clamp(44px,8vw,88px);margin:0}.setup{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:20px}label{display:grid;gap:7px;font-weight:800;color:var(--muted)}select,input{padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:white}.team-fields,.setup-actions,.notice{grid-column:1/-1}.team-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.setup-actions,.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.notice{text-align:center;color:var(--gold);font-weight:800}.scoreboard{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0}.team{padding:12px;border:1px solid var(--line);border-radius:14px;background:#0b1d4d;text-align:center}.team.active{outline:3px solid var(--gold)}.team strong{display:block}.team span{font-size:2rem;color:var(--gold);font-weight:900}.panel{padding:22px}.category{text-align:center;color:var(--gold);font-weight:900;font-size:1.25rem}.puzzle{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:36px 10px;min-height:180px}.tile{width:44px;height:58px;display:grid;place-items:center;border-radius:8px;background:white;color:#071735;font-size:2rem;font-weight:900}.tile.space{width:20px;background:transparent}.letters{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:20px 0}.letter{width:44px;height:44px;padding:0}.letter.used{opacity:.35}.wheel{display:grid;place-items:center;margin:18px auto;width:220px;height:220px;border-radius:50%;border:10px solid var(--gold);background:conic-gradient(#2454da 0 45deg,#35c779 45deg 90deg,#ef596f 90deg 135deg,#8457d8 135deg 180deg,#f0a52b 180deg 225deg,#1ca7a7 225deg 270deg,#2454da 270deg 315deg,#ef596f 315deg);box-shadow:0 0 30px rgba(255,211,78,.25)}.wheel strong{background:#071735;border-radius:999px;padding:22px;text-align:center}.reference{text-align:center;color:var(--muted);min-height:26px;font-weight:800}.teaching{margin:18px auto 0;max-width:850px;padding:16px;border-radius:14px;background:#0b1d4d;text-align:center}.complete{text-align:center;padding:50px 20px}.complete h2{font-size:clamp(38px,6vw,68px)}@media(max-width:900px){.setup{grid-template-columns:1fr 1fr}}@media(max-width:640px){.setup{grid-template-columns:1fr}.team-fields{grid-template-columns:1fr}.tile{width:34px;height:48px;font-size:1.5rem}.top{position:static}}
</style>
</head>
<body>
<div class="app">
<header class="top"><a class="brand" href="play.html"><img src="no-labels-approved-logo.png" alt=""><span><strong>No Labels Games</strong><small>Faith Wheel</small></span></a><div><a class="btn" href="play.html">Game Center</a> <button id="fullscreen" class="btn" type="button">Fullscreen</button></div></header>
<section id="setupView"><div class="hero"><h1>Faith Wheel</h1><p class="muted">Spin, solve biblical phrases, and turn every round into a teaching moment.</p></div><div class="setup">
<label>Game pack<select id="pack"><option value="all">All active packs</option></select></label>
<label>Audience<select id="group"><option value="kids">Kids</option><option value="teens">Teens</option><option value="adults">Adults</option><option value="family" selected>Family</option><option value="mixed">Mixed</option></select></label>
<label>Difficulty<select id="difficulty"><option value="mixed" selected>Mixed</option><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select></label>
<label>Rounds<select id="roundCount"><option>3</option><option selected>5</option><option>7</option><option>10</option></select></label>
<div class="team-fields"><label>Team 1<input id="team1" value="Team Grace"></label><label>Team 2<input id="team2" value="Team Truth"></label></div>
<p id="notice" class="notice" aria-live="polite"></p>
<div class="setup-actions"><button id="start" class="btn gold" type="button">Start Faith Wheel</button><button id="resetHistory" class="btn" type="button">Reset Puzzle History</button></div>
</div></section>
<section id="gameView" class="hidden"><div class="scoreboard"><div class="team active"><strong>Team Grace</strong><span>0</span></div><div class="team"><strong>Team Truth</strong><span>0</span></div></div><div class="panel"><div id="roundLabel" class="category"></div><div id="category" class="category"></div><div id="puzzle" class="puzzle"></div><div class="wheel"><strong id="spinResult">Spin<br>Faith Wheel</strong></div><div class="actions"><button id="spin" class="btn gold" type="button">Spin</button><button id="solve" class="btn green" type="button">Solve Puzzle</button><button id="nextPuzzle" class="btn hidden" type="button">Next Round</button><button id="endGame" class="btn" type="button">End Game</button></div><div id="letters" class="letters"></div><div id="reference" class="reference"></div><div id="teaching" class="teaching hidden"></div></div></section>
<section id="completeView" class="complete hidden"><h2>Faith Wheel Complete!</h2><p id="summary"></p><div class="actions"><button id="again" class="btn gold" type="button">Play Again</button><a class="btn" href="play.html">Return to Game Center</a></div></section>
</div>
<script src="game-packs/game-pack-engine.js?v=1.0.0"></script><script src="game-packs/index.js?v=1.1.0"></script>
<script>
const $=id=>document.getElementById(id);const ALPHABET='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');const VALUES=[100,150,200,250,300,350,400,500,'BONUS','FREE LETTER','LOSE TURN'];const FALLBACK=[{id:'faith-wheel-fallback-1',packId:'fallback',game:'wheel',prompt:'WALK BY FAITH',answer:'WALK BY FAITH',category:'Faith',difficulty:'easy',audience:['family','mixed'],scripture:'2 Corinthians 5:7'},{id:'faith-wheel-fallback-2',packId:'fallback',game:'wheel',prompt:'FRUIT OF THE SPIRIT',answer:'FRUIT OF THE SPIRIT',category:'Christian Living',difficulty:'easy',audience:['family','mixed'],scripture:'Galatians 5:22-23'}];let scores=[0,0],active=0,names=['Team Grace','Team Truth'],current=null,revealed=new Set(),spinValue=null,roundSolved=false,round=0,totalRounds=5;
function loadPacks(){const packs=window.NLDG_GAME_PACKS?.list().filter(p=>p.games.includes('wheel'))||[];$('pack').innerHTML='<option value="all">All active packs</option>'+packs.map(p=>`<option value="${p.id}">${p.name} · ${p.count}</option>`).join('');$('notice').textContent=packs.length?'Less-used puzzles appear first. History stays in this browser.':'Pack content unavailable. Emergency puzzles will be used.'}
function filters(){return {packs:$('pack').value==='all'?undefined:[$('pack').value],game:'wheel',audience:$('group').value,difficulty:$('difficulty').value}}
function choosePuzzle(){return window.NLDG_GAME_PACKS?.select(filters(),1)?.[0]||FALLBACK[Math.floor(Math.random()*FALLBACK.length)]}
function start(){names=[$('team1').value.trim()||'Team Grace',$('team2').value.trim()||'Team Truth'];scores=[0,0];active=0;round=0;totalRounds=Number($('roundCount').value);$('setupView').classList.add('hidden');$('completeView').classList.add('hidden');$('gameView').classList.remove('hidden');renderScore();newPuzzle()}
function newPuzzle(){if(round>=totalRounds){end();return}round++;current=choosePuzzle();revealed=new Set();spinValue=null;roundSolved=false;$('spinResult').innerHTML='Spin<br>Faith Wheel';$('reference').textContent='';$('teaching').classList.add('hidden');$('teaching').textContent='';$('nextPuzzle').classList.add('hidden');$('spin').disabled=false;$('solve').disabled=false;$('roundLabel').textContent=`Round ${round} of ${totalRounds}`;renderPuzzle();renderLetters()}
function answerText(){return String(current?.answer||current?.prompt||'').toUpperCase()}
function renderPuzzle(){const chars=[...answerText()];$('category').textContent=current?.category||'Bible Phrase';$('puzzle').innerHTML=chars.map(ch=>{if(ch===' ')return '<span class="tile space"></span>';const show=!/[A-Z]/.test(ch)||revealed.has(ch)||roundSolved;return `<span class="tile">${show?ch:''}</span>`}).join('')}
function renderLetters(){$('letters').innerHTML=ALPHABET.map(l=>`<button class="btn letter${revealed.has(l)?' used':''}" data-letter="${l}" ${revealed.has(l)||roundSolved||spinValue===null?'disabled':''}>${l}</button>`).join('');document.querySelectorAll('.letter').forEach(b=>b.onclick=()=>guess(b.dataset.letter))}
function spin(){if(roundSolved)return;spinValue=VALUES[Math.floor(Math.random()*VALUES.length)];if(spinValue==='LOSE TURN'){$('spinResult').innerHTML='LOSE<br>TURN';active=1-active;spinValue=null}else if(spinValue==='BONUS'){$('spinResult').innerHTML='FAITH<br>BONUS';scores[active]+=300;spinValue=300}else if(spinValue==='FREE LETTER'){$('spinResult').innerHTML='FREE<br>LETTER';spinValue=0}else $('spinResult').innerHTML=`${spinValue}<br>points`;renderScore();renderLetters()}
function guess(letter){if(spinValue===null||revealed.has(letter)||roundSolved)return;revealed.add(letter);const count=[...answerText()].filter(c=>c===letter).length;if(count){scores[active]+=count*Number(spinValue||0);$('spinResult').innerHTML=`${count} × ${spinValue||'FREE'}`}else{$('spinResult').innerHTML='No match';active=1-active}spinValue=null;renderScore();renderPuzzle();renderLetters();if([...answerText()].filter(c=>/[A-Z]/.test(c)).every(c=>revealed.has(c)))solveRound(true)}
function solveRound(auto=false){if(roundSolved)return;const guess=auto?answerText():prompt('Enter the full puzzle answer:');if(guess===null)return;if(auto||guess.trim().toUpperCase()===answerText()){roundSolved=true;scores[active]+=500;window.NLDG_GAME_PACKS?.record(current);$('spinResult').innerHTML='SOLVED!';$('reference').textContent=current.scripture?`Reference: ${current.scripture}`:'';$('teaching').textContent=current.scripture?`Teaching moment: Read ${current.scripture} and discuss how this truth shapes everyday faith.`:'Teaching moment: Ask the group where this phrase appears in the biblical story and why it matters.';$('teaching').classList.remove('hidden');$('nextPuzzle').classList.remove('hidden');$('spin').disabled=true;$('solve').disabled=true;renderScore();renderPuzzle();renderLetters()}else{alert('That is not the puzzle. The other team now has control.');active=1-active;renderScore()}}
function renderScore(){document.querySelectorAll('.team').forEach((card,i)=>{card.classList.toggle('active',i===active);card.querySelector('strong').textContent=names[i];card.querySelector('span').textContent=scores[i]})}
function next(){active=1-active;renderScore();newPuzzle()}
function end(){if(current&&!roundSolved)window.NLDG_GAME_PACKS?.record(current);$('gameView').classList.add('hidden');$('completeView').classList.remove('hidden');const winner=scores[0]===scores[1]?'The game ended in a tie.':`${scores[0]>scores[1]?names[0]:names[1]} wins!`;$('summary').textContent=`${winner} ${names[0]}: ${scores[0]} points. ${names[1]}: ${scores[1]} points.`}
$('start').onclick=start;$('spin').onclick=spin;$('solve').onclick=()=>solveRound(false);$('nextPuzzle').onclick=next;$('endGame').onclick=end;$('again').onclick=()=>{$('completeView').classList.add('hidden');$('setupView').classList.remove('hidden')};$('resetHistory').onclick=()=>{window.NLDG_GAME_PACKS?.resetHistory($('pack').value==='all'?undefined:$('pack').value);$('notice').textContent='Puzzle history cleared.'};$('fullscreen').onclick=async()=>{try{document.fullscreenElement?await document.exitFullscreen():await document.documentElement.requestFullscreen()}catch{}};loadPacks();
</script>
</body></html>
