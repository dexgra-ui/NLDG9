<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071735">
<title>Scripture or Suspicion | No Labels, Designed by God</title>
<style>
:root{--panel:#0a1940;--gold:#ffd34e;--text:#f7f9ff;--muted:#cbd5f3;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:radial-gradient(circle at top,#1d4c9e 0,#081735 42%,#030713 100%);color:var(--text)}button,select{font:inherit}.hidden{display:none!important}.app{max-width:1200px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px;border:1px solid var(--line);border-radius:18px;background:rgba(5,16,44,.94);position:sticky;top:8px;z-index:10}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}.brand img{width:52px;height:52px;object-fit:contain}.brand strong{display:block}.brand small{color:var(--muted)}.controls,.setup-actions,.game-actions,.stats{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:12px;padding:11px 15px;font-weight:800;background:#243b78;color:white;text-decoration:none}.btn.primary{background:linear-gradient(#2454da,#15389a)}.btn.gold{background:linear-gradient(#fff0a4,var(--gold));color:#2d2400}.hero{text-align:center;padding:48px 12px 28px}.hero h1{font-size:clamp(42px,8vw,86px);line-height:.95;margin:0}.hero p{color:var(--muted);font-size:1.15rem}.setup{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;padding:20px;border:1px solid var(--line);border-radius:20px;background:rgba(10,25,64,.88)}label{display:grid;gap:7px;font-weight:800;color:var(--muted)}select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#071735;color:white}.setup-actions{grid-column:1/-1;justify-content:center}.stats{justify-content:center;margin:18px 0}.stat{padding:9px 13px;border-radius:999px;background:#12295e;color:var(--muted);font-weight:800}.notice{grid-column:1/-1;margin:0;text-align:center;color:var(--gold);font-weight:800}.game{padding:22px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(180deg,rgba(8,22,58,.98),rgba(3,10,30,.98));min-height:70vh;display:flex;flex-direction:column}.game-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.progress{height:14px;background:#162856;border-radius:999px;overflow:hidden;margin:15px 0}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#ff9f2e)}.question{flex:1;display:grid;place-items:center;text-align:center;font-size:clamp(34px,5vw,64px);line-height:1.08;font-weight:900;padding:24px}.reference{text-align:center;color:var(--muted);min-height:24px;font-weight:800}.answers{display:grid;grid-template-columns:1fr 1fr;gap:15px}.answer{min-height:100px;border:2px solid var(--line);border-radius:18px;padding:20px;background:linear-gradient(#2855bf,#133584);color:white;font-size:clamp(24px,3vw,38px);font-weight:900}.answer.correct{background:linear-gradient(#43d588,#20965b)}.answer.wrong{background:linear-gradient(#f77272,#ba3030)}.feedback{text-align:center;min-height:48px;margin:14px;color:var(--gold);font-size:clamp(21px,3vw,34px);font-weight:900}.game-actions{justify-content:center}.scoreboard{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}.team{padding:12px;border:1px solid var(--line);border-radius:14px;background:#0b1d4d;text-align:center}.team.active{outline:3px solid var(--gold)}.team strong{display:block}.team span{font-size:2rem;color:var(--gold);font-weight:900}.complete{text-align:center;padding:50px 20px}.complete h2{font-size:clamp(38px,6vw,68px)}
@media(max-width:960px){.setup{grid-template-columns:1fr 1fr}}@media(max-width:620px){.setup{grid-template-columns:1fr}.answers{grid-template-columns:1fr}.top{position:static}.question{padding:16px;min-height:250px}.scoreboard{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<header class="top"><a class="brand" href="play.html"><img src="no-labels-approved-logo.png" alt=""><span><strong>No Labels Games</strong><small>Scripture or Suspicion</small></span></a><div class="controls"><a class="btn" href="play.html">Game Center</a><button id="fullscreen" class="btn" type="button">Fullscreen</button></div></header>
<section id="setupView">
<div class="hero"><h1>Scripture or Suspicion</h1><p>Decide whether each statement comes from Scripture or only sounds biblical.</p></div>
<div class="setup">
<label>Game pack<select id="pack"><option value="general-bible">General Bible</option></select></label>
<label>Audience<select id="group"><option value="kids">Kids</option><option value="teens">Teens</option><option value="adults">Adults</option><option value="family" selected>Family</option><option value="mixed">Mixed</option></select></label>
<label>Difficulty<select id="difficulty"><option value="mixed" selected>Mixed</option><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select></label>
<label>Questions<select id="length"><option>5</option><option selected>10</option><option>15</option><option>20</option><option>25</option></select></label>
<label>Play mode<select id="mode"><option value="teams" selected>Two Teams</option><option value="solo">Solo</option></select></label>
<p class="notice" id="packNotice" aria-live="polite"></p>
<div class="setup-actions"><button id="start" class="btn gold" type="button">Start Game</button><button id="resetHistory" class="btn" type="button">Reset Pack History</button></div>
</div>
<div class="stats"><span class="stat" id="bankCount">Loading game packs…</span><span class="stat" id="historyCount"></span><span class="stat">Less-used questions appear first</span></div>
</section>
<section id="gameView" class="hidden">
<div id="scoreboard" class="scoreboard"><div class="team active"><strong>Team Grace</strong><span>0</span></div><div class="team"><strong>Team Truth</strong><span>0</span></div></div>
<div class="game"><div class="game-head"><button id="quit" class="btn" type="button">← Exit</button><strong id="counter"></strong></div><div class="progress"><span id="bar"></span></div><div id="question" class="question"></div><div id="reference" class="reference"></div><div class="answers"><button class="answer" data-answer="Scripture" type="button">Scripture</button><button class="answer" data-answer="Suspicion" type="button">Suspicion</button></div><div id="feedback" class="feedback" aria-live="polite"></div><div class="game-actions"><button id="next" class="btn primary hidden" type="button">Next Question</button></div></div>
</section>
<section id="completeView" class="complete hidden"><h2>Round Complete!</h2><p id="summary"></p><div class="game-actions"><button id="again" class="btn gold" type="button">Play Again</button><a class="btn" href="play.html">Return to Game Center</a></div></section>
</div>
<script src="game-packs/game-pack-engine.js?v=1.0.0"></script>
<script src="game-packs/general-bible.js?v=1.0.0"></script>
<script src="game-packs/index.js?v=1.0.0"></script>
<script>
const $=id=>document.getElementById(id);
const FALLBACK=[
{id:'fallback-1',packId:'fallback',prompt:'Noah built an ark.',answer:'Scripture',scripture:'Genesis 6:14'},
{id:'fallback-2',packId:'fallback',prompt:'Paul was one of Jesus’ original twelve disciples.',answer:'Suspicion'},
{id:'fallback-3',packId:'fallback',prompt:'Jesus walked on water.',answer:'Scripture',scripture:'Matthew 14:25'},
{id:'fallback-4',packId:'fallback',prompt:'The Bible says money itself is the root of all evil.',answer:'Suspicion',scripture:'1 Timothy 6:10'},
{id:'fallback-5',packId:'fallback',prompt:'James teaches that faith without works is dead.',answer:'Scripture',scripture:'James 2:26'}
];
let round=[],index=0,answered=false,activeTeam=0,scores=[0,0],soloCorrect=0;
function available(){return window.NLDG_GAME_PACKS?.questions({packs:[$('pack').value],game:'scripture-or-suspicion',audience:$('group').value,difficulty:$('difficulty').value})||[]}
function loadPacks(){const packs=window.NLDG_GAME_PACKS?.list().filter(item=>item.games.includes('scripture-or-suspicion'))||[];if(packs.length){$('pack').innerHTML=packs.map(item=>`<option value="${item.id}">${item.name} · ${item.count}</option>`).join('');$('packNotice').textContent='Questions rotate using private history saved only in this browser.'}else $('packNotice').textContent='The starter pack could not load. A small offline fallback is available.';updateCounts()}
function updateCounts(){const items=available();const stats=window.NLDG_GAME_PACKS?.stats($('pack').value);$('bankCount').textContent=`${items.length||FALLBACK.length} matching questions available`;$('historyCount').textContent=stats?`${stats.unused} of ${stats.total} unused in this pack`:'Fallback mode'}
function chooseRound(count){const engine=window.NLDG_GAME_PACKS;const selected=engine?.select({packs:[$('pack').value],game:'scripture-or-suspicion',audience:$('group').value,difficulty:$('difficulty').value},count)||[];if(selected.length)return selected;return [...FALLBACK].sort(()=>Math.random()-.5).slice(0,Math.min(count,FALLBACK.length))}
function start(){round=chooseRound(Number($('length').value));if(!round.length){$('packNotice').textContent='No questions match those settings. Choose Mixed difficulty or another audience.';return}index=0;answered=false;activeTeam=0;scores=[0,0];soloCorrect=0;$('setupView').classList.add('hidden');$('completeView').classList.add('hidden');$('gameView').classList.remove('hidden');$('scoreboard').classList.toggle('hidden',$('mode').value==='solo');renderScore();render()}
function render(){if(index>=round.length){finish();return}answered=false;const item=round[index];$('question').textContent=item.prompt;$('reference').textContent='';$('counter').textContent=`${index+1} of ${round.length}`;$('bar').style.width=`${index/round.length*100}%`;$('feedback').textContent='';$('next').classList.add('hidden');document.querySelectorAll('.answer').forEach(button=>{button.disabled=false;button.classList.remove('correct','wrong')})}
function answer(choice,button){if(answered)return;answered=true;const item=round[index],correct=item.answer;window.NLDG_GAME_PACKS?.record(item);document.querySelectorAll('.answer').forEach(answerButton=>{answerButton.disabled=true;if(answerButton.dataset.answer===correct)answerButton.classList.add('correct')});if(choice===correct){button.classList.add('correct');$('feedback').textContent='Correct!';if($('mode').value==='solo')soloCorrect++;else scores[activeTeam]+=100}else{button.classList.add('wrong');$('feedback').textContent=`The answer is ${correct}.`}$('reference').textContent=item.scripture?`Reference: ${item.scripture}`:'';renderScore();$('next').classList.remove('hidden')}
function renderScore(){document.querySelectorAll('.team').forEach((card,i)=>{card.classList.toggle('active',i===activeTeam);card.querySelector('span').textContent=scores[i]})}
function next(){index++;if($('mode').value==='teams')activeTeam=(activeTeam+1)%2;renderScore();render()}
function finish(){$('gameView').classList.add('hidden');$('completeView').classList.remove('hidden');$('summary').textContent=$('mode').value==='solo'?`You answered ${soloCorrect} of ${round.length} correctly.`:`Team Grace: ${scores[0]} points. Team Truth: ${scores[1]} points.`;$('bar').style.width='100%';updateCounts()}
function quit(){$('gameView').classList.add('hidden');$('completeView').classList.add('hidden');$('setupView').classList.remove('hidden');updateCounts()}
[$('pack'),$('group'),$('difficulty')].forEach(control=>control.addEventListener('change',updateCounts));$('start').onclick=start;$('quit').onclick=quit;$('again').onclick=quit;$('next').onclick=next;document.querySelectorAll('.answer').forEach(button=>button.onclick=()=>answer(button.dataset.answer,button));$('resetHistory').onclick=()=>{window.NLDG_GAME_PACKS?.resetHistory($('pack').value);$('packNotice').textContent='History cleared for this pack.';updateCounts()};$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{$('packNotice').textContent='Use your browser fullscreen option or Add to Home Screen on iPad.'}};
loadPacks();
</script>
<script src="nldg-i18n.js?v=1.1.0"></script></body>
</html>
