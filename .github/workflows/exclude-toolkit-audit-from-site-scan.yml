name: Exclude Toolkit Audit from Site Scan

on:
  push:
    branches:
      - agent/leadership-toolkit
    paths:
      - '.github/workflows/exclude-toolkit-audit-from-site-scan.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out toolkit branch
        uses: actions/checkout@v4
        with:
          ref: agent/leadership-toolkit
          fetch-depth: 0

      - name: Exclude browser audit tooling from public link scan
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('scripts/audit-site.mjs')
          text=path.read_text(encoding='utf-8')
          old="'scripts/leadership-quality-audit.mjs']);"
          new="'scripts/leadership-quality-audit.mjs', 'scripts/leadership-toolkit-audit.mjs']);"
          if 'scripts/leadership-toolkit-audit.mjs' not in text:
              if old not in text:
                  raise SystemExit('Site audit exclusion anchor was not found.')
              text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit repair
        run: |
          rm -f .github/workflows/exclude-toolkit-audit-from-site-scan.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit-site.mjs .github/workflows/exclude-toolkit-audit-from-site-scan.yml
          git commit -m "Exclude Toolkit browser audit from site scan"
          git pull --rebase origin agent/leadership-toolkit
          git push origin agent/leadership-toolkit
