name: Repair Leadership Audit Scan

on:
  push:
    branches:
      - review/leadership-quality
    paths:
      - '.github/workflows/fix-leadership-audit-scan.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: review/leadership-quality
          fetch-depth: 0

      - name: Exclude test tooling from public reference scan
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/audit-site.mjs')
          text = path.read_text(encoding='utf-8')
          old = "'scripts/interactive-audit.mjs']);"
          new = "'scripts/interactive-audit.mjs', 'scripts/leadership-quality-audit.mjs']);"
          if 'scripts/leadership-quality-audit.mjs' not in text:
              if old not in text:
                  raise SystemExit('Audit exclusion anchor was not found.')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit repair
        run: |
          rm -f .github/workflows/fix-leadership-audit-scan.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit-site.mjs .github/workflows/fix-leadership-audit-scan.yml
          git commit -m "Exclude Leadership audit tooling from site scan"
          git pull --rebase origin review/leadership-quality
          git push origin review/leadership-quality
