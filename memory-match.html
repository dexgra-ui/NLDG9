<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071735"><title>Memory Match | No Labels, Designed by God</title><style>:root{--gold:#ffd34e;--text:#f7f9ff;--muted:#cbd5f3;--green:#35c779;--line:rgba(255,255,255,.14)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#1d4c9e 0,#081735 42%,#030713 100%);color:var(--text)}button,select{font:inherit}.hidden{display:none!important}.app{max-width:1300px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px;border:1px solid var(--line);border-radius:18px;background:rgba(5,16,44,.94)}.brand{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none}.brand img{width:52px;height:52px}.brand strong{display:block}.brand small{color:var(--muted)}.btn{border:1px solid var(--line);border-radius:12px;padding:11px 15px;font-weight:800;background:#243b78;color:white;text-decoration:none;cursor:pointer}.btn.gold{background:linear-gradient(#fff0a4,var(--gold));color:#2d2400}.hero{text-align:center;padding:42px 12px 24px}.hero h1{font-size:clamp(42px,8vw,84px);margin:0}.hero p{color:var(--muted);font-size:1.15rem}.setup{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:20px;border:1px solid var(--line);border-radius:20px;background:rgba(10,25,64,.88)}label{display:grid;gap:7px;font-weight:800;color:var(--muted)}select{padding:12px;border-radius:10px;border:1px solid var(--line);background:#071735;color:white}.setup-actions{grid-column:1/-1;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:18px 0}.stat{padding:9px 13px;border-radius:999px;background:#12295e;color:var(--muted);font-weight:800}.scoreboard{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}.team{padding:12px;border:1px solid var(--line);border-radius:14px;background:#0b1d4d;text-align:center}.team.active{outline:3px solid var(--gold)}.team strong{display:block}.team span{font-size:2rem;color:var(--gold);font-weight:900}.game{padding:20px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(180deg,rgba(8,22,58,.98),rgba(3,10,30,.98));min-height:70vh}.game-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.card{min-height:120px;border:2px solid var(--line);border-radius:16px;background:linear-gradient(#315de2,#122e89);color:var(--gold);font-size:clamp(24px,3vw,38px);font-weight:900;cursor:pointer;padding:12px}.card.open,.card.matched{background:white;color:#12204a;outline:4px solid var(--gold)}.card.matched{background:#c6f1d8}.feedback{text-align:center;min-height:46px;margin:16px;color:var(--gold);font-size:clamp(20px,2.7vw,32px);font-weight:900}.complete{text-align:center;padding:50px 20px}.complete h2{font-size:clamp(38px,6vw,68px)}@media(max-width:850px){.setup{grid-template-columns:1fr}.memory-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:560px){.memory-grid{grid-template-columns:repeat(2,1fr)}.card{min-height:100px}}</style></head><body><div class="app"><header class="top"><a class="brand" href="play.html"><img src="no-labels-approved-logo.png" alt=""><span><strong>No Labels Games</strong><small>Memory Match</small></span></a><div><a class="btn" href="play.html">Game Center</a> <button id="fullscreen" class="btn">Fullscreen</button></div></header><section id="setupView"><div class="hero"><h1>Memory Match</h1><p>Match Bible people, places, events, and teachings.</p></div><div class="setup"><label>Audience<select id="group"><option value="preschool">Preschool</option><option value="kids">Kids</option><option value="teens">Teens</option><option value="adults">Adults</option><option value="family" selected>Family</option></select></label><label>Pairs<select id="pairs"><option value="6">6 pairs</option><option value="8" selected>8 pairs</option><option value="10">10 pairs</option><option value="12">12 pairs</option></select></label><label>Play mode<select id="mode"><option value="teams" selected>Two Teams</option><option value="solo">Solo</option></select></label><div class="setup-actions"><button id="start" class="btn gold">Start Game</button><button id="resetHistory" class="btn">Reset Recent Pairs</button></div></div><div class="stats"><span class="stat" id="bankCount"></span><span class="stat">Randomized numbered cards</span><span class="stat">Recent pairs rotate out</span></div></section><section id="gameView" class="hidden"><div id="scoreboard" class="scoreboard"><div class="team active"><strong>Team Grace</strong><span>0</span></div><div class="team"><strong>Team Truth</strong><span>0</span></div></div><div class="game"><div class="game-head"><button id="quit" class="btn">← Exit</button><strong id="counter"></strong></div><div id="grid" class="memory-grid"></div><div id="feedback" class="feedback"></div></div></section><section id="completeView" class="complete hidden"><h2>All Matches Found!</h2><p id="summary"></p><div><button id="again" class="btn gold">Play Again</button> <a class="btn" href="play.html">Return to Game Center</a></div></section></div><script>
const BASE=[["Noah","Ark"],["David","Goliath"],["Jonah","Great Fish"],["Daniel","Lions"],["Moses","Red Sea"],["Jesus","Manger"],["Esther","Queen"],["Joshua","Jericho"],["Samson","Strength"],["Joseph","Colorful Coat"],["Ruth","Naomi"],["Solomon","Wisdom"],["Peter","Rock"],["Paul","Letters"],["Mary","Mother of Jesus"],["John the Baptist","Jordan River"],["Elijah","Whirlwind"],["Nehemiah","Wall"],["Gideon","300 Men"],["Zacchaeus","Sycamore Tree"]];
const EXTRA={preschool:[["Adam","First Man"],["Eve","First Woman"],["Abraham","Isaac"],["Rainbow","Flood Promise"],["Bethlehem","Jesus' Birth"]],kids:[["Miriam","Moses' Sister"],["Samuel","Heard God"],["Gideon","Fleece"],["Ruth","Boaz"],["Lydia","Purple Cloth"],["Thomas","Doubted"],["Stephen","First Martyr"],["Timothy","Paul's Helper"]],teens:[["Barnabas","Encouragement"],["Philip","Ethiopian Official"],["Nicodemus","Born Again"],["Priscilla","Aquila"],["Cornelius","Centurion"],["Damascus","Saul"],["Pentecost","Holy Spirit"],["Berea","Searched Scripture"]],adults:[["Phoebe","Romans"],["Hosea","Gomer"],["Elisha","Double Portion"],["Deborah","Barak"],["Jael","Tent Peg"],["Ezra","Law"],["Cyrus","Return from Exile"],["Gamaliel","Sanhedrin"]],family:[["Pentecost","Holy Spirit"],["Bethlehem","Jesus' Birth"],["Damascus","Saul"],["Lydia","Purple Cloth"],["Stephen","First Martyr"],["Barnabas","Encouragement"],["Ruth","Boaz"],["Samuel","Heard God"]]};
const BANK={};Object.keys(EXTRA).forEach(g=>BANK[g]=[...BASE,...EXTRA[g]]);const $=id=>document.getElementById(id);let deck=[],first=null,locked=false,matches=0,activeTeam=0,scores=[0,0],attempts=0;function shuffle(a){const c=[...a];for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]]}return c}function key(g){return `nldg-memory-recent-${g}`}function choosePairs(g,n){const bank=BANK[g];let recent=[];try{recent=JSON.parse(localStorage.getItem(key(g))||'[]')}catch{}const unseen=bank.filter(p=>!recent.includes(p.join('|')));const source=unseen.length>=n?unseen:bank;const selected=shuffle(source).slice(0,n);localStorage.setItem(key(g),JSON.stringify([...selected.map(p=>p.join('|')),...recent].slice(0,Math.max(6,bank.length-6))));return selected}function updateBankCount(){$('bankCount').textContent=`${BANK[$('group').value].length} pair combinations available`}function start(){const chosen=choosePairs($('group').value,Number($('pairs').value));deck=shuffle(chosen.flatMap((p,id)=>p.map(text=>({id,text,open:false,matched:false}))));first=null;locked=false;matches=0;activeTeam=0;scores=[0,0];attempts=0;$('setupView').classList.add('hidden');$('completeView').classList.add('hidden');$('gameView').classList.remove('hidden');$('scoreboard').classList.toggle('hidden',$('mode').value==='solo');renderScore();render()}function render(){$('grid').innerHTML='';deck.forEach((card,i)=>{const b=document.createElement('button');b.className='card'+(card.open?' open':'')+(card.matched?' matched':'');b.textContent=(card.open||card.matched)?card.text:i+1;b.onclick=()=>flip(i);$('grid').appendChild(b)});$('counter').textContent=`Matches ${matches} of ${deck.length/2}`;$('feedback').textContent=locked?'Checking match...':`${$('mode').value==='solo'?'Your':'Team '+(activeTeam===0?'Grace':'Truth')+'’s'} turn`}function flip(i){if(locked||deck[i].open||deck[i].matched)return;deck[i].open=true;render();if(first===null){first=i;return}locked=true;attempts++;setTimeout(()=>{if(deck[first].id===deck[i].id){deck[first].matched=deck[i].matched=true;matches++;if($('mode').value==='teams')scores[activeTeam]+=100;$('feedback').textContent='Match found!'}else{deck[first].open=deck[i].open=false;if($('mode').value==='teams')activeTeam=(activeTeam+1)%2;$('feedback').textContent='No match. Next turn.'}first=null;locked=false;renderScore();render();if(matches===deck.length/2)finish()},650)}function renderScore(){document.querySelectorAll('.team').forEach((c,i)=>{c.classList.toggle('active',i===activeTeam);c.querySelector('span').textContent=scores[i]})}function finish(){setTimeout(()=>{$('gameView').classList.add('hidden');$('completeView').classList.remove('hidden');$('summary').textContent=$('mode').value==='solo'?`You completed the board in ${attempts} turns.`:`Team Grace: ${scores[0]} points • Team Truth: ${scores[1]} points`},250)}$('start').onclick=start;$('again').onclick=()=>{$('completeView').classList.add('hidden');$('setupView').classList.remove('hidden')};$('quit').onclick=()=>{if(confirm('Exit this game?')){$('gameView').classList.add('hidden');$('setupView').classList.remove('hidden')}};$('group').onchange=updateBankCount;$('resetHistory').onclick=()=>{Object.keys(BANK).forEach(g=>localStorage.removeItem(key(g)));alert('Recent-pair history has been reset.')};$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{alert('Fullscreen is blocked here. On iPad, use Share → Add to Home Screen.')}};updateBankCount();
</script></body></html>
