name: Spanish John Audit

on:
  push:
    paths:
      - 'john-study.html'
      - 'john-study-data.js'
      - 'john-study-guide.js'
      - 'john-study-data-es.js'
      - 'es/juan-estudio.html'
      - 'es/estudios-biblicos.html'
      - 'nldg-i18n.js'
      - 'book-study-series.js'
      - 'book-study-series-es.js'
      - 'scripts/spanish-john-audit.mjs'
      - 'scripts/spanish-acts-audit.mjs'
      - '.github/workflows/spanish-john-audit.yml'
  pull_request:
    paths:
      - 'john-study.html'
      - 'john-study-data.js'
      - 'john-study-guide.js'
      - 'john-study-data-es.js'
      - 'es/juan-estudio.html'
      - 'es/estudios-biblicos.html'
      - 'nldg-i18n.js'
      - 'book-study-series.js'
      - 'book-study-series-es.js'
      - 'scripts/spanish-john-audit.mjs'
      - 'scripts/spanish-acts-audit.mjs'
      - '.github/workflows/spanish-john-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spanish-john:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit Spanish John study
        run: node scripts/spanish-john-audit.mjs
