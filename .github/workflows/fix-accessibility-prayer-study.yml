name: Fix Remaining Accessibility Finding

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-accessibility-prayer-study.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Label prayer study selector
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('dashboard.html')
          text = path.read_text(encoding='utf-8')
          old = '<select id="prayer-study">'
          new = '<select id="prayer-study" aria-label="Study connected to this prayer">'
          if old not in text:
              raise SystemExit('Prayer study selector was not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit
        run: |
          git rm -f .github/workflows/fix-accessibility-prayer-study.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Label prayer study selector"
          git pull --rebase origin main
          git push
