name: Fix Presentation Team Setup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-presentation-team-setup.yml'

permissions:
  contents: write

jobs:
  fix:
    name: Route presentation mode through team setup
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update presentation flow and interactive test
        run: |
          python - <<'PY'
          from pathlib import Path

          games = Path('games.html')
          text = games.read_text(encoding='utf-8')

          old_tournament = '''function openTournament(){ $("teamCount").value=String(Math.max(1,state.teams.length)); renderTeamEditors(); updateStatus(); showView("tournamentView"); }
          function beginTournament(){
            state.teams=currentSetupTeams();
            state.activeTeam=$("firstTeamMode").value==="random"?Math.floor(Math.random()*state.teams.length):0;
            state.tournament={active:true,round:1,total:Number($("tournamentRounds").value),group:$("tournamentGroup").value,teamCount:state.teams.length};
            state.group=state.tournament.group; state.scoreHistory=[]; resetScores(false); saveTeams(); saveTournament();
            $("tournamentBadge").classList.remove("hidden");
            document.dispatchEvent(new CustomEvent("nldg:open-library",{detail:{group:state.group}}));
          }'''
          new_tournament = '''function openTournament(){ $("teamCount").value=String(Math.max(1,state.teams.length)); renderTeamEditors(); updateStatus(); showView("tournamentView"); }
          let pendingPresentationGame=null;
          function beginTournament(){
            state.teams=currentSetupTeams();
            state.activeTeam=$("firstTeamMode").value==="random"?Math.floor(Math.random()*state.teams.length):0;
            state.tournament={active:true,round:1,total:Number($("tournamentRounds").value),group:$("tournamentGroup").value,teamCount:state.teams.length};
            state.group=state.tournament.group; state.scoreHistory=[]; resetScores(false); saveTeams(); saveTournament();
            $("tournamentBadge").classList.remove("hidden");
            if(pendingPresentationGame){
              const gameId=pendingPresentationGame;
              pendingPresentationGame=null;
              launchGame(gameId);
            }else{
              document.dispatchEvent(new CustomEvent("nldg:open-library",{detail:{group:state.group}}));
            }
          }'''
          if old_tournament not in text:
              raise SystemExit('Tournament setup block was not found.')
          text = text.replace(old_tournament, new_tournament, 1)

          old_history = '''history.replaceState(null,"",`games.html?group=${encodeURIComponent(state.group)}&game=${encodeURIComponent(gameId)}`);'''
          new_history = '''const presentationQuery=document.body.classList.contains("presentation-ready")?"&presentation=1":"";
              history.replaceState(null,"",`games.html?group=${encodeURIComponent(state.group)}&game=${encodeURIComponent(gameId)}${presentationQuery}`);'''
          if old_history not in text:
              raise SystemExit('Game history line was not found.')
          text = text.replace(old_history, new_history, 1)

          old_library = '''function openLibrary(group){
            const safeGroup=quizData[group]?group:"family";
            state.group=safeGroup;
            $("groupLabel").textContent=quizData[safeGroup].label;
            $("tournamentBadge").classList.toggle("hidden",!state.tournament?.active);
            showView("library");
            if(!new URLSearchParams(location.search).get("game")) history.replaceState(null,"",`games.html?group=${encodeURIComponent(safeGroup)}`);
          }'''
          new_library = '''function openLibrary(group){
            const safeGroup=quizData[group]?group:"family";
            state.group=safeGroup;
            $("groupLabel").textContent=quizData[safeGroup].label;
            $("tournamentBadge").classList.toggle("hidden",!state.tournament?.active);
            showView("library");
            const params=new URLSearchParams(location.search);
            if(!params.get("game")){
              const presentationQuery=document.body.classList.contains("presentation-ready")?"&presentation=1":"";
              history.replaceState(null,"",`games.html?group=${encodeURIComponent(safeGroup)}${presentationQuery}`);
            }
          }'''
          if old_library not in text:
              raise SystemExit('Open-library block was not found.')
          text = text.replace(old_library, new_library, 1)

          old_launch = '''function autoLaunchFromUrl(){
            const params=new URLSearchParams(window.location.search);
            const requestedGroup=params.get("group");
            const requestedGame=params.get("game");
            const presentation=params.get("presentation");

            if(requestedGroup || requestedGame || presentation==="1"){
              $("intro").classList.add("hidden");
              openLibrary(requestedGroup || "family");
            }

            if(presentation==="1"){
              document.body.classList.add("presentation-ready");
              const note=document.createElement("div");
              note.className="presentation-note";
              note.innerHTML="<strong>Church Presentation Mode</strong><span>Tap Fullscreen when you are ready to project.</span>";
              document.body.appendChild(note);
              requestAnimationFrame(()=>note.classList.add("show"));
            }

            if(requestedGame){
              requestAnimationFrame(()=>launchGame(requestedGame));
            }
          }'''
          new_launch = '''function autoLaunchFromUrl(){
            const params=new URLSearchParams(window.location.search);
            const requestedGroup=params.get("group");
            const requestedGame=params.get("game");
            const presentation=params.get("presentation");

            if(presentation==="1"){
              $("intro").classList.add("hidden");
              document.body.classList.add("presentation-ready");
              const safeGroup=quizData[requestedGroup]?requestedGroup:"family";
              $("tournamentGroup").value=safeGroup;
              pendingPresentationGame=GAME_REGISTRY[requestedGame]?requestedGame:null;
              openTournament();
              const note=document.createElement("div");
              note.className="presentation-note";
              note.innerHTML="<strong>Church Presentation Mode</strong><span>Set up the teams first, then start the tournament and choose a game.</span>";
              document.body.appendChild(note);
              requestAnimationFrame(()=>note.classList.add("show"));
              return;
            }

            if(requestedGroup || requestedGame){
              $("intro").classList.add("hidden");
              openLibrary(requestedGroup || "family");
            }

            if(requestedGame){
              requestAnimationFrame(()=>launchGame(requestedGame));
            }
          }'''
          if old_launch not in text:
              raise SystemExit('Auto-launch block was not found.')
          text = text.replace(old_launch, new_launch, 1)
          games.write_text(text, encoding='utf-8')

          audit = Path('scripts/interactive-audit.mjs')
          audit_text = audit.read_text(encoding='utf-8')
          old_test = '''    const introButton = page.locator('#startShowBtn');
              if (await introButton.count() && await introButton.isVisible()) await introButton.click();
              await page.click('#openTournamentBtn');
              await page.selectOption('#teamCount', '8');'''
          new_test = '''    const introButton = page.locator('#startShowBtn');
              if (await introButton.count() && await introButton.isVisible()) await introButton.click();
              requireTrue(!(await page.locator('#tournamentView').evaluate(element => element.classList.contains('hidden'))), 'Presentation mode did not open team setup first.');
              await page.selectOption('#teamCount', '8');'''
          if old_test not in audit_text:
              raise SystemExit('Interactive presentation test block was not found.')
          audit.write_text(audit_text.replace(old_test, new_test, 1), encoding='utf-8')
          PY

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.html scripts/interactive-audit.mjs
          git commit -m "Start church presentation with team setup"
          git pull --rebase origin main
          git push
