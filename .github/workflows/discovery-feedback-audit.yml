name: Discovery and Feedback Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'site-discovery.js'
      - 'site-discovery.css'
      - 'contact-links.js'
      - 'es/es-framework.js'
      - 'studies.html'
      - 'content-library.js'
      - 'scripts/discovery-feedback-audit.mjs'
      - 'scripts/lesson-reflections-browser-audit.mjs'
      - 'scripts/responsive-audit.mjs'
      - '.github/workflows/discovery-feedback-audit.yml'

permissions:
  contents: read

jobs:
  discovery-feedback:
    name: Study listings, Start Here, feedback, related resources, and regressions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser audit tools
        run: |
          npm install --no-save playwright axe-core
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/nldg-http.log 2>&1 &
          echo $! > /tmp/nldg-http.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nldg-http.log
          exit 1

      - name: Run discovery and feedback browser audit
        run: node scripts/discovery-feedback-audit.mjs

      - name: Re-run lesson reflection regression audit
        run: node scripts/lesson-reflections-browser-audit.mjs

      - name: Run responsive layout audit
        run: node scripts/responsive-audit.mjs

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-feedback-audit-results
          path: responsive-audit-results
          if-no-files-found: warn
