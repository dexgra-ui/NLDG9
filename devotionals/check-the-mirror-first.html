<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06122d"><meta name="description" content="Before we ask what the church is producing, discipleship calls us to let Scripture examine and transform the person in the mirror."><title>Check the Mirror First | No Labels, Designed by God</title><link rel="canonical" href="https://nolabelsdesignedbygod.org/devotionals/check-the-mirror-first.html"><meta property="og:type" content="article"><meta property="og:site_name" content="No Labels, Designed by God"><meta property="og:title" content="Check the Mirror First"><meta property="og:description" content="Real discipleship begins when we allow God’s Word to examine and change us, not just everyone else."><meta property="og:url" content="https://nolabelsdesignedbygod.org/devotionals/check-the-mirror-first.html"><meta property="og:image" content="https://nolabelsdesignedbygod.org/no-labels-approved-logo.png"><meta property="og:image:alt" content="No Labels, Designed by God ministry logo"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Check the Mirror First"><meta name="twitter:description" content="A devotional from James 1:22–25 about discipleship, self-examination, and obedience."><meta name="twitter:image" content="https://nolabelsdesignedbygod.org/no-labels-approved-logo.png"><script id="nldg-structured-data" type="application/ld+json">{"@context":"https://schema.org","@type":"BlogPosting","headline":"Check the Mirror First","description":"Before we ask what the church is producing, discipleship calls us to let Scripture examine and transform the person in the mirror.","mainEntityOfPage":"https://nolabelsdesignedbygod.org/devotionals/check-the-mirror-first.html","author":{"@type":"Person","name":"Dexter Graham"},"publisher":{"@type":"Organization","name":"No Labels, Designed by God"},"articleSection":"Discipleship and Self-Examination","about":"James 1:22–25"}</script><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../devotionals-v2.css"></head><body><header class="site-header"><a class="brand" href="../index.html"><span class="brand-icon brand-logo"><img src="../no-labels-approved-logo.png" alt=""></span><span><strong>No Labels, Designed by God</strong><small>Devotional Center</small></span></a><button class="menu" aria-expanded="false">Menu</button><nav><a href="../index.html">Home</a><a href="../studies.html">Bible Studies</a><a class="active" href="../devotionals.html">Devotionals</a><a href="../articles.html">Articles</a><a href="../resource-center.html">Resources</a></nav></header><main class="reader-shell"></main><footer class="ministry-footer"><small>© <span data-year>2026</span> No Labels Designed by God, LLC.</small></footer><script src="../devotional-data.js?v=1.2.0"></script><script>if(!window.NLDG_DEVOTIONALS?.some(item=>item.id==='check-the-mirror-first'))window.NLDG_DEVOTIONALS.unshift({id:'check-the-mirror-first',theme:'Discipleship and Self-Examination',title:'Check the Mirror First',reference:'James 1:22–25',minutes:'6-minute devotional',summary:'It is easy to ask why the church is not producing more disciples. James reminds us that real change begins when we stop only hearing God’s Word and allow it to change the person in the mirror.',scriptureFocus:'“Do not merely listen to the word, and so deceive yourselves. Do what it says.” James 1:22 (NIV)',reflection:['I have been thinking about a question that I believe the church has to wrestle with: Are we producing disciples, or are we simply producing people who know how to attend church? Those are not necessarily the same thing.','Church attendance can be part of discipleship. Gathering with other believers matters. Worship matters. Teaching matters. Fellowship matters. But we can sit in church every week, hear Scripture, sing songs, participate in programs, and still resist allowing Jesus to change the way we actually live.','James gives us a picture that is difficult to ignore. He says hearing the Word without doing what it says is like looking at yourself in a mirror and then walking away without remembering what you saw.','That makes me think about how easy it is to use Scripture as a window instead of a mirror. A window lets me look at everybody else. I can see what the church is doing wrong. I can see what another Christian needs to change. I can see what society is getting wrong. I can see where somebody else is falling short.','But a mirror does something different. A mirror turns the examination toward me. Before I ask why the church is not producing disciples, I have to ask whether I am actually living as one.','Am I becoming more like Jesus? Am I more loving than I was a year ago? Am I becoming more patient? Am I quicker to forgive? Do I treat people with dignity when I disagree with them? Does Scripture change my decisions, or do I simply use Scripture to support decisions I have already made? Do the people closest to me see the same faith that people at church see?','Those questions are harder because they do not allow me to hide inside the crowd. Jesus never called us simply to attend something. He said, “Follow me.” Following requires movement. It requires learning His ways and then practicing them.','It means allowing His teaching to challenge our attitudes, our habits, our priorities, our relationships, and even the things about ourselves we would rather not examine. That is what discipleship looks like.','The church absolutely should ask whether our ministries are helping people become followers of Jesus. Leaders should examine what we teach, what we model, and what we celebrate. But that examination cannot stop at the church doors. Eventually, every disciple has to stand in front of the mirror.','The question becomes personal: What is Jesus changing in me? If I have been following Him for years but refuse correction, refuse forgiveness, refuse service, refuse humility, and refuse to love people who are difficult to love, then simply attending church has not accomplished what discipleship is supposed to accomplish.','None of us have arrived. That is not the point. The point is direction. Are we allowing Jesus to form us?','James does not tell us to stop looking into the mirror because we do not like what we see. He tells us to look carefully into God’s Word and continue in it. God reveals things so He can transform them.','So yes, we should ask what the church is doing to make disciples. But before pointing across the sanctuary, across the denomination, or across the culture, maybe the first place to look is the mirror. Because revival, renewal, and real discipleship always have a personal starting point. Lord, begin with me.'],questions:['When you read Scripture, are you primarily thinking about how it applies to other people or how it applies to you?','What evidence can you see that following Jesus is changing your character?','Is there something God has already shown you that you have heard repeatedly but still have not acted on?'],action:['Read James 1:22–25 slowly.','Instead of asking, “Who needs to hear this?” ask, “What is God showing me?”','Choose one area where Scripture is calling you to action and take one practical step today.','Before criticizing something you see in another believer or in the church, pray: “Lord, show me what You are working on in me.”'],prayer:'Father, it is easy for me to see what needs to change in everyone else. Help me have the courage to look honestly at my own life. Do not let me become someone who hears Your Word without allowing it to change me. Show me the places where my attitudes, habits, words, and actions do not reflect Jesus. Give me humility to receive correction and courage to obey what You show me. As I think about what the church needs to become, remind me that I am part of the church. Begin Your work in me. Make me more than someone who attends. Teach me to truly follow Jesus. In His name, Amen.'});</script><script src="../seo.js?v=1.0.0"></script><script src="../devotional-reader.js?v=1.2.0"></script><script>const menu=document.querySelector('.menu');menu?.addEventListener('click',()=>{const open=document.body.classList.toggle('nav-open');menu.setAttribute('aria-expanded',String(open));menu.textContent=open?'Close':'Menu'});document.querySelectorAll('[data-year]').forEach(el=>el.textContent=new Date().getFullYear());</script></body></html>
