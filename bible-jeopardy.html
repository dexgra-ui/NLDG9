<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071735"><title>Bible Jeopardy | No Labels, Designed by God</title><style>:root{--gold:#ffd34e;--text:#f7f9ff;--muted:#cbd5f3;--green:#35c779;--line:rgba(255,255,255,.14)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#1d4c9e 0,#081735 42%,#030713 100%);color:var(--text)}button,select,input{font:inherit}.hidden{display:none!important}.app{max-width:1500px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border:1px solid var(--line);border-radius:18px;background:rgba(5,16,44,.95)}.brand{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none}.brand img{width:52px;height:52px}.brand strong{display:block}.brand small{color:var(--muted)}.btn{border:1px solid var(--line);border-radius:12px;padding:11px 15px;font-weight:800;background:#243b78;color:white;text-decoration:none;cursor:pointer}.btn.gold{background:linear-gradient(#fff0a4,var(--gold));color:#2d2400}.btn.green{background:var(--green)}.hero{text-align:center;padding:42px 12px 24px}.hero h1{font-size:clamp(42px,8vw,84px);margin:0}.hero p{color:var(--muted);font-size:1.15rem}.setup{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:20px;border:1px solid var(--line);border-radius:20px;background:rgba(10,25,64,.88)}label{display:grid;gap:7px;font-weight:800;color:var(--muted)}select,input{padding:12px;border-radius:10px;border:1px solid var(--line);background:#071735;color:white}.team-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;grid-column:1/-1}.setup-actions{grid-column:1/-1;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.scoreboard{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0}.team{padding:12px;border:1px solid var(--line);border-radius:14px;background:#0b1d4d;text-align:center}.team.active{outline:3px solid var(--gold)}.team strong{display:block}.team span{font-size:2rem;color:var(--gold);font-weight:900}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.cell{min-height:88px;border:2px solid rgba(255,255,255,.1);border-radius:12px;background:linear-gradient(#174dd4,#0d2e91);color:var(--gold);font-size:clamp(20px,2.4vw,32px);font-weight:900;text-shadow:0 3px 8px #000;cursor:pointer}.cell.header{background:linear-gradient(#151c4f,#070d28);color:white;font-size:clamp(13px,1.7vw,20px);cursor:default}.cell.used{background:#111833;color:#5f6b8e}.overlay{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 18%,rgba(52,103,225,.75),transparent 38%),linear-gradient(#081b48,#030a1f)}.card{width:min(1100px,96vw);min-height:min(650px,90vh);display:flex;flex-direction:column;justify-content:center;gap:20px;border:3px solid rgba(255,211,78,.45);border-radius:28px;padding:clamp(24px,5vw,58px);background:linear-gradient(#091c49,#030a1d)}.meta{text-align:center;color:var(--gold);font-size:clamp(22px,3vw,40px);font-weight:900}.question{text-align:center;font-size:clamp(38px,5.5vw,76px);font-weight:900;line-height:1.08}.answer{text-align:center;color:var(--gold);font-size:clamp(34px,4.8vw,64px);font-weight:900;padding:18px;border-radius:16px;background:#111f45}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.complete{text-align:center;padding:50px 20px}.complete h2{font-size:clamp(38px,6vw,68px)}@media(max-width:760px){.setup{grid-template-columns:1fr}.team-fields{grid-template-columns:1fr}.board{gap:5px}.cell{min-height:68px;font-size:17px}.cell.header{font-size:11px}.top{position:static}}</style></head><body><div class="app"><header class="top"><a class="brand" href="play.html"><img src="no-labels-approved-logo.png" alt=""><span><strong>No Labels Games</strong><small>Bible Jeopardy</small></span></a><div><a class="btn" href="play.html">Game Center</a> <button id="fullscreen" class="btn">Fullscreen</button></div></header><section id="setupView"><div class="hero"><h1>Bible Jeopardy</h1><p>Choose a category, reveal the answer, and award the points.</p></div><div class="setup"><label>Audience<select id="group"><option value="preschool">Preschool</option><option value="kids">Kids</option><option value="teens">Teens</option><option value="adults">Adults</option><option value="family" selected>Family</option></select></label><label>Starting Team<select id="starting"><option value="0">Team Grace</option><option value="1">Team Truth</option><option value="random">Choose Randomly</option></select></label><div class="team-fields"><label>Team 1<input id="team1" value="Team Grace"></label><label>Team 2<input id="team2" value="Team Truth"></label></div><div class="setup-actions"><button id="start" class="btn gold">Start Board</button></div></div></section><section id="gameView" class="hidden"><div id="scoreboard" class="scoreboard"><div class="team active"><strong>Team Grace</strong><span>0</span></div><div class="team"><strong>Team Truth</strong><span>0</span></div></div><div class="actions" style="margin-bottom:12px"><button id="resetBoard" class="btn">Reset Board</button><button id="endGame" class="btn gold">End Game</button></div><div id="board" class="board"></div></section><section id="completeView" class="complete hidden"><h2>Game Complete!</h2><p id="summary"></p><div><button id="again" class="btn gold">Play Again</button> <a class="btn" href="play.html">Return to Game Center</a></div></section></div><div id="overlay" class="overlay hidden"><div class="card"><div id="meta" class="meta"></div><div id="question" class="question"></div><div id="answer" class="answer hidden"></div><div class="actions"><button id="reveal" class="btn gold">Reveal Answer</button><button id="award1" class="btn green hidden"></button><button id="award2" class="btn green hidden"></button><button id="noAward" class="btn hidden">No Award</button></div></div></div><script>
const CATS=['People','Places','Books','Teachings','Events'];
const BASE={People:[['Who built the ark?','Noah'],['Who defeated Goliath?','David'],['Who led Israel out of Egypt?','Moses'],['Who was in the lions’ den?','Daniel'],['Who was Jesus’ mother?','Mary']],Places:[['Where was Jesus born?','Bethlehem'],['Where did Moses receive the commandments?','Mount Sinai'],['Where did Jesus grow up?','Nazareth'],['Where was Jesus baptized?','The Jordan River'],['Where did John receive Revelation?','Patmos']],Books:[['What is the first book of the Bible?','Genesis'],['Which book contains many songs and prayers?','Psalms'],['Which book follows the four Gospels?','Acts'],['Which book tells Esther’s story?','Esther'],['What is the final book of the Bible?','Revelation']],Teachings:[['What is the greatest commandment?','Love God'],['What is the second greatest commandment?','Love your neighbor'],['Faith without what is dead?','Works'],['What should believers do without ceasing?','Pray'],['What does Jesus call peacemakers?','Children of God']],Events:[['What happened at Pentecost?','The Holy Spirit came'],['What happened to Jericho’s walls?','They fell'],['What did Jesus calm?','A storm'],['What happened on the third day after Jesus died?','He rose'],['What did Jesus use to feed five thousand?','Five loaves and two fish']]};
const EXTRA={preschool:{People:[['Who was swallowed by a great fish?','Jonah'],['Who was very strong?','Samson'],['Who became queen?','Esther'],['Who asked God for wisdom?','Solomon'],['Who climbed a tree to see Jesus?','Zacchaeus']],Places:[['Where did Daniel face lions?','A lions’ den'],['Where was baby Jesus laid?','A manger'],['Where did Noah and his family stay during the flood?','The ark'],['Where did Adam and Eve live?','The Garden of Eden'],['Where did Jonah travel by ship?','Toward Tarshish']],Books:[['Which part of the Bible comes first?','Old Testament'],['Which books tell about Jesus?','The Gospels'],['Which book begins with creation?','Genesis'],['Which book has David’s songs?','Psalms'],['Which Bible book ends the Bible?','Revelation']],Teachings:[['God is what?','Love'],['Should we forgive others?','Yes'],['What should we do when we need help?','Pray'],['Jesus welcomed whom?','Children'],['Who should we love?','God and others']],Events:[['What did Noah see after the flood?','A rainbow'],['What sea did Moses cross?','The Red Sea'],['What did David use against Goliath?','A sling and stone'],['What did Jesus turn water into?','Wine'],['What did God create?','The heavens and earth']]},kids:{People:[['Who interpreted Pharaoh’s dreams?','Joseph'],['Who baptized Jesus?','John the Baptist'],['Who denied Jesus three times?','Peter'],['Who rebuilt Jerusalem’s walls?','Nehemiah'],['Who led three hundred men into battle?','Gideon']],Places:[['At what city did the walls fall?','Jericho'],['Where were believers first called Christians?','Antioch'],['Where did Paul and Silas sing in prison?','Philippi'],['Where did Jesus pray before his arrest?','Gethsemane'],['Where did Paul speak to philosophers?','Athens']],Books:[['Which book tells of the early church?','Acts'],['Which book includes the armor of God?','Ephesians'],['Which book tells Ruth’s story?','Ruth'],['Which Gospel begins with “In the beginning was the Word”?','John'],['Which book includes the fruit of the Spirit?','Galatians']],Teachings:[['What sets people free?','Truth'],['What fruit includes love, joy, and peace?','The fruit of the Spirit'],['What should Christians speak in love?','Truth'],['What should believers walk by?','Faith'],['What did Jesus say to do for enemies?','Pray for them']],Events:[['What happened on the Damascus road?','Saul met Jesus'],['What happened when Paul and Silas sang?','The prison shook'],['What did the disciples find at the tomb?','It was empty'],['What happened when Elijah prayed on Mount Carmel?','Fire fell'],['What did Joseph do with Pharaoh’s dreams?','Interpreted them']]},teens:{People:[['Who confronted David after his sin?','Nathan'],['Who explained Scripture to the Ethiopian official?','Philip'],['Who mentored Timothy?','Paul'],['Who taught Apollos more accurately?','Priscilla and Aquila'],['Who was the first Christian martyr?','Stephen']],Places:[['Which church examined Scripture daily?','Berea'],['Where was Paul when he wrote many letters?','In prison'],['Where did Jesus meet the Samaritan woman?','At Jacob’s well'],['Where did Paul appeal to Caesar?','Jerusalem'],['Where was Saul headed when he met Jesus?','Damascus']],Books:[['Who wrote Acts?','Luke'],['Which book says faith without works is dead?','James'],['Which letter contains the armor of God?','Ephesians'],['Which book follows Acts?','Romans'],['Which Gospel includes the Good Samaritan?','Luke']],Teachings:[['What renews the believer?','The mind'],['What should believers test?','Everything they hear'],['What should Christians do with anxiety?','Cast it on God'],['What is the greatest of faith, hope, and love?','Love'],['What should believers do in everything?','Give thanks']],Events:[['What happened at the conversion of Cornelius?','The Holy Spirit came'],['What happened after Stephen’s death?','Believers scattered'],['What happened when Peter was imprisoned?','An angel freed him'],['What happened at the Transfiguration?','Jesus’ glory was revealed'],['What happened when Jesus raised Lazarus?','He came out of the tomb']]},adults:{People:[['Who carried Paul’s letter to the Romans?','Phoebe'],['Which prophet married Gomer?','Hosea'],['Who succeeded Elijah?','Elisha'],['Who was high priest when Samuel was young?','Eli'],['Who advised caution about persecuting the apostles?','Gamaliel']],Places:[['Which church was lukewarm?','Laodicea'],['Where did Paul meet Lydia?','Philippi'],['Where did Paul speak at the Areopagus?','Athens'],['Where was the Jerusalem Council held?','Jerusalem'],['Where did Paul spend three months after the shipwreck?','Malta']],Books:[['Which Old Testament book never names God?','Esther'],['Which letter discusses the fruit of the Spirit?','Galatians'],['Which Gospel emphasizes Jesus as the Word?','John'],['Which letter contains the “faith chapter”?','Hebrews'],['Which book records the Jerusalem Council?','Acts']],Teachings:[['What fulfills the law?','Love'],['What does perfect love drive out?','Fear'],['What should believers present as a living sacrifice?','Their bodies'],['What is the wisdom from above first of all?','Pure'],['What should believers pursue with everyone?','Peace and holiness']],Events:[['What issue did the Jerusalem Council address?','Gentile circumcision'],['What happened when Eutychus fell from a window?','Paul raised him'],['What happened to Elymas for opposing Paul?','He was struck blind'],['What happened when Ananias and Sapphira lied?','They died'],['What happened when Paul was shipwrecked?','Everyone survived']]},family:{People:[['Who interpreted Pharaoh’s dreams?','Joseph'],['Who became queen and saved her people?','Esther'],['Who baptized Jesus?','John the Baptist'],['Who met Jesus on the Damascus road?','Saul'],['Who was known as the son of encouragement?','Barnabas']],Places:[['Where were believers first called Christians?','Antioch'],['Where did Paul speak at the Areopagus?','Athens'],['Where did Jesus pray before his arrest?','Gethsemane'],['Where did Paul and Silas sing in prison?','Philippi'],['Where did John receive Revelation?','Patmos']],Books:[['Which book says faith without works is dead?','James'],['Which letter includes the armor of God?','Ephesians'],['Who wrote Acts?','Luke'],['Which Gospel begins with the Word?','John'],['Which book tells of the early church?','Acts']],Teachings:[['What sets people free?','Truth'],['What are believers called to walk by?','Faith'],['What should Christians speak in love?','Truth'],['What fruit includes love, joy, and peace?','The fruit of the Spirit'],['What is the greatest commandment?','Love God']],Events:[['What happened at Pentecost?','The Holy Spirit came'],['What happened on the Damascus road?','Saul met Jesus'],['What happened when Paul and Silas sang?','The prison shook'],['What did the disciples find at the tomb?','It was empty'],['What happened to Jericho’s walls?','They fell']]}};
const BANK={};Object.keys(EXTRA).forEach(g=>{BANK[g]={};CATS.forEach(c=>BANK[g][c]=EXTRA[g][c]||BASE[c])});const $=id=>document.getElementById(id);let scores=[0,0],active=0,current=null,names=['Team Grace','Team Truth'];function start(){names=[$('team1').value.trim()||'Team Grace',$('team2').value.trim()||'Team Truth'];active=$('starting').value==='random'?Math.floor(Math.random()*2):Number($('starting').value);scores=[0,0];$('setupView').classList.add('hidden');$('completeView').classList.add('hidden');$('gameView').classList.remove('hidden');renderScore();buildBoard()}function renderScore(){document.querySelectorAll('.team').forEach((c,i)=>{c.classList.toggle('active',i===active);c.querySelector('strong').textContent=names[i];c.querySelector('span').textContent=scores[i]})}function buildBoard(){$('board').innerHTML='';CATS.forEach(c=>{const h=document.createElement('button');h.className='cell header';h.textContent=c;h.disabled=true;$('board').appendChild(h)});for(let row=0;row<5;row++)CATS.forEach(cat=>{const b=document.createElement('button');b.className='cell';b.textContent=(row+1)*100;b.onclick=()=>openQuestion(b,cat,BANK[$('group').value][cat][row],(row+1)*100);$('board').appendChild(b)})}function openQuestion(cell,cat,item,value){if(cell.classList.contains('used'))return;cell.classList.add('used');cell.textContent='USED';current={cell,cat,item,value};$('meta').textContent=`${cat} · ${value} POINTS`;$('question').textContent=item[0];$('answer').textContent='Answer: '+item[1];$('answer').classList.add('hidden');$('reveal').classList.remove('hidden');$('award1').classList.add('hidden');$('award2').classList.add('hidden');$('noAward').classList.add('hidden');$('overlay').classList.remove('hidden')}function reveal(){$('answer').classList.remove('hidden');$('reveal').classList.add('hidden');$('award1').textContent=`Award ${names[0]}`;$('award2').textContent=`Award ${names[1]}`;$('award1').classList.remove('hidden');$('award2').classList.remove('hidden');$('noAward').classList.remove('hidden')}function award(team){scores[team]+=current.value;active=(team+1)%2;renderScore();closeOverlay()}function closeOverlay(){$('overlay').classList.add('hidden');current=null}function endGame(){$('gameView').classList.add('hidden');$('completeView').classList.remove('hidden');const high=Math.max(...scores),winners=names.filter((_,i)=>scores[i]===high);$('summary').textContent=winners.length>1?`${winners.join(' and ')} tied with ${high} points.`:`${winners[0]} wins with ${high} points!`}$('start').onclick=start;$('reveal').onclick=reveal;$('award1').onclick=()=>award(0);$('award2').onclick=()=>award(1);$('noAward').onclick=()=>{active=(active+1)%2;renderScore();closeOverlay()};$('resetBoard').onclick=()=>{if(confirm('Reset this board and scores?'))start()};$('endGame').onclick=endGame;$('again').onclick=()=>{$('completeView').classList.add('hidden');$('setupView').classList.remove('hidden')};$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{alert('Fullscreen is blocked here. On iPad, use Share → Add to Home Screen.')}};
</script></body></html>
