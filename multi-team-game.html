<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071735">
<title>Team Game | No Labels, Designed by God</title>
<style>
:root{--gold:#ffd34e;--text:#f7f9ff;--muted:#cbd5f3;--line:rgba(255,255,255,.16);--panel:#071735}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#1d4c9e 0,#081735 42%,#030713 100%);color:var(--text)}button,input,select{font:inherit}.hidden{display:none!important}.setup{max-width:1000px;margin:24px auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border:1px solid var(--line);border-radius:18px;background:rgba(5,16,44,.95)}.brand{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none}.brand img{width:52px;height:52px;object-fit:contain}.brand strong{display:block}.brand small{color:var(--muted)}.btn{border:1px solid var(--line);border-radius:12px;padding:11px 15px;font-weight:900;background:#243b78;color:#fff;text-decoration:none;cursor:pointer}.btn.gold{background:linear-gradient(#fff0a4,var(--gold));color:#2d2400}.hero{text-align:center;padding:46px 12px 26px}.hero h1{font-size:clamp(38px,7vw,76px);margin:0}.hero p{font-size:1.15rem;color:var(--muted)}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:20px;border:1px solid var(--line);border-radius:20px;background:rgba(10,25,64,.9)}label{display:grid;gap:7px;font-weight:900;color:var(--muted)}select,input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#071735;color:#fff}.names{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.actions{grid-column:1/-1;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.play-shell{height:100dvh;overflow:hidden;padding-top:118px}.scorebar{position:fixed;z-index:9999;top:0;left:0;right:0;display:grid;gap:8px;padding:8px;background:rgba(3,10,30,.98);border-bottom:2px solid rgba(255,211,78,.45);grid-template-columns:repeat(var(--team-count),minmax(125px,1fr));overflow-x:auto}.team{min-width:125px;padding:8px;border:2px solid var(--line);border-radius:13px;background:#0b1d4d;text-align:center}.team.active{outline:3px solid var(--gold)}.team strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.team span{display:block;color:var(--gold);font-size:1.7rem;font-weight:1000}.bar-actions{position:fixed;z-index:10000;right:10px;top:80px;display:flex;gap:6px}.bar-actions .btn{padding:7px 10px;font-size:.85rem}.gameframe{width:100%;height:calc(100dvh - 118px);border:0;background:#030713}.award-panel{position:fixed;z-index:20000;left:50%;bottom:18px;transform:translateX(-50%);width:min(1100px,94vw);padding:12px;border:2px solid rgba(255,211,78,.5);border-radius:16px;background:rgba(3,10,30,.98);display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.award-panel button{border:0;border-radius:10px;padding:10px 13px;font-weight:900;background:#35c779;color:#fff}.award-panel .none{background:#243b78}@media(max-width:760px){.form{grid-template-columns:1fr}.names{grid-template-columns:1fr}.play-shell{padding-top:112px}.gameframe{height:calc(100dvh - 112px)}.scorebar{grid-template-columns:repeat(var(--team-count),140px)}}
</style>
</head>
<body>
<section id="setup" class="setup">
<header class="top"><a class="brand" href="play.html"><img src="no-labels-approved-logo.png" alt=""><span><strong>No Labels Games</strong><small id="gameTitle">Team Game</small></span></a><a class="btn" href="play.html">Game Center</a></header>
<div class="hero"><h1>Team Setup</h1><p>Choose from one to eight teams, then use the expanded game normally.</p></div>
<div class="form"><label>Number of Teams<select id="teamCount"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></label><label>Starting Team<select id="starting"><option value="0">Team 1</option><option value="random">Choose Randomly</option></select></label><div id="names" class="names"></div><div class="actions"><button id="begin" class="btn gold">Continue to Game</button></div></div>
</section>
<section id="playShell" class="play-shell hidden"><div id="scorebar" class="scorebar"></div><div class="bar-actions"><button id="previous" class="btn">← Team</button><button id="nextTeam" class="btn">Team →</button><button id="resetScores" class="btn">Reset Scores</button><a class="btn" href="play.html">Exit</a></div><iframe id="gameframe" class="gameframe" title="Bible game"></iframe><div id="awardPanel" class="award-panel hidden"></div></section>
<script>
const params=new URLSearchParams(location.search);
const requested=params.get('game')||'scripture-or-suspicion.html';
const allowed=['scripture-or-suspicion.html','who-am-i.html','finish-the-verse.html','lightning-round.html','memory-match.html','bible-jeopardy.html'];
const gameFile=allowed.includes(requested)?requested:allowed[0];
const titles={'scripture-or-suspicion.html':'Scripture or Suspicion','who-am-i.html':'Who Am I?','finish-the-verse.html':'Finish the Verse','lightning-round.html':'Lightning Round','memory-match.html':'Memory Match','bible-jeopardy.html':'Bible Jeopardy'};
document.getElementById('gameTitle').textContent=titles[gameFile];
const $=id=>document.getElementById(id);let teams=[],active=0,lastFeedback='',childReady=false;
function defaultName(i){return ['Team Grace','Team Truth','Team Faith','Team Hope','Team Mercy','Team Joy','Team Peace','Team Light'][i]||`Team ${i+1}`}
function renderNames(){const count=Number($('teamCount').value);$('names').innerHTML=Array.from({length:count},(_,i)=>`<label>Team ${i+1}<input data-name="${i}" value="${defaultName(i)}"></label>`).join('');$('starting').innerHTML=`<option value="0">Team 1</option><option value="random">Choose Randomly</option>`}
function renderScore(){document.documentElement.style.setProperty('--team-count',String(teams.length));$('scorebar').innerHTML=teams.map((t,i)=>`<div class="team ${i===active?'active':''}"><strong>${escapeHtml(t.name)}</strong><span>${t.score}</span></div>`).join('')}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function move(step=1){active=(active+step+teams.length)%teams.length;renderScore()}
function add(points){teams[active].score+=points;renderScore()}
function begin(){teams=[...document.querySelectorAll('[data-name]')].map((input,i)=>({name:input.value.trim()||defaultName(i),score:0}));active=$('starting').value==='random'?Math.floor(Math.random()*teams.length):0;$('setup').classList.add('hidden');$('playShell').classList.remove('hidden');renderScore();$('gameframe').src=gameFile}
function configureChild(){const frame=$('gameframe');const doc=frame.contentDocument;if(!doc)return;childReady=true;
 const mode=doc.getElementById('mode');if(mode){mode.value='solo';const label=mode.closest('label');if(label)label.style.display='none'}
 const childScores=doc.getElementById('scoreboard');if(childScores)childScores.style.display='none';
 const next=doc.getElementById('next');if(next&&!next.dataset.multiBound){next.dataset.multiBound='1';next.addEventListener('click',()=>{if(gameFile!=='memory-match.html')move(1)},{capture:true})}
 const feedback=doc.getElementById('feedback');if(feedback){const observer=new MutationObserver(()=>handleFeedback(feedback.textContent.trim()));observer.observe(feedback,{childList:true,subtree:true,characterData:true})}
 if(gameFile==='bible-jeopardy.html')setupJeopardy(doc);
}
function handleFeedback(text){if(!text||text===lastFeedback)return;lastFeedback=text;if(gameFile==='memory-match.html'){if(text.startsWith('Match found'))add(100);else if(text.startsWith('No match'))move(1);return}if(text==='Correct!')add(100)}
function setupJeopardy(doc){const childScore=doc.getElementById('scoreboard');if(childScore)childScore.style.display='none';const fields=doc.querySelector('.team-fields');if(fields)fields.style.display='none';const starting=doc.getElementById('starting');if(starting&&starting.closest('label'))starting.closest('label').style.display='none';
 const award1=doc.getElementById('award1'),award2=doc.getElementById('award2'),noAward=doc.getElementById('noAward');[award1,award2].forEach(b=>{if(b)b.style.display='none'});
 if(noAward){const observer=new MutationObserver(()=>{const visible=!noAward.classList.contains('hidden');$('awardPanel').classList.toggle('hidden',!visible);if(visible)renderAwards(doc,noAward)});observer.observe(noAward,{attributes:true,attributeFilter:['class']})}}
function renderAwards(doc,noAward){const meta=doc.getElementById('meta')?.textContent||'';const match=meta.match(/(100|200|300|400|500)/);const value=match?Number(match[1]):100;$('awardPanel').innerHTML=teams.map((t,i)=>`<button data-award="${i}">Award ${escapeHtml(t.name)} +${value}</button>`).join('')+`<button class="none" data-none>No Award</button>`;$('awardPanel').querySelectorAll('[data-award]').forEach(btn=>btn.onclick=()=>{const i=Number(btn.dataset.award);teams[i].score+=value;active=(i+1)%teams.length;renderScore();$('awardPanel').classList.add('hidden');noAward.click()});$('awardPanel').querySelector('[data-none]').onclick=()=>{$('awardPanel').classList.add('hidden');move(1);noAward.click()}}
$('teamCount').onchange=renderNames;$('begin').onclick=begin;$('previous').onclick=()=>move(-1);$('nextTeam').onclick=()=>move(1);$('resetScores').onclick=()=>{if(confirm('Reset all team scores?')){teams.forEach(t=>t.score=0);renderScore()}};$('gameframe').onload=()=>setTimeout(configureChild,150);renderNames();
</script>
</body>
</html>
