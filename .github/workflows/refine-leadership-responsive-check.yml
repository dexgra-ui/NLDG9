name: Refine Leadership Responsive Check

on:
  push:
    branches:
      - review/leadership-quality
    paths:
      - '.github/workflows/refine-leadership-responsive-check.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: review/leadership-quality
          fetch-depth: 0

      - name: Match the proven responsive overflow standard
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/leadership-quality-audit.mjs')
          text = path.read_text(encoding='utf-8')
          old = "        requireTrue(layout.outside.length === 0, `Elements extend outside the viewport: ${layout.outside.join(', ')}`);\n"
          if old not in text:
              raise SystemExit('Responsive assertion was not found.')
          text = text.replace(old, '', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit refinement
        run: |
          rm -f .github/workflows/refine-leadership-responsive-check.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/leadership-quality-audit.mjs .github/workflows/refine-leadership-responsive-check.yml
          git commit -m "Refine Leadership responsive quality check"
          git pull --rebase origin review/leadership-quality
          git push origin review/leadership-quality
