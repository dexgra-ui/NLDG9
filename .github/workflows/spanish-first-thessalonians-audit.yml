name: Spanish 1 Thessalonians Audit

on:
  push:
    paths:
      - 'first-thessalonians-study.html'
      - 'first-thessalonians-study-data.js'
      - 'first-thessalonians-study-guide.js'
      - 'first-thessalonians-study-data-es.js'
      - 'es/primera-tesalonicenses-estudio.html'
      - 'es/estudios-biblicos.html'
      - 'nldg-i18n.js'
      - 'book-study-series.js'
      - 'book-study-series-es.js'
      - 'scripts/spanish-first-thessalonians-audit.mjs'
      - '.github/workflows/spanish-first-thessalonians-audit.yml'
  pull_request:
    paths:
      - 'first-thessalonians-study.html'
      - 'first-thessalonians-study-data.js'
      - 'first-thessalonians-study-guide.js'
      - 'first-thessalonians-study-data-es.js'
      - 'es/primera-tesalonicenses-estudio.html'
      - 'es/estudios-biblicos.html'
      - 'nldg-i18n.js'
      - 'book-study-series.js'
      - 'book-study-series-es.js'
      - 'scripts/spanish-first-thessalonians-audit.mjs'
      - '.github/workflows/spanish-first-thessalonians-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spanish-first-thessalonians:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit Spanish 1 Thessalonians study
        run: node scripts/spanish-first-thessalonians-audit.mjs
