name: Spanish Book-by-Book Library Audit

on:
  push:
    paths:
      - 'es/estudios-biblicos.html'
      - 'es/libro-por-libro.html'
      - 'nldg-i18n.js'
      - 'scripts/spanish-book-by-book-library-audit.mjs'
      - '.github/workflows/spanish-book-by-book-library-audit.yml'
  pull_request:
    paths:
      - 'es/estudios-biblicos.html'
      - 'es/libro-por-libro.html'
      - 'nldg-i18n.js'
      - 'scripts/spanish-book-by-book-library-audit.mjs'
      - '.github/workflows/spanish-book-by-book-library-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify dedicated Spanish book library
        run: node scripts/spanish-book-by-book-library-audit.mjs
