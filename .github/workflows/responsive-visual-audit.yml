name: Responsive Visual Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/responsive-visual-audit.yml'
      - 'scripts/responsive-audit.mjs'

permissions:
  contents: write

jobs:
  visual-audit:
    name: Mobile, tablet, desktop, church display, and print
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/nldg-http.log 2>&1 &
          echo $! > /tmp/nldg-http.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nldg-http.log
          exit 1

      - name: Run responsive audit
        run: node scripts/responsive-audit.mjs

      - name: Upload screenshots, PDFs, and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-visual-audit
          path: responsive-audit-results
          if-no-files-found: error

      - name: Publish Markdown report
        if: always()
        run: |
          if [ ! -f responsive-audit-results/responsive-audit-report.md ]; then
            echo "No responsive report was generated."
            exit 0
          fi
          cp responsive-audit-results/responsive-audit-report.md RESPONSIVE-AUDIT.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RESPONSIVE-AUDIT.md
          if git diff --cached --quiet; then
            echo "Responsive report is unchanged."
            exit 0
          fi
          git commit -m "Publish responsive visual audit report"
          git pull --rebase origin main
          git push
