<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071735"><title>Bible Trivia | No Labels, Designed by God</title><style>:root{--gold:#ffd34e;--text:#f7f9ff;--muted:#cbd5f3;--green:#35c779;--line:rgba(255,255,255,.14)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#1d4c9e 0,#081735 42%,#030713 100%);color:var(--text)}button,select,input{font:inherit}.hidden{display:none!important}.app{max-width:1500px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border:1px solid var(--line);border-radius:18px;background:rgba(5,16,44,.95)}.brand{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none}.brand img{width:52px;height:52px}.brand strong{display:block}.brand small,.notice,.reference{color:var(--muted)}.btn{border:1px solid var(--line);border-radius:12px;padding:11px 15px;font-weight:800;background:#243b78;color:white;text-decoration:none;cursor:pointer}.btn.gold{background:linear-gradient(#fff0a4,var(--gold));color:#2d2400}.btn.green{background:var(--green)}.hero{text-align:center;padding:42px 12px 24px}.hero h1{font-size:clamp(42px,8vw,84px);margin:0}.hero p{color:var(--muted);font-size:1.15rem}.setup{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:20px;border:1px solid var(--line);border-radius:20px;background:rgba(10,25,64,.88)}label{display:grid;gap:7px;font-weight:800;color:var(--muted)}select,input{padding:12px;border-radius:10px;border:1px solid var(--line);background:#071735;color:white}.team-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;grid-column:1/-1}.setup-actions,.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.setup-actions,.notice{grid-column:1/-1}.notice{text-align:center;font-weight:800;min-height:24px}.scoreboard{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0}.team{padding:12px;border:1px solid var(--line);border-radius:14px;background:#0b1d4d;text-align:center}.team.active{outline:3px solid var(--gold)}.team strong{display:block}.team span{font-size:2rem;color:var(--gold);font-weight:900}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.cell{min-height:88px;border:2px solid rgba(255,255,255,.1);border-radius:12px;background:linear-gradient(#174dd4,#0d2e91);color:var(--gold);font-size:clamp(20px,2.4vw,32px);font-weight:900;text-shadow:0 3px 8px #000;cursor:pointer}.cell.header{background:linear-gradient(#151c4f,#070d28);color:white;font-size:clamp(13px,1.7vw,20px);cursor:default}.cell.used{background:#111833;color:#5f6b8e}.overlay{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 18%,rgba(52,103,225,.75),transparent 38%),linear-gradient(#081b48,#030a1f)}.card{width:min(1100px,96vw);min-height:min(650px,90vh);display:flex;flex-direction:column;justify-content:center;gap:20px;border:3px solid rgba(255,211,78,.45);border-radius:28px;padding:clamp(24px,5vw,58px);background:linear-gradient(#091c49,#030a1d)}.meta{text-align:center;color:var(--gold);font-size:clamp(22px,3vw,40px);font-weight:900}.question{text-align:center;font-size:clamp(38px,5.5vw,76px);font-weight:900;line-height:1.08}.answer{text-align:center;color:var(--gold);font-size:clamp(34px,4.8vw,64px);font-weight:900;padding:18px;border-radius:16px;background:#111f45}.reference{text-align:center;font-weight:800}.complete{text-align:center;padding:50px 20px}.complete h2{font-size:clamp(38px,6vw,68px)}@media(max-width:900px){.setup{grid-template-columns:1fr 1fr}}@media(max-width:760px){.setup{grid-template-columns:1fr}.team-fields{grid-template-columns:1fr}.board{gap:5px}.cell{min-height:68px;font-size:17px}.cell.header{font-size:11px}}</style></head><body><div class="app"><header class="top"><a class="brand" href="play.html"><img src="no-labels-approved-logo.png" alt=""><span><strong>No Labels Games</strong><small>Bible Trivia</small></span></a><div><a class="btn" href="play.html">Game Center</a> <button id="fullscreen" class="btn" type="button">Fullscreen</button></div></header><section id="setupView"><div class="hero"><h1>Bible Trivia</h1><p>Choose a category, reveal the answer, and award the points.</p></div><div class="setup"><label>Game pack<select id="pack"><option value="all">All Active Packs</option></select></label><label>Audience<select id="group"><option value="kids">Kids</option><option value="teens">Teens</option><option value="adults">Adults</option><option value="family" selected>Family</option><option value="mixed">Mixed</option></select></label><label>Difficulty<select id="difficulty"><option value="mixed" selected>Mixed</option><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select></label><label>Starting Team<select id="starting"><option value="0">Team Grace</option><option value="1">Team Truth</option><option value="random">Choose Randomly</option></select></label><div class="team-fields"><label>Team 1<input id="team1" value="Team Grace"></label><label>Team 2<input id="team2" value="Team Truth"></label></div><p id="notice" class="notice" aria-live="polite"></p><div class="setup-actions"><button id="start" class="btn gold" type="button">Start Board</button><button id="resetHistory" class="btn" type="button">Reset Clue History</button></div></div></section><section id="gameView" class="hidden"><div id="scoreboard" class="scoreboard"><div class="team active"><strong>Team Grace</strong><span>0</span></div><div class="team"><strong>Team Truth</strong><span>0</span></div></div><div class="actions" style="margin-bottom:12px"><button id="newBoard" class="btn" type="button">New Board</button><button id="endGame" class="btn gold" type="button">End Game</button></div><div id="board" class="board"></div></section><section id="completeView" class="complete hidden"><h2>Game Complete!</h2><p id="summary"></p><div><button id="again" class="btn gold" type="button">Play Again</button> <a class="btn" href="play.html">Return to Game Center</a></div></section></div><div id="overlay" class="overlay hidden"><div class="card"><div id="meta" class="meta"></div><div id="question" class="question"></div><div id="answer" class="answer hidden"></div><div id="reference" class="reference"></div><div class="actions"><button id="reveal" class="btn gold" type="button">Reveal Answer</button><button id="award1" class="btn green hidden" type="button"></button><button id="award2" class="btn green hidden" type="button"></button><button id="noAward" class="btn hidden" type="button">No Award</button></div></div></div><script src="game-packs/game-pack-engine.js?v=1.0.0"></script><script src="game-packs/index.js?v=1.1.0"></script><script>
const $=id=>document.getElementById(id);const FALLBACK=[['People','Who built the ark?','Who is Noah?','Genesis 6:14'],['Places','This city’s walls fell after Israel marched around it.','What is Jericho?','Joshua 6'],['Books','This book opens with creation.','What is Genesis?','Genesis 1:1'],['Teachings','Jesus called this the greatest commandment.','What is loving God?','Matthew 22:37-38'],['Events','The Holy Spirit came upon believers during this feast.','What is Pentecost?','Acts 2']];let scores=[0,0],active=0,current=null,names=['Team Grace','Team Truth'],boardItems=[];
function selectedPacks(){return $('pack').value==='all'?undefined:[$('pack').value]}
function gameQuestions(){return window.NLDG_GAME_PACKS?.questions({packs:selectedPacks(),game:'jeopardy',audience:$('group').value,difficulty:$('difficulty').value})||[]}
function loadPacks(){const packs=window.NLDG_GAME_PACKS?.list().filter(pack=>pack.games.includes('jeopardy'))||[];$('pack').innerHTML='<option value="all">All Active Packs</option>'+packs.map(pack=>`<option value="${pack.id}">${pack.name} · ${pack.count}</option>`).join('');updateNotice()}
function updateNotice(){const count=gameQuestions().length;$('notice').textContent=count?`${count} matching clues available. The board favors unused and less-played clues.`:'No matching pack clues yet. A small fallback board will be used.'}
function normalizeCategory(value){const c=String(value||'General Bible');if(/genesis|exodus|joshua|judges|ruth|samuel|kings|history|esther|prophets|wisdom|psalm/i.test(c))return 'Old Testament';if(/gospel|jesus|parable/i.test(c))return 'Jesus & Gospels';if(/acts|paul|church/i.test(c))return 'Acts & Church';if(/letter|epistle|theology|faith|christian|teaching/i.test(c))return 'Faith & Teaching';return 'Bible People & Events'}
function makeBoard(){const engine=window.NLDG_GAME_PACKS;let pool=engine?.select({packs:selectedPacks(),game:'jeopardy',audience:$('group').value,difficulty:$('difficulty').value},100)||[];if(pool.length<25){pool=[...pool,...FALLBACK.map((x,i)=>({id:`fallback-${i}`,packId:'fallback',category:x[0],prompt:x[1],answer:x[2],scripture:x[3]}))]}const groups=new Map();pool.forEach(item=>{const cat=normalizeCategory(item.category);if(!groups.has(cat))groups.set(cat,[]);groups.get(cat).push(item)});const chosen=[...groups.entries()].sort((a,b)=>b[1].length-a[1].length).slice(0,5);while(chosen.length<5)chosen.push([`Category ${chosen.length+1}`,pool]);boardItems=[];chosen.forEach(([category,items])=>{const unique=items.filter((item,index,array)=>array.findIndex(other=>other.id===item.id&&other.packId===item.packId)===index);for(let row=0;row<5;row++){const item=unique[row]||pool[(row+boardItems.length)%pool.length];boardItems.push({...item,boardCategory:category,value:(row+1)*100})}});renderBoard(chosen.map(entry=>entry[0]))}
function renderBoard(categories){const board=$('board');board.innerHTML='';categories.forEach(category=>{const header=document.createElement('div');header.className='cell header';header.textContent=category;board.appendChild(header)});for(let row=0;row<5;row++)categories.forEach((category,col)=>{const index=col*5+row,item=boardItems[index],button=document.createElement('button');button.className='cell';button.textContent=`$${item.value}`;button.onclick=()=>openClue(item,button);board.appendChild(button)})}
function start(){names=[$('team1').value.trim()||'Team Grace',$('team2').value.trim()||'Team Truth'];active=$('starting').value==='random'?Math.floor(Math.random()*2):Number($('starting').value);scores=[0,0];$('setupView').classList.add('hidden');$('completeView').classList.add('hidden');$('gameView').classList.remove('hidden');renderScore();makeBoard()}
function renderScore(){document.querySelectorAll('.team').forEach((card,i)=>{card.classList.toggle('active',i===active);card.querySelector('strong').textContent=names[i];card.querySelector('span').textContent=scores[i]})}
function openClue(item,button){if(button.classList.contains('used'))return;button.classList.add('used');button.disabled=true;current=item;$('meta').textContent=`${item.boardCategory} · $${item.value}`;$('question').textContent=item.prompt;$('answer').textContent=item.answer;$('answer').classList.add('hidden');$('reference').textContent='';$('reveal').classList.remove('hidden');['award1','award2','noAward'].forEach(id=>$(id).classList.add('hidden'));$('overlay').classList.remove('hidden')}
function reveal(){window.NLDG_GAME_PACKS?.record(current);$('answer').classList.remove('hidden');$('reference').textContent=current.scripture?`Reference: ${current.scripture}`:'';$('reveal').classList.add('hidden');$('award1').textContent=`Award ${names[0]}`;$('award2').textContent=`Award ${names[1]}`;['award1','award2','noAward'].forEach(id=>$(id).classList.remove('hidden'))}
function closeClue(team){if(team!==null){scores[team]+=current.value;active=team}else active=(active+1)%2;renderScore();$('overlay').classList.add('hidden');if(document.querySelectorAll('.cell:not(.header):not(.used)').length===0)finish()}
function finish(){$('overlay').classList.add('hidden');$('gameView').classList.add('hidden');$('completeView').classList.remove('hidden');$('summary').textContent=`${names[0]}: ${scores[0]} points. ${names[1]}: ${scores[1]} points.`}
function resetToSetup(){$('gameView').classList.add('hidden');$('completeView').classList.add('hidden');$('setupView').classList.remove('hidden');updateNotice()}
[$('pack'),$('group'),$('difficulty')].forEach(control=>control.addEventListener('change',updateNotice));$('start').onclick=start;$('newBoard').onclick=makeBoard;$('endGame').onclick=finish;$('again').onclick=resetToSetup;$('reveal').onclick=reveal;$('award1').onclick=()=>closeClue(0);$('award2').onclick=()=>closeClue(1);$('noAward').onclick=()=>closeClue(null);$('resetHistory').onclick=()=>{if($('pack').value==='all')window.NLDG_GAME_PACKS?.resetHistory();else window.NLDG_GAME_PACKS?.resetHistory($('pack').value);$('notice').textContent='Clue history cleared for the selected pack setting.'};$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{$('notice').textContent='Use your browser fullscreen option or Add to Home Screen on iPad.'}};loadPacks();
</script></body></html>
