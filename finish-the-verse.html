function shuffle(items){const copy=[...items];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
function historyKey(group){return `nldg-finish-recent-${group}`}
function chooseRound(group,count){const bank=BANK[group];let recent=[];try{recent=JSON.parse(localStorage.getItem(historyKey(group))||'[]')}catch{}const unseen=bank.filter(item=>!recent.includes(item[0]+'|'+item[1]));const source=unseen.length>=count?unseen:bank;const selected=shuffle(source).slice(0,Math.min(count,source.length));const keys=selected.map(item=>item[0]+'|'+item[1]);localStorage.setItem(historyKey(group),JSON.stringify([...keys,...recent].slice(0,Math.max(5,bank.length-5))));return selected}
