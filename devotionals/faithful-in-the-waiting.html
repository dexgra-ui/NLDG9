can use the waiting to prepare us for what comes next.","mainEntityOfPage":"https://nolabelsdesignedbygod.org/devotionals/faithful-in-the-waiting.html","datePublished":"2026-10-12","dateModified":"2026-10-12","author":{"@type":"Person","name":"Dexter Graham"},"publisher":{"@type":"Organization","name":"No Labels, Designed by God"},"articleSection":"Waiting and Trust","about":"Psalm 27:13–14"}</script><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../devotionals-v2.css"></head><body><header class="site-header"><a class="brand" href="../index.html"><span class="brand-icon brand-logo"><img src="../no-labels-approved-logo.png" alt=""></span><span><strong>No Labels, Designed by God</strong><small>Devotional Center</small></span></a><button class="menu" aria-expanded="false">Menu</button><nav><a href="../index.html">Home</a><a href="../studies.html">Bible Studies</a><a class="active" href="../devotionals.html">Devotionals</a><a href="../articles.html">Articles</a><a href="../resource-center.html">Resources</a></nav></header><main class="reader-shell"></main><footer class="ministry-footer"><small>© <span data-year>2026</span> No Labels Designed by God, LLC.</small></footer><script src="../devotional-data.js?v=1.2.0"></script><script>if(!window.NLDG_DEVOTIONALS?.some(item=>item.id==='faithful-in-the-waiting'))window.NLDG_DEVOTIONALS.unshift({"id":"faithful-in-the-waiting","theme":"Waiting and Trust","title":"Faithful in the Waiting","reference":"Psalm 27:13–14","minutes":"6-minute devotional","summary":"Waiting on God is not wasted time. Even when nothing seems to be happening, God can use the waiting to prepare us for what comes next.","scriptureFocus":"“Wait for the LORD; be strong and take heart and wait for the LORD.” Psalm 27:14 (NIV)","reflection":["I don't particularly enjoy waiting.","Most of us don't.","We live in a world where we can track a package from the warehouse to our front door, get answers to questions in seconds, and send a message across the world instantly.","Then we pray.","And God doesn't always answer according to our timetable.","We ask for direction, and nothing seems to happen.","We pray for circumstances to change, and they remain the same.","We ask God to open a door, and we find ourselves standing in the hallway.","Waiting can make us wonder whether God heard us.","But Scripture repeatedly shows us people who had to wait.","Abraham waited for the promised son.","Joseph waited through slavery and prison.","Israel waited for deliverance.","David was anointed king long before he actually sat on the throne.","The disciples waited for the Holy Spirit.","Waiting appears again and again in the story of God's people.","Maybe that's because God does some important work while we wait.","We usually focus on what we're waiting for.","God may also be concerned with what He is developing in us while we wait.","Patience.","Character.","Wisdom.","Humility.","Dependence.","Faith.","Sometimes receiving something immediately would give us what we wanted without preparing us to carry it.","Waiting can prepare us.","But waiting on God does not mean doing nothing.","David says, “Be strong and take heart.”","There is still something for us to do while we wait.","We can pray.","We can serve.","We can learn.","We can love people.","We can fulfill today's responsibilities.","We can prepare for the opportunity we're asking God to provide.","We can become faithful where we already are instead of believing faithfulness begins somewhere else.","That last one is important.","Sometimes we become so focused on the next thing that we neglect the thing God has placed in front of us today.","We tell ourselves:","“When this situation changes, then I'll…”","“When God opens that door, then I'll…”","“When life settles down, then I'll…”","But today matters too.","There are people to love today.","There are responsibilities to handle today.","There is Scripture to learn today.","There are opportunities to serve today.","There is a relationship with Jesus to cultivate today.","Your waiting room can still become a place of worship.","I don't know what you're waiting for.","Maybe it's an answer.","A relationship.","Healing.","An opportunity.","Direction.","Reconciliation.","A change you desperately need.","Keep praying.","But while you wait for God to change the situation, allow Him to work in you too.","One day the waiting will end.","When it does, may God find us faithful."],"questions":["What are you currently waiting on God for?","Has waiting caused you to question God's faithfulness?","Are you neglecting something God has given you today because you are focused on tomorrow?","What might God be developing in you during this season?"],"action":["Write down what you are waiting for and surrender the timing to God.","Identify one responsibility you can faithfully handle today.","Instead of asking only, “God, when will this change?” ask, “God, what are You teaching me while I wait?”","Encourage someone else who is experiencing a season of waiting."],"prayer":"Father, waiting is difficult when I cannot see what You are doing. Help me trust Your timing as much as I trust Your promises. Keep me from becoming so focused on tomorrow that I miss what You have placed before me today. Develop patience, wisdom, character, and faith within me. Give me strength to remain faithful while I wait and confidence that You are working even when I cannot see it. In Jesus' name, Amen."});</script><script src="../seo.js?v=1.0.0"></script><script src="../devotional-reader.js?v=1.2.0"></script><script>const menu=document.querySelector('.menu');menu?.addEventListener('click',()=>{const open=document.body.classList.toggle('nav-open');menu.setAttribute('aria-expanded',String(open));menu.textContent=open?'Close':'Menu'});document.querySelectorAll('[data-year]').forEach(el=>el.textContent=new Date().getFullYear());</script></body></html>
