permissions:
  contents: read

jobs:
  spanish-study-library:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit Spanish study library
        run: node scripts/spanish-study-library-audit.mjs
