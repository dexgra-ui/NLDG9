name: Apply Bilingual Access Hooks

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-bilingual-hooks.mjs'
      - '.github/workflows/apply-bilingual-hooks.yml'

permissions:
  contents: write

jobs:
  apply-hooks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add bilingual access hooks
        run: node scripts/apply-bilingual-hooks.mjs
      - name: Validate patch
        run: git diff --check
      - name: Commit updated pages
        run: |
          if git diff --quiet; then
            echo "No page updates needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "Add bilingual access to standalone pages"
          git push
