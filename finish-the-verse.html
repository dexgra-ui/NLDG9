const BANK={preschool:CORE.slice(0,20),kids:CORE.slice(20,40),teens:CORE.slice(40,60),adults:CORE.slice(60,80),family:CORE.slice(80,100)};const $=id=>document.getElementById(id);let round=[],index=0,answered=false,activeTeam=0,scores=[0,0],soloCorrect=0;function shuffle(items){return [...items].sort(()=>Math.random()-.5)}function historyKey(group){return `nldg-finish-recent-${group}`}function chooseRound(group,count){const bank=BANK[group];let recent=[];try{recent=JSON.parse(localStorage.getItem(historyKey(group))||'[]')}catch{}const unseen=bank.filter(item=>!recent.includes(item[1]));const source=unseen.length>=count?unseen:bank;const selected=shuffle(source).slice(0,Math.min(count,source.length));const nextRecent=[...selected.map(item=>item[1]),...recent].slice(0,Math.min(bank.length-4,30));localStorage.setItem(historyKey(group),JSON.stringify(nextRecent));return selected}function updateBankCount(){$('bankCount').textContent=`${BANK[$('group').value].length} questions available`}function start(){round=chooseRound($('group').value,Number($('length').value));index=0;answered=false;activeTeam=0;scores=[0,0];soloCorrect=0;$('setupView').classList.add('hidden');$('completeView').classList.add('hidden');$('gameView').classList.remove('hidden');$('scoreboard').classList.toggle('hidden',$('mode').value==='solo');renderScore();render()}function render(){if(index>=round.length){finish();return}answered=false;const [ref,question,,choices]=round[index];$('reference').textContent=ref;$('question').textContent=question;$('counter').textContent=`${index+1} of ${round.length}`;$('bar').style.width=`${index/round.length*100}%`;$('feedback').textContent='';$('next').classList.add('hidden');$('answers').innerHTML='';shuffle(choices).forEach(choice=>{const button=document.createElement('button');button.className='answer';button.textContent=choice;button.onclick=()=>answer(choice,button);$('answers').appendChild(button)})}function answer(choice,button){if(answered)return;answered=true
