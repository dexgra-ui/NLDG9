name: Spanish Luke Audit
on:
  push:
    paths: ['luke-study.html','luke-study-data.js','luke-study-guide.js','luke-study-data-es.js','es/lucas-estudio.html','es/estudios-biblicos.html','nldg-i18n.js','book-study-series.js','book-study-series-es.js','scripts/spanish-luke-audit.mjs','scripts/spanish-john-audit.mjs','.github/workflows/spanish-luke-audit.yml']
  pull_request:
    paths: ['luke-study.html','luke-study-data.js','luke-study-guide.js','luke-study-data-es.js','es/lucas-estudio.html','es/estudios-biblicos.html','nldg-i18n.js','book-study-series.js','book-study-series-es.js','scripts/spanish-luke-audit.mjs','scripts/spanish-john-audit.mjs','.github/workflows/spanish-luke-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spanish-luke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/spanish-luke-audit.mjs
