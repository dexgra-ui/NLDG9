<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Completing My Journey Sign-In</title>
<style>body{background:#08182f;color:#fff;font:1rem/1.6 system-ui,sans-serif;margin:0}main{max-width:34rem;margin:10vh auto;padding:2rem;background:#142746;border-radius:1rem}a{color:#f2d389}</style></head><body>
<main><h1>Completing your sign-in</h1><p id="status" role="status" aria-live="polite">Checking your secure sign-in link…</p><p><a href="dashboard.html">Return to My Journey</a></p></main>
<script type="module">
import {journeyClient} from './journey-supabase-client.mjs';
const status=document.getElementById('status');
(async()=>{
try{
 const params=new URLSearchParams(location.search);
 if(params.has('error'))throw new Error('Authentication link rejected');
 if(params.has('code')){
  const {error}=await journeyClient.auth.exchangeCodeForSession(params.get('code'));
  if(error)throw error;
 }
 const {data,error}=await journeyClient.auth.getUser();
 if(error||!data?.user)throw new Error('No authenticated user');
 history.replaceState(null,'',location.pathname);
 status.textContent='Signed in successfully. Returning to My Journey…';
 location.replace('dashboard.html');
}catch{
 history.replaceState(null,'',location.pathname);
 status.textContent='This sign-in link could not be completed. Please return to My Journey and request a new link.';
}
})();
</script></body></html>
