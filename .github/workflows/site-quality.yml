name: Site Quality Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Internal links and content state
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run site audit
        run: node scripts/audit-site.mjs

      - name: Run Scripture link audit
        run: node scripts/scripture-link-audit.mjs

      - name: Run Book-by-Book presentation audit
        run: node scripts/book-study-presentation-audit.mjs

      - name: Run My Journey Book-by-Book progress audit
        run: node scripts/book-progress-dashboard-audit.mjs

      - name: Run Book-by-Book unified library audit
        run: node scripts/unified-library-book-audit.mjs

      - name: Run Book-by-Book global search audit
        run: node scripts/global-book-search-audit.mjs

      - name: Run Book-by-Book study explorer audit
        run: node scripts/study-explorer-book-audit.mjs

      - name: Run workflow hygiene audit
        run: node scripts/workflow-hygiene-audit.mjs

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-audit-report
          path: site-audit-report.md
          if-no-files-found: error