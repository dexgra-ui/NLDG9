name: Growing with Jesus Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'growing-with-jesus.html'
      - 'growing-with-jesus-god-made-me-on-purpose.html'
      - 'growing-with-jesus.css'
      - 'styles.css'
      - 'script.js'
      - 'site-navigation.js'
      - 'scripts/growing-with-jesus-audit.mjs'
      - '.github/workflows/growing-with-jesus-audit.yml'
  push:
    branches: [main]
    paths:
      - 'growing-with-jesus.html'
      - 'growing-with-jesus-god-made-me-on-purpose.html'
      - 'growing-with-jesus.css'
      - 'styles.css'
      - 'script.js'
      - 'site-navigation.js'
      - 'scripts/growing-with-jesus-audit.mjs'
      - '.github/workflows/growing-with-jesus-audit.yml'

permissions:
  contents: read

jobs:
  children-study:
    name: Child-safe content, responsive layout, and accessibility
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install audit tools
        run: |
          npm install --no-save playwright axe-core
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/nldg-http.log 2>&1 &
          echo $! > /tmp/nldg-http.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/growing-with-jesus.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nldg-http.log
          exit 1

      - name: Run Growing with Jesus audit
        run: node scripts/growing-with-jesus-audit.mjs

      - name: Upload audit report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: growing-with-jesus-audit
          path: growing-with-jesus-audit-results
          if-no-files-found: error
