intro" class="study-body"></p></section><nav class="controls" aria-label="Study navigation"><label for="part-select"><strong>Choose a study part</strong></label><select id="part-select"></select><button id="copy-link" type="button">Copy part link</button><span role="status" aria-live="polite" id="copy-status"></span></nav><article id="study-part" class="study-panel"><h2 id="part-title"></h2><div id="part-content" class="study-body"></div></article><nav class="controls" id="prev-next" aria-label="Previous and next parts"></nav><section><h2>All nine parts</h2><ol id="part-index"></ol></section><section class="study-panel"><h2>Life application, key truths, challenge and prayer</h2><div id="closing" class="study-body"></div></section><p><a href="studies.html">← Back to Bible Studies</a></p></main><script src="church-hurt-study-data.js?v=2"></script><script>(()=>{const data=window.NLDG_CHURCH_HURT_STUDY;const parts=data.parts;const requested=Number(new URLSearchParams(location.search).get('part')||1);const n=Number.isInteger(requested)&&requested>=1&&requested<=9?requested:1;const current=parts[n-1];const link=x=>'church-hurt.html?part='+x;const scripturePattern=/\\b(?:[1-3]\\s+)?(?:Genesis|Exodus|Leviticus|Numbers|Deuteronomy|Joshua|Judges|Ruth|Samuel|Kings|Chronicles|Ezra|Nehemiah|Esther|Job|Psalms?|Proverbs|Ecclesiastes|Song of Songs|Isaiah|Jeremiah|Lamentations|Ezekiel|Daniel|Hosea|Joel|Amos|Obadiah|Jonah|Micah|Nahum|Habakkuk|Zephaniah|Haggai|Zechariah|Malachi|Matthew|Mark|Luke|John|Acts|Romans|Corinthians|Galatians|Ephesians|Philippians|Colossians|Thessalonians|Timothy|Titus|Philemon|Hebrews|James|Peter|Jude|Revelation)\\s+\\d+(?::\\d+(?:[–-]\\d+)?)?(?:[–-]\\d+)?/g;const appendWithReferences=(node,line)=>{let cursor=0;for(const match of line.matchAll(scripturePattern)){node.append(document.createTextNode(line.slice(cursor,match.index)));const strong=document.createElement('strong');strong.className='scripture-ref';strong.textContent=match[0];node.append(strong);cursor=match.index+match[0].length}node.append(document.createTextNode(line.slice(cursor)))};const renderStudy=(target,value)=>{const el=document.getElementById(target);el.replaceChildren();const headings=new Set(['MAIN QUESTION','MAIN IDEA','KEY SCRIPTURES','SCRIPTURE-FIRST PRINCIPLE','WHY THIS WOUND CAN REACH SO DEEPLY','POWER UNDER THE JUDGMENT OF SCRIPTURE',"WHEN GOD'S NAME BECOMES ENTANGLED WITH THE WOUND",'REPENTANCE, RECONCILIATION, AND TRUST',"WHEN BOUNDARIES ARE CALLED 'UNFORGIVENESS'",'JUSTICE IS NOT THE OPPOSITE OF GRACE','WHEN PEOPLE LEAVE THE CHURCH BUT STILL LONG FOR JESUS','SIGNS OF SPIRITUAL MANIPULATION','A WORD TO THE CHURCH','A WORD TO THE WOUNDED','DEEPER SCRIPTURE STUDY','DISCUSS MORE DEEPLY','PRACTICE','SCENARIO','SAFETY AND PRACTICE','KEY TRUTH','IMPORTANT DISTINCTION','PAUSE','DISCUSS','REFLECTION','LIFE APPLICATION','KEY TRUTHS','WEEKLY CHALLENGE','PRAYER FOCUS','IF YOU HAVE BEEN HURT','IF YOU ARE A CHURCH LEADER','IF YOU ARE WALKING WITH SOMEONE WHO HAS BEEN HURT']);value.split(/\n\n|\n/).map(s=>s.trim()).filter(Boolean).forEach(line=>{const upper=line.toUpperCase();const isHeading=headings.has(upper);const isBullet=/^[•*-]\s/.test(line);const node=document.createElement(isHeading?'h3':'p');if(isHeading){node.className='study-heading'+(upper==='DEEPER SCRIPTURE STUDY'||upper==='KEY SCRIPTURES'?' study-heading--scripture':upper==='DISCUSS'||upper==='DISCUSS MORE DEEPLY'?' study-heading--discussion':'');node.textContent=line}else if(isBullet){node.className='study-question';node.textContent=line.replace(/^[•*-]\s/,'')}else{appendWithReferences(node,line);if(/^(Read |Church hurt can|Leaving a particular)/.test(line))node.className='study-opening';if(/^Read\\s+(?:[1-3]\\s+)?[A-Z]/.test(line))node.className+=' scripture-line';if(/^No Labels, Designed by God/.test(line))node.className='study-brand'}el.append(node)})};renderStudy('intro',data.intro);document.getElementById('part-title').textContent='Part '+n+': '+current.title;renderStudy('part-content',current.text);renderStudy('closing',data.closing);document.title=current.title+' | Church Hurt | NLDG';const select=document.getElementById('part-select');parts.forEach(p=>{const o=document.createElement('option');o.value=p.number;o.textContent=p.number+'. '+p.title;select.append(o)});select.value=String(n);select.addEventListener('change',()=>location.assign(link(select.value)));const nav=document.getElementById('prev-next');const addNav=(num,label)=>{const a=document.createElement('a');a.className='button-link';a.href=link(num);a.textContent=label;nav.append(a)};if(n>1)addNav(n-1,'← Previous part');if(n<9)addNav(n+1,'Next part →');const list=document.getElementById('part-index');parts.forEach(p=>{const li=document.createElement('li');const a=document.createElement('a');a.href=link(p.number);a.textContent=p.number+'. '+p.title;if(p.number===n)a.setAttribute('aria-current','page');li.append(a);list.append(li)});document.getElementById('copy-link').addEventListener('click',async()=>{const url=new URL(link(n),location.href).href;try{await navigator.clipboard.writeText(url);document.getElementById('copy-status').textContent='Link copied'}catch{window.prompt('Copy this part link',url)}})})();</script><script src="script.js"></script></body></html>
