name: Church Presentation Mode Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'play.html'
      - 'games.html'
      - 'games-presentation.html'
      - 'sw.js'
      - 'scripts/presentation-note-audit.mjs'
      - '.github/workflows/presentation-note-audit.yml'
  push:
    branches: [main]
    paths:
      - 'play.html'
      - 'games.html'
      - 'games-presentation.html'
      - 'sw.js'
      - 'scripts/presentation-note-audit.mjs'
      - '.github/workflows/presentation-note-audit.yml'

jobs:
  presentation-mode:
    name: iPad layout and nonblocking presentation notice
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser test tools
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/nldg-http.log 2>&1 &
          echo $! > /tmp/nldg-http.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/games-presentation.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nldg-http.log
          exit 1

      - name: Run Church Presentation Mode audit
        run: node scripts/presentation-note-audit.mjs

      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: presentation-note-audit
          path: presentation-note-audit-results
          if-no-files-found: error
