name: Study Print Coverage Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'study-experience.js'
      - 'study-print-coverage.js'
      - 'study-print-coverage.css'
      - 'print-center.js'
      - 'print-center.css'
      - 'print-center-print-safe.css'
      - 'current-events-series.html'
      - 'es/es-framework.js'
      - 'walking-with-jesus-study.js'
      - 'preparing-walk.js'
      - 'cross-empty-tomb.js'
      - 'growing-with-jesus-*.html'
      - 'following-jesus-for-yourself-*.html'
      - 'scripts/study-print-coverage-audit.mjs'
      - '.github/workflows/study-print-coverage-audit.yml'
  push:
    branches: [main]
    paths:
      - 'study-experience.js'
      - 'study-print-coverage.js'
      - 'study-print-coverage.css'
      - 'print-center.js'
      - 'print-center.css'
      - 'print-center-print-safe.css'
      - 'current-events-series.html'
      - 'es/es-framework.js'
      - 'walking-with-jesus-study.js'
      - 'preparing-walk.js'
      - 'cross-empty-tomb.js'
      - 'growing-with-jesus-*.html'
      - 'following-jesus-for-yourself-*.html'
      - 'scripts/study-print-coverage-audit.mjs'
      - '.github/workflows/study-print-coverage-audit.yml'

permissions:
  contents: read

jobs:
  study-print-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/nldg-http.log 2>&1 &
          echo $! > /tmp/nldg-http.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nldg-http.log
          exit 1

      - name: Run study print coverage audit
        run: node scripts/study-print-coverage-audit.mjs
