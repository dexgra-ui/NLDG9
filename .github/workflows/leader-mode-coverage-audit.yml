name: Leader Mode Coverage Audit

on:
  pull_request:
    paths:
      - '**/*.html'
      - 'content-library.js'
      - 'leader-guide-data.js'
      - 'universal-leader-mode.js'
      - 'contact-links.js'
      - 'scripts/leader-mode-coverage-audit.mjs'
      - '.github/workflows/leader-mode-coverage-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit published lesson coverage
        run: node scripts/leader-mode-coverage-audit.mjs
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leader-mode-coverage
          path: LEADER-MODE-COVERAGE.md
