name: Repair Audit Failures

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-audit-failures.yml'

permissions:
  contents: write

jobs:
  repair:
    name: Correct audit configuration and presentation accessibility
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path_name, old, new, label):
              path = Path(path_name)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{label} was not found in {path_name}.')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace(
              'scripts/audit-site.mjs',
              "const EXCLUDED_FILES = new Set(['build-v0.9.0.html', 'builder.js', 'study-template.html', 'site-audit-report.md']);",
              "const EXCLUDED_FILES = new Set(['build-v0.9.0.html', 'builder.js', 'study-template.html', 'site-audit-report.md', 'scripts/accessibility-audit.mjs', 'scripts/responsive-audit.mjs', 'scripts/interactive-audit.mjs']);",
              'Audit tooling exclusion list'
          )

          replace('games.html', '--green:#35c779;', '--green:#237a4b;', 'Accessible success color')
          replace('games.html', '<h3 class="section-title">Church Tournament Setup</h3>', '<h2 class="section-title">Church Tournament Setup</h2>', 'Tournament heading')
          replace('games.html', '<div class="team-editor-heading"><h4>Team Names</h4>', '<div class="team-editor-heading"><h3>Team Names</h3>', 'Team Names heading')
          replace('games.html', '<div class="scoreboard-preview-wrap"><h4>Scoreboard Preview</h4>', '<div class="scoreboard-preview-wrap"><h3>Scoreboard Preview</h3>', 'Scoreboard Preview heading')

          accessibility = Path('scripts/accessibility-audit.mjs')
          text = accessibility.read_text(encoding='utf-8')
          anchor = "  { name: 'marriage-family-study', url: 'marriage-family-study.html?study=1' },\n"
          addition = anchor + "  { name: 'difficult-questions', url: 'difficult-questions.html' },\n  { name: 'difficult-questions-study', url: 'difficult-questions-study.html?study=1' },\n"
          if "name: 'difficult-questions'" not in text:
              if anchor not in text:
                  raise SystemExit('Accessibility page-list anchor was not found.')
              text = text.replace(anchor, addition, 1)
          accessibility.write_text(text, encoding='utf-8')

          responsive = Path('scripts/responsive-audit.mjs')
          text = responsive.read_text(encoding='utf-8')
          anchor = "  { name: 'marriage-family-study', url: 'marriage-family-study.html?study=1' },\n"
          addition = anchor + "  { name: 'difficult-questions', url: 'difficult-questions.html' },\n  { name: 'difficult-questions-study', url: 'difficult-questions-study.html?study=1' },\n"
          if "name: 'difficult-questions'" not in text:
              if anchor not in text:
                  raise SystemExit('Responsive page-list anchor was not found.')
              text = text.replace(anchor, addition, 1)
          print_anchor = "  { name: 'marriage-family-study', url: 'marriage-family-study.html?study=1' },\n"
          print_addition = print_anchor + "  { name: 'difficult-questions-study', url: 'difficult-questions-study.html?study=1' },\n"
          print_section = text.split('const printPages = [', 1)
          if len(print_section) == 2 and "difficult-questions-study.html?study=1" not in print_section[1].split('];', 1)[0]:
              before, after = print_section
              if print_anchor not in after:
                  raise SystemExit('Responsive print-list anchor was not found.')
              after = after.replace(print_anchor, print_addition, 1)
              text = before + 'const printPages = [' + after
          responsive.write_text(text, encoding='utf-8')

          sw = Path('sw.js')
          text = sw.read_text(encoding='utf-8')
          text = text.replace("const CACHE='nldg-v8-1-0-site-audit-fixes';", "const CACHE='nldg-v8-2-0-difficult-questions';", 1)
          marker = "'marriage-family.css?v=1.0.0'"
          additions = ",'difficult-questions.html','difficult-questions-study.html','difficult-questions-data.js?v=1.0.0','difficult-questions-study.js?v=1.0.0','difficult-questions-library.js?v=1.0.0','difficult-questions.css?v=1.0.0'"
          if "'difficult-questions.html'" not in text:
              if marker not in text:
                  raise SystemExit('Service-worker insertion point was not found.')
              text = text.replace(marker, marker + additions, 1)
          sw.write_text(text, encoding='utf-8')

          script = Path('script.js')
          text = script.read_text(encoding='utf-8')
          text = text.replace("navigator.serviceWorker.register('sw.js?v=6.1.0')", "navigator.serviceWorker.register('sw.js?v=6.2.0')", 1)
          script.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/extend-interactive-audit.yml
          rm -f .github/workflows/repair-audit-failures.yml

      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair site audits and presentation accessibility"
          git pull --rebase origin main
          git push
