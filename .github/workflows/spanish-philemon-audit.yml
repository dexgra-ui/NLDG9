name: Spanish Philemon Audit

on:
  push:
    paths:
      - 'philemon-study.html'
      - 'philemon-study-data.js'
      - 'philemon-study-guide.js'
      - 'philemon-study-data-es.js'
      - 'es/filemon-estudio.html'
      - 'es/estudios-biblicos.html'
      - 'nldg-i18n.js'
      - 'scripts/spanish-philemon-audit.mjs'
      - '.github/workflows/spanish-philemon-audit.yml'
  pull_request:
    paths:
      - 'philemon-study.html'
      - 'philemon-study-data.js'
      - 'philemon-study-guide.js'
      - 'philemon-study-data-es.js'
      - 'es/filemon-estudio.html'
      - 'es/estudios-biblicos.html'
      - 'nldg-i18n.js'
      - 'scripts/spanish-philemon-audit.mjs'
      - '.github/workflows/spanish-philemon-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spanish-philemon:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit Spanish Philemon study
        run: node scripts/spanish-philemon-audit.mjs
