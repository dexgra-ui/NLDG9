<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071735">
<title>Host Game Checklist | No Labels, Designed by God</title>
<style>
:root{--gold:#ffd34e;--text:#f7f9ff;--muted:#cbd5f3;--line:rgba(255,255,255,.16)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#1d4c9e 0,#081735 42%,#030713 100%);color:var(--text)}body{padding:18px}.page{max-width:1000px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border:1px solid var(--line);border-radius:18px;background:rgba(5,16,44,.95)}.brand{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none}.brand img{width:52px;height:52px;object-fit:contain}.brand small{display:block;color:var(--muted)}.btn{border:1px solid var(--line);border-radius:12px;padding:11px 15px;font-weight:900;background:#243b78;color:#fff;text-decoration:none;cursor:pointer}.hero{text-align:center;padding:42px 12px 22px}.hero h1{font-size:clamp(38px,7vw,70px);margin:0}.hero p{color:var(--muted);font-size:1.1rem}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{padding:20px;border:1px solid var(--line);border-radius:20px;background:rgba(10,25,64,.92)}.card h2{margin-top:0;color:var(--gold)}.check{display:flex;align-items:flex-start;gap:10px;margin:12px 0;line-height:1.4}.check input{width:22px;height:22px;flex:0 0 auto}.wide{grid-column:1/-1}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:22px 0}@media(max-width:760px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}@media print{body{background:#fff;color:#111;padding:0}.top,.actions{display:none}.hero{padding:10px}.hero p{color:#333}.grid{gap:8px}.card{background:#fff;border:1px solid #777;break-inside:avoid}.card h2{color:#111}.check{margin:7px 0}}
</style>
</head>
<body><main class="page">
<header class="top"><a class="brand" href="play.html"><img src="no-labels-approved-logo.png" alt=""><span><strong>No Labels Games</strong><small>Host preparation</small></span></a><a class="btn" href="play.html">Game Center</a></header>
<section class="hero"><h1>Host Game Checklist</h1><p>Use this before Bible study, youth night, family game night, or a church presentation.</p></section>
<section class="grid">
<div class="card"><h2>Before people arrive</h2>
<label class="check"><input type="checkbox">Open the Game Center and confirm it loads.</label>
<label class="check"><input type="checkbox">Choose the correct audience.</label>
<label class="check"><input type="checkbox">Set the number of teams and team names.</label>
<label class="check"><input type="checkbox">Confirm the starting team.</label>
<label class="check"><input type="checkbox">Test one correct and one incorrect answer.</label>
<label class="check"><input type="checkbox">Test team rotation.</label>
<label class="check"><input type="checkbox">Test +100, -100, Undo, Skip, and Reset.</label>
<label class="check"><input type="checkbox">Confirm sound and celebrations fit the room.</label>
</div>
<div class="card"><h2>Presentation setup</h2>
<label class="check"><input type="checkbox">Connect to the TV or projector.</label>
<label class="check"><input type="checkbox">Confirm the display is mirrored.</label>
<label class="check"><input type="checkbox">Enter fullscreen mode.</label>
<label class="check"><input type="checkbox">Check readability from the back of the room.</label>
<label class="check"><input type="checkbox">Confirm host controls remain reachable.</label>
<label class="check"><input type="checkbox">Turn off notifications and screen locking.</label>
<label class="check"><input type="checkbox">Connect the host device to power.</label>
</div>
<div class="card"><h2>Quiz games</h2>
<label class="check"><input type="checkbox">Answer buttons respond only once.</label>
<label class="check"><input type="checkbox">Correct answers award points once.</label>
<label class="check"><input type="checkbox">Next Question advances and changes teams.</label>
<label class="check"><input type="checkbox">Lightning Round timer starts and expires.</label>
</div>
<div class="card"><h2>Memory and Jeopardy</h2>
<label class="check"><input type="checkbox">Memory cards open and close correctly.</label>
<label class="check"><input type="checkbox">A match awards points once.</label>
<label class="check"><input type="checkbox">A missed match changes teams.</label>
<label class="check"><input type="checkbox">Jeopardy awards the displayed value.</label>
<label class="check"><input type="checkbox">No Award advances without changing score.</label>
</div>
<div class="card wide"><h2>After the event</h2>
<label class="check"><input type="checkbox">Record confusing questions, scoring errors, display problems, or slow controls.</label>
<label class="check"><input type="checkbox">Note the device, browser, game, audience, and number of teams involved.</label>
<label class="check"><input type="checkbox">Reset recent-question history only when a fresh rotation is needed.</label>
</div>
</section>
<div class="actions"><button class="btn" onclick="window.print()">Print Checklist</button><button class="btn" onclick="document.querySelectorAll('input[type=checkbox]').forEach(box=>box.checked=false)">Clear Checks</button><a class="btn" href="play.html">Return to Game Center</a></div>
</main></body></html>
